    { id:"walter", name:"Walter Alvin Christoffersen", b:"1900", d:"", gen:3, line:"chr", direct:true, place:"Chicago → Jersey City, NJ", role:"",
      lede:"Born April 20, 1900, at Jefferson Park on Chicago's northwest side, to a Danish father and a Norwegian mother, and enumerated in the 1900 census at zero days old. The family had moved to Jersey City by 1920, where he registered for the draft. Married Louise Mihm; by 1930 they had Inga, Raymond, and Doris, and by 1940 Evelyn, Lucille, and Barbara Jane as well.",
      facts:{ Spouse:"Louise S. Mihm (b. c. 1890)", Children:"Inga (c. 1924), Raymond (c. 1929), Evelyn Ruth (1930), Doris, Lucille (c. 1933), Barbara Jane (c. 1937)" },
      sources:[S.c1900chi, S.walterRecs, S.c1940jc, S.fsWalter] },
    { id:"louise", name:"Louise S. Mihm Christoffersen", b:"1890", d:"1977", gen:3, line:"other", direct:true, place:"Jersey City → Atlantic City, NJ", role:"",
      lede:"Sophie Louise Mihm, born June 1890 in Jersey City (June 19 by her birth record, June 14 by her Social Security record), eldest child of Joseph Mihm, a New York–born son of German parents, and Louisa Mayer. Called Lulu as a girl: the 1900 census has Lulu, 10, in her parents' house in the second ward with her grandfather Jacob Mayer, 70, from Germany, and three Mayer uncles and aunts, and she was Lulu again to the census-taker of 1930. Still single at 32 and living with her father in 1922, she married Walter Christoffersen, ten years younger, about 1923, and had six children between 1924 and 1937 in Jersey City's seventh ward. Widowed by April 1950, when she headed the household with Raymond and Lucille; at 52 Bergen Avenue in 1948. Died September 1977, her last address in Atlantic City; buried at Belvidere Cemetery, Warren County.",
      facts:{ Parents:"Joseph Mihm (b. Dec 1867, NY) and Louisa Mayer (b. Apr 1872, NY)", Siblings:"Lena (c. 1893), Joseph Nicholas (1895–1918), Francis (c. 1901)", Children:"Inga, Raymond, Evelyn Ruth, Doris, Lucille, Barbara Jane" }, sources:[S.c1900mihm, S.fsSophieMihm, S.dir1922jc, S.c1940jc, S.c1950jc, S.ssdiLouise, S.fgLouise, S.obitJosephMihm1918, S.fsLouise, S.walterRecs, S.gbEngage1948] },
    { id:"josephmihm", name:"Joseph Mihm", b:"1867", d:"", gen:4, line:"other", lineLabel:"Mihm line", direct:true, place:"New York → Jersey City, NJ", role:"",
      lede:"Born December 1867 in New York to German parents. Married Louisa Mayer about 1888; four children, Sophie Louise (1890), Lena (c. 1893), Joseph Nicholas (1895–1918), and Francis (c. 1901). Head of a household in Jersey City's second ward in 1900 that also held his father-in-law Jacob Mayer and three of Louisa's siblings. Lost his son Joseph at 23 in May 1918. Still in Jersey City in 1922 with his unmarried daughter Louise at home.",
      facts:{ Spouse:"Louisa Mayer, m. c. 1888" }, sources:[S.c1900mihm, S.fsSophieMihm, S.dir1922jc, S.obitJosephMihm1918] },
    { id:"louisamayer", name:"Louisa Mayer Mihm", short:"Louisa Mayer", b:"1872", d:"", gen:4, line:"other", direct:true, place:"New York → Jersey City, NJ", role:"",
      lede:"Born April 1872 in New York, daughter of Jacob Mayer, a German immigrant. Married Joseph Mihm about 1888, at sixteen; her daughter Louise carried her name. In 1900 her widowed father and her brothers George and John and sister Sophie were living with the Mihms in Jersey City.",
      facts:{ Father:"Jacob Mayer (c. 1830, Germany)", Siblings:"George (c. 1865), John (c. 1877), Sophie (c. 1879)" }, sources:[S.c1900mihm, S.fsSophieMihm] },
    { id:"jacobmayer", name:"Jacob Mayer", b:"c. 1830", d:"", gen:5, line:"other", lineLabel:"Mihm line", direct:true, place:"Germany → New York → Jersey City, NJ", role:"",
      lede:"Born about 1830 in Germany. His children were born in New York from the 1860s and in New Jersey by the late 1870s. Seventy and living with his daughter Louisa Mihm in Jersey City in 1900, recorded as the head's maternal grandfather, with three of his own children still at home.",
      facts:{ Children:"George (c. 1865), Louisa (1872), John (c. 1877), Sophie (c. 1879)" }, sources:[S.c1900mihm] },
    { id:"levi1865", name:"Levi Nickerson", b:"1865", d:"1926", gen:4, line:"nick", direct:true, place:"Coeymans, Albany Co., NY", role:"",
      lede:"Born January 1865 in Albany County, son of Stephen Smith Nickerson and Melvina Baumes. Married Orpha (Castle or Caswell), born 1876. Farmed at Coeymans, where the family appears in the 1905, 1910, and 1920 censuses. Died 1926.",
      facts:{ Spouse:"Orpha Castle/Caswell (b. 1876)", Children:"Ethel M. (1893), Earl L. (1897), Stephen J. (1900)" }, sources:[S.fsLevi1865, S.stephenRecs] },
    { id:"orpha", name:"Orpha Castle Nickerson", b:"1876", d:"", gen:4, line:"other", direct:true, place:"Coeymans, NY → Bayonne, NJ", role:"", lede:"Born 1876; surname recorded as Castle or Caswell. Widowed in 1926; living with her son Stephen's family in Bayonne in 1940, where the census indexer recorded her as Orpha Kerr.", facts:{}, sources:[S.fsLevi1865, S.stephenRecs] },
    { id:"stephensmith", name:"Stephen Smith Nickerson", b:"1833", d:"1908", gen:5, line:"nick", direct:true, place:"Coeymans & Ravena, Albany Co., NY", role:"",
      lede:"Born September 23, 1833, in Coeymans, son of Levi Nickerson, then 70, and Levi's second wife Huldah Meech. Lived his whole life in Coeymans, appearing in every state and federal census from 1850 to 1905. Married Melvina Baumes. Died October 19, 1908, at Ravena.",
      facts:{ Spouse:"Melvina Baumes (1843–1898)", Children:"Three, incl. Levi (1865)" }, sources:[S.fsStephenSmith, S.fsLevi1865] },
    { id:"melvina", name:"Melvina Baumes Nickerson", b:"1843", d:"1898", gen:5, line:"other", direct:true, place:"Albany Co., NY", role:"", lede:"Born 1843; died 1898 in Albany County.", facts:{}, sources:[S.fsMelvina, S.fsStephenSmith] },
    { id:"levi1763", name:"Levi Nickerson", b:"1763", d:"1847", gen:6, line:"nick", direct:true, place:"Ridgefield, CT → Coeymans, NY", role:"Settled Coeymans by 1800",
      lede:"Born 1763 in Ridgefield, Connecticut, one of nine sons of Eliphaz Nickerson. Moved to Coeymans on the Hudson below Albany, where he appears in every census from 1800 to 1840. Married first Amy (1766–1816), then about 1819 Huldah Meech, 35 years younger; Stephen Smith was born of the second marriage when Levi was 70. Died May 9, 1847; buried at Onesquethaw Cemetery, Feura Bush.",
      facts:{ Spouses:"Amy (1766–1816); Huldah Meech (1798–1860), m. c. 1819", Children:"Seven" }, sources:[S.fsLevi1763, S.fsEliphaz] },
    { id:"huldah", name:"Huldah Meech Nickerson", b:"1798", d:"1860", gen:6, line:"other", direct:true, place:"Coeymans, NY", role:"", lede:"Second wife of Levi Nickerson, married about 1819; mother of Stephen Smith Nickerson. Died 1860.", facts:{}, sources:[S.fsHuldah, S.fsLevi1763] },
    { id:"eliphaz", name:"Eliphaz Nickerson", b:"1739", d:"1794", gen:7, line:"nick", direct:true, place:"Chatham, MA → Ridgefield, CT", role:"",
      lede:"Born 1739 in Chatham on Cape Cod. Moved with his father to Ridgefield, Connecticut, where he married Sybil Norris in April 1757 and raised nine sons, several with Old Testament names of the period: Joseph Norris, Eliphaz, Jonathan, Levi, Asahel, Abijah, Omri, Ezra, and James Allen. In Ridgefield in the 1790 census. Died 1794; buried at Titicus Cemetery, Ridgefield.",
      facts:{ Spouse:"Sybil Norris (b. 1740), m. April 1757, Ridgefield" }, sources:[S.fsEliphaz, S.fsJames] },
    { id:"sybil", name:"Sybil Norris Nickerson", b:"1740", d:"", gen:7, line:"other", direct:true, place:"Ridgefield, CT", role:"", lede:"Married Eliphaz Nickerson in April 1757 in Ridgefield (Connecticut vital records); mother of nine sons.", facts:{}, sources:[S.fsSybil, S.fsEliphaz] },
    { id:"jamesn", name:"James Nickerson", b:"1704", d:"1757", gen:8, line:"nick", direct:true, place:"Chatham, MA → Ridgefield, CT", role:"Left Cape Cod for Connecticut",
      lede:"Born July 28, 1704, son of Ensign William Nickerson, in what was still the constablewick of Monomoit; it was incorporated as Chatham on June 11, 1712, when he was seven. Married Dorcas Covel there in 1729; five sons and two daughters. The first of the line to leave the Nickerson neighborhood on the Cape: he moved the family to Fairfield County, Connecticut, and died there in 1757, at Ridgefield or Danbury.",
      facts:{ Spouse:"Dorcas Hannah Covel (1714–1803), m. 1729, Chatham", Children:"Marcy, Joseph, William, Eliphaz, Samuel, Ezra, Dorcas" }, sources:[S.fsJames, S.fsDorcas, S.nfaComeToTown] },
    { id:"dorcas", name:"Dorcas Covel Nickerson", b:"1714", d:"1803", gen:8, line:"other", direct:true, place:"Chatham, MA → Connecticut", role:"", lede:"Married James Nickerson in Chatham in 1729; lived to 89.", facts:{}, sources:[S.fsDorcas, S.fsJames] },
    { id:"ensign", name:"Ensign William Nickerson", b:"1668", d:"1742", gen:9, line:"nick", direct:true, place:"Chatham, MA", role:"Tanner; militia ensign",
      lede:"Born about 1668 in the Nickerson settlement at Monomoit, a few years after his grandfather built the homestead at Ryder's Cove, and in the year his parents married. Styled Ensign from about 1706 as leader of the militia company; he was in that office when Monomoit, which had needed a resident minister and the population to keep one before it could incorporate, became the town of Chatham on June 11, 1712, the goal his grandfather had set and, in the Family Association's telling, his children and grandchildren achieved. A tanner at Cotchpinicut (Old Harbor), supplying the boots, shoes, and leather breeches nearly every man wore at work; he also held land at Monomessett (Nickerson's) Neck from his father, and left the tannery to his sons Caleb, Nathaniel, and Eldad. Married Deliverance Lombard before 1701 and, after her death, Hannah Atwood on October 24, 1717. Died November 15, 1742; buried at People's Cemetery, Chatham.",
      facts:{ Spouses:"Deliverance Lombard (1680–1716); Anna Hannah Atwood (1688–1764), m. 1717", Children:"Twelve, incl. William, James, Nathaniel, Joshua, Elizabeth" }, sources:[S.fsEnsign, S.fsWmJr, S.nfaComeToTown] },
    { id:"deliverance", name:"Deliverance Lombard Nickerson", b:"1680", d:"1716", gen:9, line:"other", direct:true, place:"Chatham, MA", role:"", lede:"First wife of Ensign William Nickerson; mother of his first nine children. Died 1716.", facts:{}, sources:[S.fsDeliverance, S.fsEnsign] },
    { id:"williamjr", name:"William Nickerson Jr.", b:"1646", d:"1719", gen:10, line:"nick", direct:true, place:"Yarmouth → Chatham, MA", role:"",
      lede:"Born June 1, 1646, in Yarmouth on Cape Cod, where his parents had settled by 1640, one of the children born after the family's 1637 crossing. He was ten when his father bought Monomoit from Mattaquason in 1656 and about eighteen when the homestead went up at Ryder's Cove. Married Mercy Williams on November 30, 1668, in Chatham, so he was among the grown children to whom, as the Family Association's history tells it, William deeded land and who settled with their families around the cove. Fourteen children. He outlived the constablewick: Monomoit was incorporated as Chatham on June 11, 1712, seven years before he died there on April 7, 1719.",
      facts:{ Spouse:"Mercy Williams (1643–1739), m. Nov. 30, 1668" }, sources:[S.fsWmJr, S.fsMercy, S.nfaComeToTown] },
    { id:"mercy", name:"Mercy Williams Nickerson", b:"1643", d:"1739", gen:10, line:"other", direct:true, place:"Chatham, MA", role:"", lede:"Married William Nickerson Jr. in 1668; lived to 96.", facts:{}, sources:[S.fsMercy, S.fsWmJr] },
    { id:"williamsr", name:"William Nickerson", b:"1604", d:"1690", gen:11, line:"nick", direct:true, place:"Norwich, England → Chatham, MA", role:"Founder of Chatham",
      lede:"Born in England in 1603 or 1604; a weaver of Norwich, Norfolk. Married Anne Busby there on June 24, 1627, and had four children in Norwich. Puritan Congregationalists, the family left to escape religious persecution: the Family Association's history has them sailing on April 15, 1637, with Anne's parents Nicholas and Bridget Busby and about a hundred others, on either the Rose or the John and Dorothy, two ships under a father and son, and landing at Salem on June 20. Five more children were born around Boston. By 1640 they were among the first settlers of Yarmouth on Cape Cod. In 1656 he bought about a thousand acres, four square miles of Monomoit, from the sachem Mattaquason for a shallop, ten coats, six kettles, twelve axes, twelve hoes, twelve knives, forty shillings in wampum, a hat, and twelve shillings in coin. He had not asked Plymouth Colony's leave, and sixteen years of dispute followed before he settled the matter in 1672 for ninety pounds. About 1664, aged about sixty, he built his homestead near the head of Ryder's Cove, deeded land to his grown children, who settled around the cove with their families in low cottages banked with dried seaweed, and held church services in his own house, the beginning of Chatham's Congregational church; in William Smith's phrase, for the next twenty-five years the place was “but little more than a Nickerson neighborhood.” He wanted the constablewick made a town, which required a resident minister and the population to support one; his children and grandchildren saw it done on June 11, 1712, when Monomoit was incorporated as Chatham. He and Anne lived in the homestead until their deaths in the late 1680s. By 1790 twenty of Chatham's 193 households were Nickersons; by 1915 his descendants were reckoned at fifty thousand. Savage has him aged 33 in 1637, with his wife Ann, eldest daughter of Nicholas Busby, aged 28, and names the four children who crossed with them: Nicholas, Robert, Elizabeth, and Ann. He puts the embarkation at Ipswich or Yarmouth on April 8 and the landing at Boston, not Salem, and has him admitted freeman on May 2, 1638.",
      facts:{ Spouse:"Anne Busby (1607–1686), m. June 24, 1627, Norwich", Children:"Ten, incl. Nicholas, Elizabeth, Robert, Anne, William", Purchase:"c. 1,000 acres of Monomoit from Mattaquason, 1656; title settled with Plymouth Colony, 1672, £90", Homestead:"Head of Ryder's Cove, Chatham, c. 1664" }, sources:[S.nfaComeToTown, S.nfaJourney2, S.nfaJourney3, S.fsWmSr, S.fsWmJr, S.nfa, S.nfaHist] },
    { id:"elizabethn", name:"Elizabeth Nickerson Eldred", b:"", d:"", gen:10, line:"nick", place:"Norwich, England → Yarmouth, MA", role:"Crossed in 1637",
      lede:"One of the four Nickerson children born at Norwich who crossed with their parents and grandparents in 1637. She married Robert Eldred of Yarmouth in the last week of October 1649 and had a son Nicholas, born August 18, 1650, who became Chatham's first representative under the new charter in 1692 and died April 30, 1702.",
      facts:{ Spouse:"Robert Eldred of Yarmouth, m. Oct. 1649", Children:"Nicholas Eldred (1650–1702)" }, sources:[S.sav2, S.sav3] },
    { id:"annn", name:"Ann Nickerson Hedges", b:"", d:"", gen:10, line:"nick", place:"Norwich, England → Boston", role:"Crossed in 1637",
      lede:"One of the four Nickerson children born at Norwich who crossed in 1637, named for her mother. She married Tristram Hedges of Boston on December 20, 1657, and had a daughter Grace, born August 20, 1659.",
      facts:{ Spouse:"Tristram Hedges of Boston, m. 20 Dec 1657", Children:"Grace (1659)" }, sources:[S.sav2, S.sav3] },
    { id:"anne", name:"Anne Busby Nickerson", b:"1607", d:"1686", gen:11, line:"other", direct:true, place:"Norwich, England → Chatham, MA", role:"",
      lede:"Eldest daughter of Nicholas and Bridget Busby of Norwich — “Anne Nickerson my Eldest daughter” in her father's will, which leaves her fifty pounds and the thick Bible — and about five years younger than her husband. Savage gives her age as 28 in 1637, putting her birth about 1609 rather than the 1607 the tree carries. Married William Nickerson in Norwich in 1627 and bore four children there — Nicholas, Robert, Elizabeth, and Ann — who all crossed with them in 1637, together with both her parents; five more children followed around Boston. She was in her mid-fifties when the family built its homestead at the head of Ryder’s Cove about 1664, and lived there until her death in the late 1680s. Mother of ten.",
      facts:{}, sources:[S.sav3, S.nfaComeToTown, S.nfaJourney2, S.fsAnne, S.fsWmSr, S.nfaHist] },
    { id:"nicholasbusby", name:"Nicholas Busby", b:"c. 1587", d:"1657", gen:12, line:"other", lineLabel:"Busby line", direct:true, place:"Norwich, England → Watertown & Boston, MA", role:"Weaver; crossed in 1637",
      lede:"A weaver of Norwich and father of Anne Busby Nickerson. With his wife Bridget he joined his daughter's family for the 1637 crossing, one of the eight in the Nickerson party. Savage has him landing on June 20, 1637, aged 50, with Bridget, 53, and four children, Nicholas, John, Abraham, and Sarah. He settled first at Watertown, was made freeman in March 1638, served as selectman in 1640 and 1641, moved to Boston in 1646, was constable there in 1649, and died August 28, 1657. His will of July 25 that year left “all his books of physic” to his eldest son John, then in England, and his books of divinity to Abraham; it names his eldest daughter Ann, wife of William Nickerson of Boston, weaver; his daughter Catharine Savory; his youngest daughter Sarah, wife of John Grout of Sudbury and before that of Capt. Thomas Cakebread; and his grandson Joseph. A man leaving separate libraries of physic and divinity was a reader of some means. The will has now been read, in the Suffolk County register at volume pages 308–311 — the record copy rather than the sheet he signed, the clerk noting only “By me Nicholas Busby & a seale.” It confirms Savage to the day and settles the join between the two families from the father's own side: he appoints “my three sonnes that are heere in New England, that is to say my sonne Abraham Busby, & my sonne William Nickerson, & my sonne John Grout” to gather in his debts, and leaves fifty pounds to “Anne Nickerson my Eldest daughter.” The bequests run: John, “my Eldest sonne,” seventy pounds on top of thirty already sent; Abraham sixty and, after his mother's death, the Boston house with its garden and fruit trees; Anne fifty; Kathrine Savory forty; Sarah Grout sixty-five; the grandson Joseph twenty; a granddaughter Sarah Grout ten. The libraries are itemised — Barrough, Cogan, a Garden of Health, Phillips's Natural History to John; Perkins, Willet, a commentary on Romans and two of Cicero to Abraham — and the three Bibles parted among the daughters, the thick one to Anne, the best to Sarah, the one in his hamper to Kathrine. His trade closes it: two looms, one to John “in case hee come over to New England, or else to William Nickerson,” the other with its warping bars, bobbins, wheels and shuttles to Abraham. Witnessed by Nathaniell Woodward and Wm Pearse, who deposed to it before the magistrates on September 10, 1657.",
      facts:{ Spouse:"Bridget Busby", Children:"Ann, Nicholas, John, Abraham, Catharine, Sarah", Offices:"Freeman 1638; selectman of Watertown 1640, 1641; constable of Boston 1649", Will:"25 July 1657; read in full, naming six children and two grandchildren", Estate:"A house and garden in Boston, a farm, two looms, and libraries of physic and divinity" },
      sources:[S.ancBusbyWill, S.sav1, S.nfaComeToTown, S.nfaJourney2] },
    { id:"bridgetbusby", name:"Bridget Busby", b:"c. 1584", d:"c. 1660", gen:12, line:"other", lineLabel:"Busby line", direct:true, place:"Norwich, England → Watertown & Boston, MA", role:"Crossed in 1637",
      lede:"Mother of Anne Busby Nickerson. Savage gives her age as 53 when the family landed on June 20, 1637, which puts her birth about 1584 and makes her some three years older than her husband. She crossed from Norwich with Nicholas and the Nickersons, settled at Watertown, and moved with him to Boston in 1646. She survived him by three or four years.",
      facts:{ Spouse:"Nicholas Busby", Children:"Six, incl. Ann, Nicholas, John, Abraham, Sarah" }, sources:[S.sav1, S.nfaComeToTown, S.nfaJourney2] },
    { id:"nicholasbusbyjr", name:"Nicholas Busby Jr.", b:"", d:"bef. 1657", gen:11, line:"other", lineLabel:"Busby line", place:"Norwich, England → Boston", role:"Crossed in 1637",
      lede:"Born in England and one of the four Busby children who crossed in 1637. Savage takes him for the eldest son, though the will of 1657 gives that place to John — Nicholas being dead by then, the two need not conflict. Married in 1652 Martha, daughter of John Cheney and the young widow of Anthony Sadler, and had a son Joseph, whom his grandfather’s will names as “Joseph Busby the Sonne of my Sonne Nicholas Busby deceased” and leaves twenty pounds.",
      facts:{ Spouse:"Martha Cheney, widow of Anthony Sadler, m. 1652", Children:"Joseph" }, sources:[S.sav1] },
    { id:"johnbusby", name:"John Busby", b:"", d:"", gen:11, line:"other", lineLabel:"Busby line", place:"Norwich → New England → England", role:"Crossed in 1637",
      lede:"One of the four Busby children who crossed in 1637, and the son his father’s will of 1657 calls “my Eldest sonne,” his elder brother Nicholas being dead by then. It leaves him seventy pounds beyond thirty already sent, the black stuff cloak, the books of physic by name, and one of the two looms “in case hee come over to New England” — he was in England when it was written, and that clause is the measure of how likely his father thought a return. Nothing further about him has been looked for.",
      facts:{ Legacy:"£70, the black stuff cloak, the books of physic, and a loom if he returned, 1657" }, sources:[S.sav1] },
    { id:"abrahambusby", name:"Abraham Busby", b:"", d:"1687", gen:11, line:"other", lineLabel:"Busby line", place:"Norwich, England → Boston", role:"Linen-weaver; crossed in 1637",
      lede:"One of the four Busby children who crossed in 1637. A linen-weaver of Boston, of the Artillery Company in 1647 and a freeman in 1650, he took his father's books of divinity under the 1657 will, with sixty pounds, the second loom and all its gear, and the Boston house and garden after his mother's death; he is also one of the three “sonnes” the will names to gather in the estate's debts. He married on September 23, 1659, apparently as a second wife, Abigail, widow of Joseph Briscoe, and died March 20, 1687.",
      facts:{ Spouse:"Abigail, widow of Joseph Briscoe, m. 23 Sep 1659" }, sources:[S.sav1] },
    { id:"catharinebusby", name:"Catharine Busby Savory", b:"", d:"", gen:11, line:"other", lineLabel:"Busby line", place:"New England", role:"",
      lede:"A daughter named in her father’s will of 1657 as Kathrine Savory, so married by then. It leaves her forty pounds “more then that I sent her the Last yeare” and the Bible in his hamper — the phrasing of a father already supporting a married daughter at a distance. She is not among the four children Savage lists as crossing in 1637, and whether she was born in England or in New England is not established.",
      facts:{ "Married name":"Savory, by 1657" }, sources:[S.sav1] },
    { id:"sarahbusby", name:"Sarah Busby Grout", b:"", d:"", gen:11, line:"other", lineLabel:"Busby line", place:"Norwich, England → Sudbury, MA", role:"Crossed in 1637",
      lede:"The youngest Busby daughter — “Sarah Grout my youngest daughter” in her father's will, which leaves her sixty-five pounds and the best of his three Bibles — and one of the four children who crossed in 1637. She married first Capt. Thomas Cakebread and second John Grout of Sudbury — a selectman, town clerk, and captain who was seventy in 1689 and died in 1697 — and by Grout had six children.",
      facts:{ Spouses:"Capt. Thomas Cakebread; John Grout of Sudbury", Children:"John, Sarah, Joseph, Abigail, Jonathan, Elizabeth" }, sources:[S.sav1, S.sav2] },


    // ---- Christoffersen / Olsen ----
    { id:"martinc", name:"Martin Christoffersen", b:"1864", d:"", gen:4, line:"chr", direct:true, place:"Denmark → Chicago → Kearny & Jersey City, NJ", role:"Immigrant, 1885",
      lede:"Born January 1864 in Denmark, son of Hans Jacob Christoffersen and Karen. Came to the United States in 1885. Married Inger Mathilde Olsen in a Lutheran church in Chicago on November 7, 1891. Living at Jefferson Park on Chicago's northwest side in 1900 with five children; in Kearny, New Jersey, by 1915 and Jersey City by 1920, where he and Inger, recorded as Christina, were still living in 1930. His son Charles died in New York City. His home parish in Denmark has not been identified; the Copenhagen police emigration registers for 1885 record last residence for every departing emigrant.",
      facts:{ Spouse:"Inger Mathilde Olsen (1868–), m. Nov. 7, 1891, Chicago", Children:"Charles (1892), Olaf (1894), Inga (1897), Martin (1899), Walter (1900)" },
      sources:[S.marriage1891, S.c1900chi, S.martinNJ, S.udvandrer] },
    { id:"ingasr", name:"Inger Mathilde Olsen Christoffersen", b:"1868", d:"", gen:4, line:"chr", direct:true, place:"Egersund, Rogaland, Norway → Chicago → Jersey City", role:"",
      lede:"Born December 25, 1868, in Egersund, a fishing and pottery town on the southwest coast of Norway, and baptized there January 3, 1869, daughter of Otto Johan Olsen and Olava Olsdatter. Emigrated to Chicago and married Martin Christoffersen there on November 7, 1891. Recorded as Enga, Inga, Cristena, and Christina in American censuses. Her granddaughter Inga carries her name.",
      facts:{ Parents:"Otto Johan Olsen and Olava Olsdatter, Egersund", Children:"Charles, Olaf, Inga, Martin, Walter" }, sources:[S.ingerBapt, S.marriage1891, S.c1900chi, S.martinNJ] },
    { id:"hansjacob", name:"Hans Jacob Christoffersen", b:"", d:"", gen:5, line:"chr", direct:true, place:"Denmark", role:"", lede:"Named, with his wife Karen, as Martin's parents in the 1891 Chicago marriage record. Under Danish naming custom of the 1860s a son of his would ordinarily have been baptized Martin Hansen, taking Christoffersen as a fixed surname later; his parish has not yet been identified.", facts:{ Spouse:"Karen" }, sources:[S.marriage1891] },
    { id:"karen", name:"Karen Christoffersen", b:"", d:"", gen:5, line:"other", direct:true, place:"Denmark", role:"", lede:"Mother of Martin Christoffersen, per the 1891 marriage record; maiden name not recorded there.", facts:{}, sources:[S.marriage1891] },
    { id:"otto", name:"Otto Johan Olsen", b:"1845", d:"", gen:5, line:"chr", direct:true, place:"Egersund, Rogaland, Norway", role:"",
      lede:"Born July 8, 1845, in Egersund and baptized there August 31, son of Ole Andreas Olsen and Inger Marie Thorsdatter. A cooper (bødker), like his father. Married Olava Olsdatter, 18, at Egersund church on October 18, 1866 (Eigersund parish book 1866–1878, p. 381, entry 28), the banns read on three Sundays from September 16; Svend Staalesen and Andreas Christoffersen stood as sponsors. Four children were baptized at Egersund between 1867 and 1874, his father standing sponsor for the first and the last. In 1870 the family was at Nyalmendingen 202 with Olava's mother; by 1875, at Storgade 150, he had left the cooper's trade to work as a shop assistant at the Brænderionsamlaget, the town's distillery cooperative, and was supporting his mother-in-law under his roof.",
      facts:{ Spouse:"Olava Olsdatter (1849–), m. Oct. 18, 1866", Children:"Ole Ingeman (1867), Inger Mathilde (1868), Ingeborg Andrea (1871), Marthe (1874)" }, sources:[S.ottoBapt, S.daOttoMarr, S.ottoMarr, S.daOleIngeman, S.da1870, S.daIngeborg, S.daMarthe1874, S.da1875, S.fsOtto] },
    { id:"olava", name:"Olava Olsdatter Olsen", b:"1849", d:"", gen:5, line:"other", direct:true, place:"Dyrnæs → Egersund, Rogaland, Norway", role:"Seamstress",
      lede:"Born January 25, 1849, at Dyrnæs in the Eigersund country parish, a twin, to Marthe Olsdatter, an unmarried servant girl there, who named Ole Olsen of Egersund as the father; baptized Olave at Egersund on February 25, 1849, with the pastor's note that the child was a twin and the father named by the mother. Her twin does not appear in the register. Confirmed at Egersund on October 4, 1863, her birthplace given as Grastvedt, her knowledge graded “good,” with Ole Olsen and Marthe Olsdatter recorded as her parents. In December 1865 she was a seamstress, 18, living with her mother in a rented room at Storgaden 182 in the town. Married the cooper Otto Johan Olsen on October 18, 1866, at 18. Four children: Ole Ingeman (1867), Inger Mathilde (1868), Ingeborg Andrea (1871), and Marthe (1874), the daughter named for her mother, who lived with the family from at least 1870 until 1875. Her later life has not been traced; her daughter Inger Mathilde emigrated to Chicago.",
      facts:{ Parents:"Ole Olsen of Egersund and Marthe Olsdatter of Dyrnæs (not married)", Children:"Ole Ingeman (1867), Inger Mathilde (1868), Ingeborg Andrea (1871), Marthe (1874)" }, sources:[S.daOlavaBapt, S.daOlavaConf, S.da1865, S.daOttoMarr, S.daOleIngeman, S.da1870, S.daIngeborg, S.daMarthe1874, S.da1875, S.fsOlava] },
    { id:"marthe", name:"Marthe Olsdatter", b:"c. 1820", d:"", gen:6, line:"other", lineLabel:"Egersund line", direct:true, place:"Dyrnæs, Eigersund → Egersund, Rogaland, Norway", role:"Spinner and washerwoman",
      lede:"Born about 1820 in the Eigersund country parish. An unmarried servant girl (Pige) at Dyrnæs when she bore twins in January 1849, naming Ole Olsen of Egersund as their father; only Olava appears in the baptismal register. She never married. In 1865 she was a worker at the spinning mill, 45, sharing a room at Storgaden 182 in the town with her daughter, a seamstress. In 1870, recorded as Martha Olsdatter Dyrnæs, she was a washerwoman living with Otto and Olava at Nyalmendingen; in 1875, at Storgade 150, the census-taker wrote that she was “supported by her son-in-law Otto Joh. Olsen.” Her granddaughter Marthe, baptized in 1874, carries her name.",
      facts:{}, sources:[S.daOlavaBapt, S.daOlavaConf, S.da1865, S.da1870, S.da1875] },
    { id:"oleandreas", name:"Ole Andreas Olsen", b:"c. 1813", d:"", gen:6, line:"chr", direct:true, place:"Hitterø (Hidra), Vest-Agder → Egersund, Rogaland, Norway", role:"Cooper (bødker)", lede:"Not an Egersund man at all, as the tree long assumed. The 1865 census records him at Mosbækveien in Egersund, aged 52, a cooper, and gives his birthplace as <b>Hitterø Sogn</b> — Hidra, the island parish off Flekkefjord in Vest-Agder, some fifty miles down the coast. He married Inger Marie Thorsdatter at <b>Søgne</b> on May 1, 1838, he then of Vesdal and she of Hellervig, so the wedding was in her parish rather than his or theirs. The register gives his age as <b>25¼</b>, which places his birth about February 1813, and calls him plainly “of Hitterøe Sogn.” They settled at Egersund, where the baptism registers show him as father in 1841, 1843, 1845, 1848, 1853 and 1860. Four of those children were still at home in 1865: Otto Johan the cooper, Olai the pottery worker, Tellemine, and a younger Olava.", facts:{ Spouse:"Inger Marie Thorsdatter, m. 1 May 1838 at Søgne", Born:"About February 1813 at Hitterø (Hidra), Vest-Agder", Age:"25¼ at his marriage, per the register", Trade:"Cooper", Children:"At least six, baptised 1841–1860" }, sources:[S.daSogneImg, S.da1865, S.daSogne1838, S.ottoBapt, S.ottoMarr] },
    { id:"ingermarie", name:"Inger Marie Thorsdatter", b:"c. 1814", d:"", gen:6, line:"other", direct:true, place:"Søgne, Vest-Agder → Egersund, Rogaland, Norway", role:"", lede:"From <b>Søgne</b> in Vest-Agder, not from Egersund: the 1865 census gives her birthplace and her age as 51. She was living at Hellervig in her own parish when she married Ole Andreas Olsen there on May 1, 1838, and moved up the coast to Egersund with him. Her father is now named. The marriage register's <i>forlovere</i> — the two sureties who stood for the couple — are <b>Thor Svenumsen Hellervig</b> and Ole Larsen Lindelien, and the first of those answers to her father on every count that can be tested: the same farm she is entered from, and the given name her patronymic is built on. Her own name passed to her granddaughter Inger Mathilde and, two generations further on, to Inga Christoffersen of Jersey City.", facts:{ Spouse:"Ole Andreas Olsen, m. 1 May 1838 at Søgne", Born:"About 1814 at Søgne, Vest-Agder", Father:"Thor Svenumsen of Hellervig (probable)" }, sources:[S.daSogneImg, S.da1865, S.daSogne1838, S.ottoBapt] },
    { id:"thorsvenumsen", name:"Thor Svenumsen", b:"", d:"", gen:7, line:"other", lineLabel:"Søgne line", direct:true, probable:true, place:"Hellervig, Søgne, Vest-Agder, Norway", role:"",
      lede:"Father of Inger Marie Thorsdatter, on strong but circumstantial grounds. When Inger Marie married Ole Andreas Olsen at Søgne on May 1, 1838, the register names the two <i>forlovere</i> — the sureties who vouched for the match — as <b>Thor Svenumsen Hellervig</b> and Ole Larsen Lindelien. Sureties were ordinarily close male kin and most often the bride's own father; this one is of <b>Hellervig</b>, the very farm Inger Marie is entered from, and carries the given name her patronymic is built on. Short of her baptism entry that is as firm as the inference gets, and it is set down here as probable rather than proved. His own patronymic takes the line one step further back again, to a father named Svenum or Sveinung. He is then found alive in the 1865 census, aged <b>ninety</b> and a widower, living at Hellesvik in Søgne as a <i>føderådsmann</i> — a farmer retired onto his keep — in the house of his son Ole Thorsen, with four grandchildren about him. That entry gives his birth year as about 1775 and, unexpectedly, his birthplace: not Søgne at all but <b>Holme</b> parish, further up the Mandal valley.",
      facts:{ Children:"Inger Marie Thorsdatter (probable); Ole Thorsen", Born:"About 1775 at Holme, Vest-Agder", Farm:"Hellervig / Hellesvik, Søgne", Status:"Føderådsmann and widower, aged 90, in 1865", Evidence:"Forlover at his daughter's marriage, 1 May 1838", "His own father":"A Svenum or Sveinung, by the patronymic" }, sources:[S.daSogne1865, S.daSogneImg, S.daSogne1838] },
    { id:"olethorsen", name:"Ole Thorsen", b:"c. 1822", d:"", gen:6, line:"other", lineLabel:"Søgne line", place:"Hellesvik, Søgne, Vest-Agder, Norway", role:"Farmer and freeholder",
      lede:"Son of Thor Sveinumsen, and so — if the identification of Thor holds — brother to Inger Marie Thorsdatter. The 1865 census finds him at forty-three the head of the house at Hellesvik, a farmer owning his own land, with his wife Anne P. Jansdatter, their children Gurine, Anne K., Theodor and Johan, and his ninety-year-old father living on the keep. Where Inger Marie left Søgne for a cooper's household in Egersund, her brother stayed and took the farm.",
      facts:{ Father:"Thor Sveinumsen", Spouse:"Anne P. Jansdatter", Children:"Gurine, Anne K., Theodor, Johan", Farm:"Hellesvik, Søgne" }, sources:[S.daSogne1865] },
    { id:"olai", name:"Olai S. Olsen", b:"c. 1847", d:"", gen:5, line:"chr", place:"Egersund, Rogaland, Norway", role:"Pottery worker",
      lede:"Brother of Otto Johan, and eighteen in the 1865 census, where he is listed at Mosbækveien as a pottery worker — Egersund's faience works being the town's other trade besides the sea. One of at least six children of Ole Andreas Olsen and Inger Marie Thorsdatter.",
      facts:{ Parents:"Ole Andreas Olsen and Inger Marie Thorsdatter", Trade:"Pottery worker, 1865" }, sources:[S.da1865] },
    { id:"tellemine", name:"Tellemine Olsdatter", b:"c. 1852", d:"", gen:5, line:"chr", place:"Egersund, Rogaland, Norway", role:"",
      lede:"Sister of Otto Johan, thirteen and at home in the 1865 census. Her baptism is presumably the one the Egersund register enters for Ole Andreas in 1853.",
      facts:{ Parents:"Ole Andreas Olsen and Inger Marie Thorsdatter" }, sources:[S.da1865] },
    { id:"olavasr", name:"Olava Olsdatter (1859)", short:"Olava Olsdatter (sister)", b:"c. 1859", d:"", gen:5, line:"chr", place:"Egersund, Rogaland, Norway", role:"",
      lede:"The youngest of the household in 1865, aged six — and a standing trap for anyone reading this line. <b>She is not her brother Otto Johan\'s wife.</b> Otto Johan married a different Olava Olsdatter, born 1849, the illegitimate twin of Ole Olsen and Marthe Olsdatter. Two women of the same name, in the same parish and for a time the same house; the census of 1865 shows both, one as a daughter of six and the other elsewhere in the town aged sixteen.",
      facts:{ Parents:"Ole Andreas Olsen and Inger Marie Thorsdatter", "Not to be confused with":"Olava Olsdatter b. 1849, who married her brother Otto Johan" }, sources:[S.da1865] },
    { id:"oleolsen", name:"Ole Olsen", b:"", d:"", gen:6, line:"chr", direct:true, place:"Egersund, Rogaland, Norway", role:"",
      lede:"Named by Marthe Olsdatter as the father of her twins at Olava's baptism in February 1849, the pastor noting that “the stated father is at home in Egersund,” and again as her father at Olava's confirmation in 1863, where he is described as a gårdmann, a farmer holding his own land. He did not marry Marthe and does not appear in her household in 1865, 1870, or 1875. The 1866 marriage record calls Olava his daughter. Which of the several Ole Olsens of Egersund he was has not been established.",
      facts:{}, sources:[S.daOlavaBapt, S.daOlavaConf, S.daOttoMarr, S.ottoMarr] },
    { id:"annepilon", name:"Anne Pilon", b:"", d:"", gen:11, line:"other", lineLabel:"Michelet spouses", place:"Metz", role:"",
      lede:"Married Paul Michelet at Metz on May 12, 1613. Her father was Josué Pillon, receveur des deniers de la bullette — the officer who collected the town's wine duty. Her sons Paul and Jacques left Metz for Norway in 1644 and founded the Norwegian branch of the family. A Rachel Pilon married Paul's brother Samuel, so two Michelet brothers married two Pilons.",
      facts:{ Spouse:"Paul Michelet, m. 12 May 1613", Father:"Josué Pillon, receveur des deniers de la bullette", Children:"Paul (1617), Jacques (1619)" },
      sources:[S.fsMetzMichelet, S.metzTable1893, S.metzJacques1619] },
    { id:"pierrephilpin", name:"Pierre Philpin", b:"", d:"", gen:11, line:"other", lineLabel:"Michelet spouses", place:"Metz", role:"",
      lede:"Father of Anne Philpin, named as such in the Metz register entry for her marriage to Jacques Michelet on October 30, 1646. Nothing else of him has been traced. Two other Philpin women appear in the same registers and are likely his daughters or nieces: Rachel, who married Daniel Gaultier at Metz on July 1, 1674, and Marie, who married Josué Ladrague and had daughters Esther and Marie.",
      facts:{ Children:"Anne Philpin", "Probable kin":"Rachel Philpin, m. Daniel Gaultier 1674; Marie Philpin, m. Jos. Ladrague" }, sources:[S.fsMetzMichelet, S.metzJacquesMarr] },
    { id:"jeanwiriot", name:"Jean Wiriot", b:"", d:"", gen:13, line:"other", lineLabel:"Michelet spouses", place:"Metz", role:"",
      lede:"Father of Suzanne Wiriot, named in the Metz register entry for her marriage to Jacquemin Michelet on July 28, 1591. The Berlin table gives Suzanne no parentage at all, so he is known only from the register — and only from the record itself, since a surname search for Wiriot in the indexed collection returns nothing. Nothing further of him has been traced.",
      facts:{ Children:"Suzanne Wiriot" }, sources:[S.metzJacqueminMarr, S.fsMetzMichelet] },
    { id:"suzannejoly", name:"Suzanne Joly", b:"", d:"1584", gen:12, line:"mick", place:"Metz", role:"First wife of Jacquemin",
      lede:"First wife of Jacquemin Michelet, and the mother of his elder children — Jacques (1576), Susanne (1579), Pierre (1582), and Paul (1584). She died in 1584, the year Paul was baptised, and Jacquemin married Suzanne Wiriot after her. The Pennsylvania line does not descend from her: it runs through the second marriage, to Daniel. Her existence is easy to miss, since only the Berlin table of 1883 records the first marriage at all.",
      facts:{ Spouse:"Jacques “Jacquemin” Michelet", Children:"Jacques (1576), Susanne (1579), Pierre (1582), Paul (1584)" }, sources:[S.metzTable1893] },
    { id:"suzannewiriot", name:"Suzanne Wiriot", b:"", d:"", gen:12, line:"other", lineLabel:"Michelet spouses", direct:true, place:"Metz", role:"",
      lede:"Second wife of Jacquemin Michelet, married at Metz on July 28, 1591, and the ancestress of the American line: her son Daniel, baptised in 1592, carries the descent. Jacquemin was by then a widower with four children by Suzanne Joly, and had another three by her — Daniel (1592), Samuel (1598), and Esther (1603). Nothing of her own family has been traced. The register entry for the marriage names her father: Jean Wiriot. The Berlin table gives her no parentage, so this is the only thing known of her own family.",
      facts:{ Father:"Jean Wiriot", Spouse:"Jacques “Jacquemin” Michelet, m. 28 Jul 1591", Children:"Daniel (1592), Samuel (1598), Esther (1603)" }, sources:[S.metzTable1893, S.metzJacqueminMarr] },
    { id:"mariecolin", name:"Marie Colin", b:"", d:"", gen:11, line:"other", lineLabel:"Michelet spouses", direct:true, place:"Metz", role:"",
      lede:"Married Daniel Michelet at Metz on February 8, 1615. The Berlin table names her father: Daniel Collin, a praticien du palais — a legal practitioner at the Metz parlement — which places the Michelets among the city's Protestant office-holding families rather than only its tradesmen. Her son Jacques, the dyer and deacon, carries the line. The register entry confirms him independently of the table, naming Daniel Colin as the bridegroom's father-in-law.",
      facts:{ Spouse:"Daniel Michelet, m. 8 Feb 1615", Father:"Daniel Collin, praticien du palais", Children:"Daniel (1615), Esther (1619), Jacques (1623), Suzanne (1627)" }, sources:[S.metzTable1893, S.metzDanielMarr] },
    { id:"danielcollin", name:"Daniel Collin", b:"", d:"", gen:12, line:"other", lineLabel:"Michelet spouses", place:"Metz", role:"Praticien du palais",
      lede:"Father of Marie Colin and a praticien du palais at Metz — a practitioner before the parlement, the working end of the law rather than its bench. He is known only from the line the Berlin table gives him, and nothing else of him has been looked for here.",
      facts:{ Children:"Marie Colin" }, sources:[S.metzTable1893] },
    { id:"annephilpin", name:"Anne Philpin", b:"c. 1630", d:"1681", gen:10, line:"other", lineLabel:"Michelet spouses", direct:true, place:"Metz", role:"",
      lede:"Married Jacques Michelet, the dyer and deacon, at Metz on October 30, 1646, and died in 1681, four years before the Revocation closed the church they had been married in. Her name is the correction that matters most in this part of the tree: many published trees give Jacques a wife “Anne Du Bois,” which comes from an Anne in the Berlin table styled veuve Dubois — but that Anne is his daughter, died 1681, not his wife. The register names her father, Pierre Philpin, whom the Berlin table omits, and indexes seven children of the marriage rather than the five the table lists — Paul, Judith, Jacques, Pierre, Louis, Anne, and a David the table never mentions at all.",
      facts:{ Father:"Pierre Philpin", Spouse:"Jacques Michelet, m. 30 Oct 1646", Children:"Anne (veuve Dubois), Pierre (1652), Jacques (1661), Judith, Louis (1675), Paul (1670), David" }, sources:[S.metzTable1893, S.metzJacquesMarr] },
    { id:"suzannemangeot", name:"Suzanne Mangeot", b:"1674", d:"bef. 1715", gen:9, line:"other", lineLabel:"Michelet spouses", direct:true, place:"Metz → Zweibrücken",
      role:"Kept the diary the family descent rests on",
      lede:"Born June 26, 1674, and married Louis Michelet in 1697 at Zweibrücken, across the border in the Palatine duchy, because no Protestant marriage could be solemnised in French Metz after the Revocation. Her own diary, still kept by the Berlin branch in 1883, records that the couple stayed at Zweibrücken until their first son was born and baptised — the single sentence on which the whole American descent turns. She and Louis declared for the Reformed faith at Metz in 1699, and she was dead by 1715, when Louis declared their five surviving children Protestant as a widower.",
      facts:{ Spouse:"Louis Michelet, m. 1697 at Zweibrücken", Children:"Jean Jacques (1697), Jeanne (1699), Barbe (1702), Marie (1703), Louis (1705), Pierre (1710)" },
      sources:[S.metzTable1893, S.mick1893letters, S.mick1893] },
    { id:"paul1617", name:"Paul Michelet", short:"Maj. Paul Michelet", b:"1617", d:"1659", gen:10, line:"mick", place:"Metz → Norway", role:"Major; to Norway, 1644",
      lede:"Baptised at Metz on September 5, 1617, elder son of Paul Michelet the deacon and miller. He left for Norway in 1644 with his brother Jacques and took a commission there the same year, rising from lieutenant in 1644 to major in 1658. He died in 1659. He and his brother are the origin of the Norwegian Michelets, the army family that produced generals into the nineteenth century.",
      facts:{ Career:"Lieutenant 1644; Major 1658" }, sources:[S.metzTable1893] },
    { id:"jacques1619", name:"Jacques Michelet", short:"Jacques Michelet (Norway)", b:"1619", d:"", gen:10, line:"mick", place:"Metz → Norway", role:"To Norway, 1644",
      lede:"Baptised at Metz on April 7, 1619, younger son of Paul Michelet the deacon. He emigrated to Norway with his brother Paul in 1644. The Berlin table records nothing further of him.",
      facts:{}, sources:[S.metzTable1893] },
    { id:"jehan", name:"Jehan Michelet, “le Masson”", short:"Jehan Michelet", b:"fl. 1444", d:"", gen:13, line:"mick", direct:true, probable:true, place:"Metz", role:"Earliest recorded Michelet of Metz",
      lede:"A mason (“le Masson”) of Metz recorded in 1444, the head of the genealogical table of the Michelet family of Metz that Prof. Karl Ludwig Michelet of Berlin compiled from city baptismal certificates, the researches of the Metz Protestant pastor, and family papers, and sent to Pennsylvania in 1883. Later generations of the table are borne out by the surviving Reformed registers; the earlier ones, in the words of the 1893 genealogy, are “more or less conjectural.” The same table names a Jean Michelet, butcher, invested with the Order of Saint Michael by Louis XI in 1471 and Seigneur de Beauval, and an Antoine Jacques Michelet, president of the Parlement of Rouen in 1596, bearing the same arms. The family's arms, as carried from Metz to Berlin, show a fortress tower topped by a cap of liberty with a stag leaping the moat, and the motto “War, the Chase and Liberty.” A caution about the table itself: its “first generation,” presented as the children of Jehan, runs from a knighthood in 1471 to a death in 1610 — a hundred and sixty-six years. Those eight people cannot be siblings, so the top of this line is a list of notable Michelets rather than a pedigree, and the generations between Jehan and Jacquemin are not established.",
      facts:{}, sources:[S.mick1893] },
    { id:"jacquemin", name:"Jacques “Jacquemin” Michelet", short:"Jacquemin Michelet", b:"c. 1550", d:"1610", gen:12, line:"mick", direct:true, place:"Metz", role:"Clerk to the King's treasurer at Metz",
      lede:"A scrivener (escripvain) of Metz in 1576, clerk in 1579, receiver (receveur) in 1587, and from 1593 clerk to the King's treasurer; died in 1610. Twice married in the Reformed church: first to Suzanne Joly, who died in 1584, and on July 28, 1591, to Suzanne Wiriot. By his first wife he had Jacques (1576–1651, an elder of the church), Susanne, Pierre (1582–1632, a pastor), Paul (1584, deacon and farmer of the city mills, whose sons went to Norway), and Daniel; by the second, Samuel and Esther, who married David de la Cloche. The Berlin table gives his career in offices: escripvain in 1576, clerc in 1579, receveur in 1587, and commis du trésorier du Roy — clerk to the King's treasurer — by 1593, dying in 1610. It also gives him two wives, which most trees miss: Suzanne Joly, who died in 1584 leaving four children, and then Suzanne Wiriot, whom he married in 1591 and by whom he had Daniel, Samuel, and Esther. The American line descends from the second marriage.",
      facts:{ Spouses:"Suzanne Joly (d. 1584); Suzanne Wiriot, m. 28 Jul 1591", Children:"Jacques (1576), Susanne (1579), Pierre (1582), Paul (1584), Daniel (1592), Samuel (1598), Esther (1603)" },
      sources:[S.metzJacqueminMarr, S.metzJacques1576, S.metzDanielBapt, S.mick1893, S.metzColl] },
    { id:"daniel1592", name:"Daniel Michelet", b:"1592", d:"", gen:11, line:"mick", direct:true, place:"Metz", role:"",
      lede:"Baptized in the Reformed church of Metz on September 20, 1592, son of Jacquemin Michelet. Married Marie Colin, daughter of Daniel Collin, a practitioner at the law courts (praticien du palais), on February 8, 1615. His eldest son Daniel (1615–1659) married Judith de la Cloche; his daughter Esther died unmarried in 1684; his son Jacques, the dyer, was grandfather of the emigrant to Pennsylvania.",
      facts:{ Spouse:"Marie Colin, m. 8 Feb 1615", Children:"Daniel (1615–1659), Esther (1619–1684), Jacques (1623–1685), Suzanne (1627–1668)" },
      sources:[S.metzDanielBapt, S.metzDanielMarr, S.metzJacquesMarr, S.metzDaniel1615, S.mick1893, S.metzColl] },
    { id:"paul1584", name:"Paul Michelet", b:"1584", d:"1668", gen:11, line:"mick", direct:false, place:"Metz → (sons to Norway, 1644)", role:"Ancestor of the Norwegian Michelets",
      lede:"Baptized December 16, 1584, son of Jacquemin Michelet and Suzanne Joly; a deacon of the Reformed church and farmer of the city mills of Metz. Married Anne Pillon, daughter of Josué Pillon, receiver of the bullette tax. Two of his sons, Paul (baptized September 5, 1617) and Jacques (baptized April 7, 1619), emigrated to Norway in 1644 as officers in the Danish-Norwegian army; Paul was a lieutenant in 1644 and major by 1658, present at the siege of Trondheim, and died in 1659. Their descendants became the Norwegian Michelet family of soldiers, clergy, and jurists, among them Major General Jørgen Michelet (1742–1818) and Major General Christian Frederik Michelet (1792–1874), commandant of Fredriksten fortress; a Captain Michelet of Trondheim was corresponding with the Berlin branch in the 1880s. The table names his wife — Anne, daughter of Josué Pillon, receveur des deniers de la bullette — and his trade: deacon, and fermier des moulins de la ville, tenant of the town mills. His two sons Paul and Jacques are the ones who actually made the crossing to Norway in 1644. FamilySearch's index of the Metz registers dates the marriage — May 12, 1613, to Anne Pillon — and gives him a death at Metz in April 1668, neither of which the Berlin table records. His brother Samuel married a Rachel Pilon, so two of Jacquemin's sons married into the same family.",
      facts:{ Spouse:"Anne Pillon", Children:"Paul (1617–1659), Jacques (1619)" },
      sources:[S.metzJacques1619, S.mick1893, S.wikiCFM, S.wikiMichelet, S.metzColl] },
    { id:"louis1705", name:"Louis Michelet", short:"Louis Michelet (Berlin)", b:"1705", d:"1766", gen:8, line:"mick", direct:false, place:"Metz → Berlin", role:"Silk manufacturer in Berlin",
      lede:"Born at Metz December 8, 1705, younger brother of the emigrant to Pennsylvania. Left Metz for Berlin in 1720, arriving with David Girard, a kinsman by marriage, to apprentice in the silk manufactory of Girard, Michelet & Compagnie, in which he later became a partner; the firm stayed in the family for three generations. Berlin's French colony, founded by Huguenot refugees after 1685, was where the Michelets of Prussia married only within the faith. Died 1766. His son Pierre (1741–1787) was an officer of hussars under Frederick the Great; his grandson Edouard a captain in the war of 1813–15; his great-grandson the philosopher Karl Ludwig Michelet.",
      facts:{ Children:"Louis (1736–1800), Marie Françoise (1738–1796), Pierre (1741–1787), Robert David (1744–1802)" },
      sources:[S.mick1893, S.fsLouisG] },
    { id:"karl", name:"Prof. Karl Ludwig Michelet", b:"1801", d:"1893", gen:5, line:"mick", direct:false, place:"Berlin", role:"Hegelian philosopher; compiled the Metz family table",
      lede:"Born in Berlin December 4, 1801, son of Louis Guillaume Michelet (1775–1841) and Wilhelmine Victoire Girard, of the Huguenot French colony. Doctor of philosophy at Berlin in 1824, professor from 1829 until his death; a pupil of Hegel who edited Hegel's collected works (1832–42), founded the Berlin Philosophical Society in 1845, and wrote on ethics, Aristotle, and the personality of God. In 1883, answering a letter from Minnie F. Mickley of Pennsylvania, he sent the genealogical table of the Michelets of Metz from 1444, reasoned out that her ancestor Jean Jacques must be the missing eldest son of Louis Michelet and Suzanne Mangeot born at Zweibrücken, and concluded that the American and Berlin families descended from two brothers. Her father visited him in Berlin in 1889. Died December 15, 1893, the year the Mickley genealogy was printed.",
      facts:{ Spouses:"Marie Scholz (1813–1864); Jenny Vallon (1839–1886)", Children:"Paul, Jenny, Charles, Louisa, George, Helene, Eugene (1878–1883)" },
      sources:[S.mick1893, S.wikiKarl, S.britKarl, S.fsLouisG] },
    { id:"johnmartin", name:"John Martin Mickley", b:"1745", d:"1828", gen:7, line:"mick", direct:false, place:"Whitehall Twp. → Adams Co., PA", role:"Revolutionary soldier at Germantown",

    { id:"johnpeter", name:"John Peter Mickley", b:"1752", d:"1827", gen:7, line:"mick", direct:false, place:"Whitehall Twp. → Bedminster Twp., Bucks Co., PA", role:"Fifer through the whole Revolution",
      lede:"Born May 29, 1752. Escaped the raid of October 8, 1763, that killed his brother Henry and sister Barbara. Served against the Indians and then through the whole of the Revolutionary War as a fifer, including the Battle of Germantown. Married Eva Keck on May 28, 1782, and settled about 1784 in Bedminster Township, Bucks County. Died October 11, 1827 (the 1893 genealogy says 1828). His son Peter (1787–1854) served in the War of 1812.",

    { id:"sarah1786", name:"Sarah Mickley Blumer Stein", short:"Sarah Mickley", b:"1786", d:"1859", gen:6, line:"mick", direct:false, place:"Egypt → Allentown, PA", role:"Married the son of the pastor who hid the bell",

    { id:"josephj", name:"Joseph J. Mickley", b:"1799", d:"1878", gen:5, line:"mick", direct:false, place:"Catasauqua → Philadelphia", role:"“Father of American numismatics”",
      lede:"Joseph Jacob Mickley, born March 24, 1799, at Catasauqua, son of John Jacob III, the boy on the bell wagon. Went to Philadelphia in 1811, apprenticed as a piano maker, and built up his own instrument business, taking a Franklin Institute prize in 1831. From 1842 to 1869 his house at 927 Market Street was a gathering place for collectors, historians, and musicians. He assembled the finest coin collection in America of its day, with autographs of the signers of the Declaration and every president to Grant; a burglary on April 13, 1867, led him to sell most of the coins at auction that autumn. First president of the Numismatic and Antiquarian Society of Philadelphia, founded 1857. Fluent in French, German, and Swedish, he toured the mints of Europe from 1869 to 1872 gathering specimens for the United States Mint, and wrote on the Indian raids in Pennsylvania (1875). Died in Philadelphia February 15, 1878.",

      lede:"Born March 27, 1794, son of John Jacob III. Served in Captain Ruhe's company at Marcus Hook in the War of 1812, and was commissioned second lieutenant of cavalry in the 68th Regiment of Pennsylvania militia by Governor Hiester in 1821. Married Anna Kern on May 17, 1817. Died June 2, 1888, at ninety-four. Two of his sons served in the Civil War; his daughter Eliza married the Rev. David Kuntz.",
      facts:{ Spouse:"Anna Kern (1795–1879)", Children:"Mary, Rebecca, Ephraim, James W., Edwin, Catherine, Eliza, William Jacob, Jane, and two who died young" },

    { id:"edwin", name:"Lt. Edwin Mickley", b:"1830", d:"1898", gen:4, line:"mick", direct:false, place:"Mickleys, PA", role:"Raised the 1864 monument",
      lede:"Born April 20, 1830, on the homestead at Mickleys, which he owned in 1893 with the original 1789 “Oczakow” tract. First lieutenant of Company B, 38th Pennsylvania Volunteer Militia, in the emergency of 1863. When the 1864 subscription to mark the graves of the immigrant John Jacob Mickley fell short, he made up the difference and had the couple reinterred under a new tomb at Mickleys' church. Married Matilda E. Fogel about 1854; visited the Michelet cousins in Berlin in 1889. Died September 5, 1898.",
      facts:{ Spouse:"Matilda E. Fogel (1834–?)", Children:"Anna Ophelia Desdemona, Lillie Ellen Eva (m. Dr. Henry Martyn Chance), Minnie Fogel, John Jacob" },
      sources:[S.mick1893, S.fsEdwin] },
    { id:"minnie", name:"Minnie Fogel Mickley", b:"c. 1860", d:"", gen:3, line:"mick", direct:false, place:"Mickleys, PA", role:"Compiled the family genealogy, 1893",
      lede:"Daughter of Edwin Mickley of the homestead. In 1883 she wrote to Prof. Karl Ludwig Michelet in Berlin and drew from him the Metz family table and the diary evidence that fixed her ancestor's birthplace at Zweibrücken. Her “Genealogy of the Mickley Family of America” (Newark, 1893), dedicated to Michelet and to the memory of John Jacob Mickley, records 503 American descendants, the family's war service, the Liberty Bell episode as told in the family, and the Michelets of Metz, Berlin, and Norway; she also wrote the account of the bell for the American Monthly Magazine.",
      facts:{}, sources:[S.mick1893] },
    { id:"georgemilot", name:"George Milot (Melot)", short:"George Milot", b:"1782", d:"1862", gen:5, line:"mill", direct:false, probable:true, place:"Oley Twp., Berks Co., PA", role:"Cattle drover of Oley",
      lede:"Born April 24, 1782. A “cattledriver” of Oley Township, the Huguenot-settled valley next to Colebrookdale where the tailor Frederick Mylot was taxed the year before George's birth. Married Susanna Sayer (Seyer, 1791–1873) and named as executor in the estate of Daniel Seyer. Twelve children born 1812–1833; his daughter Susanna died at 22 in 1843 and his son Seyer as a Union private in 1863. Head of household in Oley in every census from 1820 to 1860. Died April 16, 1862; buried at Friedens Church Cemetery, Oley. The Berks family spelled the name Milot or Melot while the Orwigsburg branch wrote Millot and, later, Millet.",

  const EVENTS = {
    jacques:{ tag:"Revocation of the Edict of Nantes, 1685", text:"A dyer and a deacon of the Reformed church of Metz, he was buried on October 8, 1685, days before the Edict of Fontainebleau outlawed Protestant worship in France and scattered his family into the Huguenot diaspora." },
    louis:{ tag:"Revocation of the Edict of Nantes, 1685", text:"He was nine when the Revocation closed the Metz temple. Because no Protestant marriage could be solemnized in French Metz, he crossed to Zweibrücken to wed in 1697; in 1715, a widower, he declared his five surviving children Protestant before the Metz authorities." },
    paul1617:{ tag:"Emigration to Norway, 1644", text:"He and his brother Jacques left Metz for Norway in 1644, in the years when Huguenot families were scattering out of Lorraine, and he took a commission there the same year — lieutenant in 1644, major by 1658. The two brothers are the origin of the Norwegian Michelets, an army family that produced officers and generals into the nineteenth century." },
    jacques1619:{ tag:"Emigration to Norway, 1644", text:"He left Metz for Norway with his elder brother Paul in 1644. Between them they founded the Norwegian branch of the family; the Berlin table records nothing further of him." },
    suzannemangeot:{ tag:"Revocation of the Edict of Nantes, 1685", text:"The Revocation is why she was married where she was. No Protestant marriage could be solemnised in French Metz after 1685, so she and Louis crossed to Zweibrücken in 1697 to wed, and her diary records that they stayed there until their first son was born and baptised. In 1699 the couple declared openly for the Reformed faith at Metz as nouveaux convertis." },
    jj1:{ tag:"Landing at Philadelphia, 1733", text:"Sailed from Rotterdam on the Hope of London, Daniel Reid master, by way of Cowes, and landed at Philadelphia on August 28, 1733, one of 389 Palatine passengers. The list spells him Johan Jacob Mückli; he took the oath of allegiance the same week." },
    henry1754:{ tag:"The Whitehall raid, 1763", text:"Killed on October 8, 1763, while gathering chestnuts near Mickleys with his sister Barbara, in the frontier violence that followed Pontiac's War. The same raid struck the neighboring Schneider household; his brother John Peter escaped." },
    barbara1756:{ tag:"The Whitehall raid, 1763", text:"Killed at about seven years old alongside her brother Henry on October 8, 1763, in the raid on Whitehall Township that followed Pontiac's War." },
    jj2:{ tag:"The Liberty Bell hidden from the British, 1777", text:"After Brandywine, the Executive Council ordered Philadelphia's bells out of the city so the British could not melt them into cannon — eleven bells, moved at night under the appearance of farm wagons. The State House bell rode on his wagon, drawn by his own horses, with his eleven-year-old son beside him. The Moravian diary at Bethlehem records on September 23, 1777 that the wagon broke down under the weight and had to be unloaded." },
    jj3:{ tag:"The Liberty Bell hidden from the British, 1777", text:"At eleven he rode the wagon carrying the State House bell out of Philadelphia, and was now and then allowed to drive. He told the story of that first trip to the city to his grandchildren, and it was still being repeated in the family in 1893. He later marched with the state militia to western Pennsylvania in the Whiskey Rebellion of 1794." },
    sarah1786:{ tag:"The Liberty Bell hidden from the British, 1777", text:"She married a son of Pastor Abraham Blumer, who helped hide the bell beneath the floor of Zion Reformed Church in Allentown, where it lay until June 1778." },
    johnmartin:{ tag:"Battle of Germantown, 1777", text:"A soldier of the Revolution, in the line at Germantown on October 4, 1777. In 1794 he moved to Adams County near Gettysburg and founded the family's large branch there." },
    johnpeter:{ tag:"Fifer through the Revolution", text:"Escaped the raid of October 8, 1763 that killed his brother Henry and sister Barbara, then served against the Indians and through the whole of the Revolutionary War as a fifer, Germantown included. His son Peter served in the War of 1812." },
    sgtfred:{ tag:"Berks County militia, 1780 and 1782", text:"A Colebrookdale tailor who served twice as a sergeant of the Berks County militia: in Capt. Henry Strouch's company of Col. Joseph Hiester's Sixth Battalion, on active duty from August 10 to September 9, 1780, and in Capt. Abraham Keefer's company mustered September 10, 1782." },
    williamsr:{ tag:"Founding of Chatham, 1656–1712", text:"In 1656 he bought about four square miles of Monomoit from the sachem Mattaquason for a shallop, ten coats, six kettles, twelve axes, twelve hoes, twelve knives, forty shillings in wampum, a hat, and twelve shillings in coin. He had not asked Plymouth Colony's leave, and sixteen years of dispute followed before he settled it in 1672 for ninety pounds. He held church services in his own house, and his children and grandchildren saw Monomoit incorporated as Chatham on June 11, 1712." },
    anne:{ tag:"The 1637 crossing to New England", text:"Sailed from Norwich in April 1637 with her husband, their four children, and her parents Nicholas and Bridget Busby, on either the Rose or the John and Dorothy, landing on June 20. The Nickerson Family Association puts the sailing on April 15 and the landing at Salem; Savage says they embarked on April 8 at Ipswich or Yarmouth and came ashore at Boston. Neither has been checked against a passenger list." },
    nicholasbusby:{ tag:"The 1637 crossing to New England", text:"Left Norwich at fifty with his wife Bridget and four of their children to join his daughter's family on the 1637 crossing, one of the eight in the Nickerson party aboard the Rose or the John and Dorothy. He settled at Watertown and was a freeman within the year." },
    bridgetbusby:{ tag:"The 1637 crossing to New England", text:"Crossed from Norwich in 1637 at fifty-three, with her husband Nicholas, four of their children, and her daughter Anne's family, among about a hundred passengers on the Rose or the John and Dorothy." },
    nicholasbusbyjr:{ tag:"The 1637 crossing to New England", text:"The eldest Busby son, born in England, and one of the four children who crossed with Nicholas and Bridget in 1637." },
    johnbusby:{ tag:"The 1637 crossing to New England", text:"One of the four Busby children who crossed in 1637. He had returned to England by 1657, when his father's will left him the books of physic." },
    abrahambusby:{ tag:"The 1637 crossing to New England", text:"One of the four Busby children who crossed in 1637; he settled at Boston as a linen-weaver and was of the Artillery Company by 1647." },
    sarahbusby:{ tag:"The 1637 crossing to New England", text:"The youngest Busby daughter, and one of the four children who crossed in 1637; she married into Sudbury, first to Capt. Thomas Cakebread and then to John Grout." },
    elizabethn:{ tag:"The 1637 crossing to New England", text:"One of the four Nickerson children born at Norwich who crossed in 1637. She married Robert Eldred of Yarmouth in 1649; their son Nicholas became Chatham's first representative under the new charter of 1692." },
    annn:{ tag:"The 1637 crossing to New England", text:"One of the four Nickerson children born at Norwich who crossed in 1637, named for her mother; she married Tristram Hedges of Boston in 1657." },
    zachary:{ tag:"Civil War", text:"Named for the general who had just been elected president. He served as a corporal in the Civil War and drew a pension from 1896, by which time he had settled in Mason County, Illinois." },
    edwin:{ tag:"Emergency of 1863", text:"First lieutenant of Company B, 38th Pennsylvania Volunteer Militia, raised in the emergency of 1863. When the 1864 subscription to mark the immigrant John Jacob Mickley's grave fell short, he made up the difference himself and had the couple reinterred." },
    josephj:{ tag:"Father of American numismatics", text:"He assembled the finest coin collection in America of its day and was first president of the Numismatic and Antiquarian Society of Philadelphia, founded 1857. A burglary on April 13, 1867 led him to sell most of the coins at auction that autumn; from 1869 to 1872 he toured the mints of Europe gathering specimens for the United States Mint." },
    karl:{ tag:"Editor of Hegel's collected works", text:"A pupil of Hegel and professor at Berlin from 1829, he edited Hegel's collected works between 1832 and 1842 and founded the Berlin Philosophical Society in 1845. In 1883 he answered a letter from Minnie Mickley with the Michelet family table reaching back to 1444 — the document much of this tree still rests on." },
    adolphmartin:{ tag:"Immigrant, 1881", text:"Came from Baden-Württemberg to the United States in 1881, married Catharine Herring in Schuylkill County in 1887, and kept house at Grier City in Rush Township." },
    martinc:{ tag:"Immigrant, 1885", text:"Came from Denmark to the United States in 1885 and married Inger Mathilde Olsen in a Lutheran church in Chicago on November 7, 1891." },
    ingasr:{ tag:"Emigrant from Egersund", text:"Born on Christmas Day 1868 in Egersund, a fishing and pottery town on Norway's southwest coast, she emigrated to Chicago and married Martin Christoffersen there on November 7, 1891." },
