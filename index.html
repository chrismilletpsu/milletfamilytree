<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millet Genealogy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #ECEEF0;
    --surface: #FAFBFB;
    --surface-2: #E1E5E9;
    --line: #C9CFD5;
    --ink: #1B232D;
    --ink-2: #4E5A67;
    --ink-3: #7C8793;
    --mickley: #9C6C2E;
    --mickley-soft: #E8D9C3;
    --millet: #3E6D8B;
    --millet-soft: #CFDEE8;
    --moyer: #6E6A3C;
    --nick: #8A4A60;
    --chr: #2E7A78;
    --direct: #1B232D;
    --probable: #A0A8B0;
    --focus: #D18A2B;
    --event: #6D28D9;
    --band-a: rgba(27,35,45,0.035);
    --shadow: 0 1px 2px rgba(27,35,45,0.08), 0 8px 24px rgba(27,35,45,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12171D;
      --surface: #1A2129;
      --surface-2: #232C36;
      --line: #313B46;
      --ink: #E7EAED;
      --ink-2: #AEB7C0;
      --ink-3: #7E8994;
      --mickley: #D4A45A;
      --mickley-soft: #3A2E1C;
      --millet: #7FB2D0;
      --millet-soft: #1F3442;
      --moyer: #B8B26A;
      --nick: #D48CA6;
      --chr: #7CC8C4;
      --direct: #E7EAED;
      --probable: #56616C;
      --focus: #E9A94C;
      --event: #A855F7;
      --band-a: rgba(231,234,237,0.035);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #12171D;
    --surface: #1A2129;
    --surface-2: #232C36;
    --line: #313B46;
    --ink: #E7EAED;
    --ink-2: #AEB7C0;
    --ink-3: #7E8994;
    --mickley: #D4A45A;
    --mickley-soft: #3A2E1C;
    --millet: #7FB2D0;
    --millet-soft: #1F3442;
    --moyer: #B8B26A;
    --nick: #D48CA6;
    --chr: #7CC8C4;
    --direct: #E7EAED;
    --probable: #56616C;
    --focus: #E9A94C;
    --event: #A855F7;
    --band-a: rgba(231,234,237,0.035);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 360px 1fr;
    grid-template-areas: "head head" "side stage";
    height: 100vh;
  }
  header {
    grid-area: head;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header h1 {
    font-family: "Libre Caslon Text", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 21px;
    margin: 0;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  header h1 em { font-style: italic; color: var(--mickley); }
  .controls { display: flex; align-items: center; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid currentColor; }
  .sw.fill { background: currentColor; }
  .sw.mick { color: var(--mickley); }
  .sw.mill { color: var(--millet); }
  .sw.moy { color: var(--moyer); }
  .sw.nick { color: var(--nick); }
  .sw.chr { color: var(--chr); }
  .ln { width: 22px; height: 0; border-top: 2px solid var(--direct); display: inline-block; }
  .ln.dash { border-top-style: dashed; border-color: var(--ink-3); }
  .ln.dot { border-top: 2px dotted var(--probable); }
  .sw-mark { flex: none; width: 15px; height: 15px; display: block; }
  .sw-mark circle { fill: none; stroke: var(--event); stroke-width: 2.25; }
  .sw-mark path { fill: var(--event); }
  label.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  label.toggle input { accent-color: var(--mickley); width: 15px; height: 15px; margin: 0; }
  .search { position: relative; }
  .search input {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--ground); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 10px; width: 200px;
  }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .search ul {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px 0;
    list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: var(--shadow); z-index: 20; max-height: 260px; overflow: auto;
  }
  .search ul[hidden] { display: none; }
  .search li { padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .search li:hover, .search li.active { background: var(--surface-2); }
  .search li small { color: var(--ink-3); margin-left: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  button.reset {
    font: inherit; font-size: 12px; color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer;
  }
  button.reset:hover { background: var(--surface-2); }
  button.reset:focus-visible, .search li:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  aside {
    grid-area: side;
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 22px 22px 32px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
    font-weight: 500; margin: 0 0 6px;
  }
  .eyebrow.mick { color: var(--mickley); }
  .eyebrow.mill { color: var(--millet); }
  .eyebrow.moy { color: var(--moyer); }
  .eyebrow.nick { color: var(--nick); }
  .eyebrow.chr { color: var(--chr); }
  aside h2 {
    font-family: "Libre Caslon Text", Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.15;
    margin: 0 0 6px; text-wrap: balance;
  }
  .dates { font-family: "IBM Plex Mono", "Menlo", monospace; font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; }
  .role {
    display: inline-block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); margin: 0 6px 14px 0;
  }
  .role.direct { background: var(--ink); color: var(--surface); }
  .role.probable { background: transparent; border: 1px dotted var(--ink-3); }
  .role.event { background: transparent; border: 1px solid var(--event); color: var(--event); }
  .event-note {
    border: 1px solid var(--line); border-left: 3px solid var(--event); border-radius: 4px;
    background: var(--ground); padding: 12px 14px; margin: 0 0 14px; max-width: 46ch;
  }
  .event-note .eyebrow { color: var(--event); }
  .event-note h3 {
    font-family: "Libre Caslon Text", Georgia, serif; font-weight: 400; font-size: 16px;
    line-height: 1.25; margin: 0 0 6px; text-wrap: balance;
  }
  .event-note p { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); margin: 0; }
  aside p { margin: 0 0 12px; max-width: 46ch; color: var(--ink); }
  aside p.lede { font-family: "Libre Caslon Text", Georgia, serif; font-size: 15.5px; line-height: 1.5; }
  dl { margin: 0 0 16px; display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; font-size: 13px; }
  dt { color: var(--ink-3); }
  dd { margin: 0; }
  dd a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; }
  dd a:hover { text-decoration-color: var(--ink); }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--ground); color: var(--ink); cursor: pointer;
  }
  .chip:hover { border-color: var(--ink-2); }
  .chip:focus-visible { outline: 2px solid var(--focus); }
  h3.src { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; font-weight: 500; }
  ul.sources { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  ul.sources li { padding: 6px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
  ul.sources li a { color: var(--ink); }
  .empty p { color: var(--ink-2); max-width: 44ch; }
  .empty .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 16px; }
  .empty .stat div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--ground); }
  .empty .stat b { display: block; font-family: "Libre Caslon Text", Georgia, serif; font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .empty .stat small { color: var(--ink-3); font-size: 11.5px; }

  .stage { grid-area: stage; position: relative; overflow: hidden; }
  .viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .viewtoggle button {
    font: inherit; font-size: 12px; padding: 4px 12px; border: 0; cursor: pointer;
    background: var(--surface); color: var(--ink-2);
  }
  .viewtoggle button + button { border-left: 1px solid var(--line); }
  .viewtoggle button.on { background: var(--ink); color: var(--surface); }
  #map { width: 100%; height: 100%; display: block; }
  .land { fill: var(--surface-2); stroke: var(--line); stroke-width: 0.6; }
  .graticule { fill: none; stroke: var(--line); stroke-width: 0.4; opacity: 0.5; }
  .geolabel { font-family: "IBM Plex Sans", sans-serif; text-anchor: middle; pointer-events: none; }
  .geolabel.country { fill: var(--ink-3); opacity: 0.55; font-weight: 500; }
  .geolabel.town { fill: var(--ink-3); opacity: 0.45; }
  .placedot { cursor: pointer; }
  .placedot circle.halo { fill: var(--ink); opacity: 0.06; }
  .placedot circle.core { stroke: var(--surface); stroke-width: 1.2; }
  .placedot text { font-family: "IBM Plex Sans", sans-serif; font-size: 10px; fill: var(--ink-2);
    paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
  .placedot.sel circle.core { stroke: var(--focus); stroke-width: 2.5; }
  .flight { fill: none; stroke: var(--focus); stroke-width: 1.6; }
  .flight.est { stroke-dasharray: 3 4; }
  .flightdot { fill: var(--focus); }
  .eventcard {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: min(430px, calc(100% - 40px));
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--event);
    border-radius: 5px; padding: 13px 16px 14px; box-shadow: var(--shadow);
    opacity: 0; transition: opacity .45s ease; pointer-events: none; z-index: 3;
  }
  .eventcard.show { opacity: 1; }
  .eventcard .eyebrow { color: var(--event); margin-bottom: 4px; }
  .eventcard h3 {
    font-family: "Libre Caslon Text", Georgia, serif; font-weight: 400; font-size: 17px;
    line-height: 1.25; margin: 0 0 7px; text-wrap: balance; color: var(--ink);
  }
  .eventcard p { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin: 0; }
  .eventcard .who {
    margin: 0 0 6px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    color: var(--ink); line-height: 1.45;
  }
  .eventcard button {
    margin-top: 12px; font: inherit; font-size: 12px; padding: 5px 14px; cursor: pointer;
    border: 1px solid var(--event); background: var(--event); color: var(--surface); border-radius: 3px;
  }
  .eventcard.show { pointer-events: auto; }
  .timeline {
    position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 12px; backdrop-filter: blur(4px);
  }
  .timeline button {
    font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--ground);
    color: var(--ink); border-radius: 3px; padding: 3px 9px; cursor: pointer; flex: none;
  }
  .timeline button.ghost { color: var(--ink-2); }
  .timeline input[type=range] { flex: 1; accent-color: var(--focus); }
  .timeline .yearout {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink);
    min-width: 8ch; text-align: right; font-variant-numeric: tabular-nums; flex: none;
  }

  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  [hidden] { display: none !important; }
  svg:active { cursor: grabbing; }
  .band-label {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--ink-3); letter-spacing: 0.06em;
  }
  .band-title { font-family: "Libre Caslon Text", Georgia, serif; font-size: 12.5px; fill: var(--ink-2); }
  .band { fill: var(--band-a); }
  .band-line { stroke: var(--line); stroke-width: 1; }
  .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.2; stroke-opacity: 0.55; }
  .edge.direct { stroke: var(--direct); stroke-width: 2.4; stroke-opacity: 0.95; }
  .edge.spouse { stroke-dasharray: 4 4; }
  .edge.probable { stroke-dasharray: 2 5; stroke: var(--probable); stroke-width: 2; stroke-linecap: round; }
  .edge.grand { stroke-dasharray: 8 5; }
  .node { cursor: pointer; }
  .node circle.dot { stroke-width: 2; }
  .node.line-mick circle.dot { stroke: var(--mickley); fill: var(--surface); }
  .node.line-mill circle.dot { stroke: var(--millet); fill: var(--surface); }
  .node.line-moy circle.dot { stroke: var(--moyer); fill: var(--surface); }
  .node.line-nick circle.dot { stroke: var(--nick); fill: var(--surface); }
  .node.line-chr circle.dot { stroke: var(--chr); fill: var(--surface); }
  .node.line-other circle.dot { stroke: var(--ink-3); fill: var(--surface); }
  .node.direct.line-mick circle.dot { fill: var(--mickley); }
  .node.direct.line-mill circle.dot { fill: var(--millet); }
  .node.direct.line-moy circle.dot { fill: var(--moyer); }
  .node.direct.line-nick circle.dot { fill: var(--nick); }
  .node.direct.line-chr circle.dot { fill: var(--chr); }
  .node.direct.line-other circle.dot { fill: var(--ink-2); }
  .node.probable circle.dot { stroke-dasharray: 3 3; }
  .node text { font-family: "IBM Plex Sans", sans-serif; font-size: 11.5px; fill: var(--ink); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
  .node text.years { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-2); }
  .node.direct text { font-weight: 600; }
  .node.selected circle.dot { stroke: var(--focus); stroke-width: 4; }
  .node.dim, .edge.dim { opacity: 0.18; }
  .node.hidden, .edge.hidden { display: none; }
  .node.hit circle.dot { stroke: var(--focus); stroke-width: 3.5; }
  .node circle.ring { fill: none; stroke: var(--event); stroke-width: 2.25; }
  .node.direct circle.ring { stroke-width: 2.75; }
  .node path.star { fill: var(--event); }
  .node.direct path.star { fill: var(--surface); }
  .hint {
    position: absolute; left: 16px; bottom: 12px; font-size: 11.5px; color: var(--ink-3);
    background: color-mix(in srgb, var(--ground) 80%, transparent); padding: 4px 8px; border-radius: 3px;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 42vh; grid-template-areas: "head" "stage" "side"; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .search input { width: 140px; }
    body { overflow: hidden; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="app">
  <header>
    <h1>Millet <em>Genealogy</em></h1>
    <div class="controls">
      <div class="legend">
        <span><i class="sw fill mick"></i>Michelet / Mickley</span>
        <span><i class="sw fill moy"></i>Moyer</span>
        <span><i class="sw fill mill"></i>Millet</span>
        <span><i class="sw fill nick"></i>Nickerson</span>
        <span><i class="sw fill chr"></i>Christoffersen / Olsen</span>
        <span><i class="ln"></i>direct line</span>
        <span><i class="ln dash"></i>marriage</span>
        <span><i class="ln dot"></i>probable</span>
        <span><svg class="sw-mark" viewBox="-10 -10 20 20" width="15" height="15" aria-hidden="true"><circle r="8.4"/><path d="M0,-5L1.12,-1.55L4.76,-1.55L1.82,0.59L2.94,4.05L0,1.91L-2.94,4.05L-1.82,0.59L-4.76,-1.55L-1.12,-1.55Z"/></svg>notable event</span>
      </div>
      <div class="viewtoggle" role="group" aria-label="View">
        <button id="viewTree" class="on" type="button">Tree</button><button id="viewMap" type="button">Map</button>
      </div>
      <label class="toggle"><input type="checkbox" id="directOnly"> Direct line only</label>
      <div class="search">
        <input id="q" type="search" placeholder="Find a person" aria-label="Find a person" autocomplete="off">
        <ul id="qlist" hidden></ul>
      </div>
      <button class="reset" id="reset" type="button">Reset view</button>
    </div>
  </header>

  <aside id="panel"></aside>

  <div class="stage">
    <svg id="svg" role="img" aria-label="Family network diagram"></svg>
    <svg id="map" role="img" aria-label="Migration map" hidden></svg>
    <div class="hint" id="hintTree">Click a person for records. Drag to pan, scroll to zoom, drag a circle to move it.</div>
    <div class="eventcard" id="eventCard" hidden>
      <p class="eyebrow" id="ecYear"></p>
      <p class="who" id="ecWho"></p>
      <h3 id="ecTag"></h3>
      <p id="ecText"></p>
      <button id="ecNext" type="button">Continue</button>
    </div>
    <div class="timeline" id="timeline" hidden>
      <button id="playBtn" type="button" aria-label="Play">▶</button>
      <input id="scrub" type="range" min="1550" max="2030" step="1" value="2030" aria-label="Year">
      <span class="yearout" id="yearOut">everyone</span>
      <button id="allBtn" type="button" class="ghost">Show everyone</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  // ---------- Data ----------
  // gen: generations above Chris (0). line: mick | moy | mill | other. direct: on Chris's ancestral line.
  const S = {
    gbEngage1948:["Jersey Journal, 31 Jul 1948, p. 5 (Greenville Social): engagement of Evelyn Christoffersen to Willard S. Nickerson (GenealogyBank)","https://www.genealogybank.com/doc/newspapers/image/v2%3A1243C89DEE4DC187%40GB3NEWS-161AF27225BB4B5C%402432764-1616B5FEE01E14E7%404-1616B5FEE01E14E7%40"],
    gbEngage1954:["Jersey Journal, 22 Jan 1954, p. 6 (Engagements Announced): Ethel Paul to Willard Nickerson (GenealogyBank)","https://www.genealogybank.com/doc/newspapers/image/v2%3A1243C89DEE4DC187%40GB3NEWS-161D9FBA8B668CD0%402434765-1616AEDFCF3C21B6%405-1616AEDFCF3C21B6%40"],
    gbWedding1954:["Jersey Journal, 18 Jun 1954, p. 6 (Week-End Weddings): “Miss Paul to Be Married at Old Bergen Church” (GenealogyBank)","https://www.genealogybank.com/doc/newspapers/image/v2%3A1243C89DEE4DC187%40GB3NEWS-161AF1D373CBBA0A%402434912-1616AEBF43577520%405-1616AEBF43577520%40"],
    gbSheriff1818b:["Berks and Schuylkill Journal, 12 Sep 1818, p. 4: sheriff's sale notice repeated, three acres in Brunswick Twp., property of John Millot (GenealogyBank)","https://www.genealogybank.com/doc/newspapers/image/v2%3A11A09A55B22E34E8%40GB3NEWS-11A83679477BCD50%402385325-11A8367965C39A40%403-11A83679D7D7AEF8%40Advertisement"],

      lede:"Born in Metz and baptized in its Reformed church on December 28, 1623, son of Daniel Michelet and Marie Colin. A dyer (teinturier) by trade and a deacon of the Protestant congregation. Married Anne Philpin at Metz on October 30, 1646; the family table compiled in Berlin carries an entry for an Anne, died 1681, “veuve Dubois,” which is probably how the name Du Bois came to be attached to her in some later trees. Metz had been a free city of the Holy Roman Empire until France seized it in 1552, and its large Reformed community kept its own registers from 1561 until the Revocation. Anne died in 1681. Jacques was buried on October 8, 1685, days before the Edict of Fontainebleau outlawed Protestant worship in France that same month. Of his children, Pierre became a mercer and deacon; the youngest, Louis, born when his father was fifty-two, carried the line to Zweibrücken and America. The printed table settles the Du Bois question outright: the Anne styled “veuve Dubois,” died 1681, is entered there as his daughter, alongside Pierre the mercer and deacon, Jacques the dyer, and Louis — not as his wife.",

    { id:"jj1", name:"Jean Jacques Michelet (John Jacob Mickley)", short:"John Jacob Mickley Sr.", b:"1697", d:"1769", gen:8, line:"mick", direct:true, probable:true,
      place:"Zweibrücken → Oley, Berks Co. → Egypt, Whitehall Twp., PA", role:"Immigrant, 1733",
      lede:"Called the eldest son of Louis Michelet and Suzanne Mangeot, born at Zweibrücken in 1697 while his parents were there to marry — but that descent is reasoned, not recorded, and is the weakest join in the whole tree. Metz holds baptism certificates for Louis's four younger children and none for the eldest, and Karl Ludwig Michelet had already put a question mark against the name Jean in his own table before he ever heard from Pennsylvania. Told in 1883 of an American ancestor born about 1697, he concluded the gap explained itself and called it “in the highest degree probable,” his argument being that he could find no other Jean in the whole table who could have been born near that year. Two things sit against it: the 1715 Metz declaration names the son Jean, not Jean Jacques, and when the Zweibrücken registers were searched in person in 1869 the family was told nothing could be found to show that such a family had ever resided there. A check of FamilySearch in September 2026 undercuts the argument further. The four certificates Karl Michelet weighed against the missing fifth are Metz records of 1702 to 1710, and Metz Protestant worship ended with the Revocation in 1685 — so they are Catholic or civil entries made while the family lived in the city, which it did only from about 1699. A child born at Zweibrücken in 1697 would be missing from them whatever became of him. The absence Karl thought the American story explained needed no explaining, which leaves the identification resting on his elimination argument alone. Sailed from Rotterdam on the ship Hope of London, Daniel Reid master, by way of Cowes, and landed at Philadelphia on August 28, 1733, one of 389 Palatine passengers; the list spells him Johan Jacob Mückli, and he took the oath of allegiance the same week. A single man on arrival, he lived several years with Jacob Levan, a Huguenot relative, in the Oley valley of Berks County, then settled at Egypt in Whitehall Township, now Lehigh County, buying land from Adam Deshler by deed of December 14, 1761, on a tract William Penn had first granted in 1681. The name passed through Michelet, Miquelet, Mückli, and Michley before settling as Mickley; the village of Mickleys stands on his original tract, 450 acres of which were still in the family in 1893. Two of his children, Henry and Barbara, were killed in a raid on October 8, 1763. Died August 18, 1769; his wife died the same month. Their slate stones having worn away, descendants reinterred them at St. John's Union (Mickleys) Cemetery under a monument raised by subscription in 1864.",
      facts:{ Spouse:"Elizabeth Barbara Burkhalter (1719–1769)", Children:"John Jacob (1737), Mary Magdalena (1744), John Martin (1745), John Peter (1752), Henry (1754), Barbara (1756), Susanne" },
      sources:[S.mick1893, S.mick1893letters, S.fsJJ1, S.wikiSettler, S.lvpress] },
    { id:"jj2", name:"Pvt. John Jacob Mickley Jr.", b:"1737", d:"1808", gen:7, line:"mick", direct:true,
      place:"Egypt, Whitehall Twp., Lehigh Co., PA", role:"Hauled the Liberty Bell, 1777",
      lede:"Born December 17, 1737. Married Susanne Margarethe Miller in 1760. Elected to the Northampton County Committee of the Revolution in November 1776, and gave the use of his horses and wagons to the Continental Army throughout the war. In September 1777, after the Battle of Brandywine, the Executive Council ordered Philadelphia's bells out of the city so the British could not melt them into cannon; the State House bell, the Christ Church chimes, and St. Peter's bell, eleven in all, were carried off at night under the appearance of farm wagons. The Liberty Bell rode on his wagon, drawn by his own horses, with his eleven-year-old son beside him. The Moravian diary at Bethlehem records on September 23, 1777, that “the wagon with the State House Bell broke down here, so it had to be unloaded,” and neighbor Frederick Leaser's wagon finished the haul to Zion Reformed Church in Allentown, where the bell lay under the floor until June 1778. Pastor Abraham Blumer, who helped hide it, later became father-in-law to his daughter Sarah. He was killed by a tree falling on him near his home at Mickleys, December 12, 1808. A plaque at Zion Reformed (1908) and a family memorial at St. John's Union Cemetery (1917) commemorate him.",
      facts:{ Spouse:"Susanne Margarethe Miller (1743–1807), m. 1760", Children:"Catherine (1764), John Jacob (1766), Christian (1767), David (1769–1776), Peter (1773), Magdalena (1778), Daniel (1780), Henry (1782), Joseph (1784), Sarah (1786), Anna (1788), Magdalena" },
      sources:[S.mick1893, S.wikiSoldier, S.rcus, S.leaser, S.ushistory, S.fgPeter, S.fsJJ2] },
    { id:"jj3", name:"Pvt. John Jacob Mickley III", b:"1766", d:"1857", gen:6, line:"mick", direct:false, place:"Mickleys, Lehigh Co., PA", role:"Rode on the bell wagon, age 11",
      lede:"Born April 13 (or 14), 1766, eldest son of John Jacob Jr. At eleven he rode on the wagon bearing the Liberty Bell from Philadelphia to Allentown in 1777 and was occasionally allowed to drive; the story of that first trip to the city, told to his grandchildren, was still repeated in the family in 1893. Marched with the state militia to western Pennsylvania in the Whiskey Rebellion of 1794. Married Eva Catherine Schreiber. Died in the homestead at Mickleys on April 1, 1857, at ninety. His sons included Jacob, who kept the homestead, and Joseph, the Philadelphia numismatist.",
      facts:{ Spouse:"Eva Catherine Schreiber (1761–1846)", Children:"Mary Magdalena (1789, m. Daniel Moyer), Sarah (1790–1817), Jacob (1794–1888), Anna (1797–1890), Joseph J. (1799–1878)" },
      sources:[S.mick1893, S.fsJJ3, S.fgPeter] },
    { id:"peter", name:"Johann Peter Mickley", b:"1773", d:"1863", gen:6, line:"mick", direct:true, place:"Egypt, Whitehall Twp., Lehigh Co., PA", role:"Farmer near Hokendauqua",
      lede:"Born January 17 or 18, 1773, at Egypt (the 1893 genealogy says 1772), baptized April 11, 1773, at Egypt Reformed Church, fourth son of the man who hauled the Liberty Bell. Married Maria Salome Biery (the 1893 genealogy says 1791; Find a Grave, October 14, 1794, at Catasauqua). Farmed at “Peter Mickley's place, near Hokendauqua.” Eleven children, whose marriages spread the family from Bloomsburg and Trexlertown to Clinton County, Indiana. Died May 19, 1863, at ninety; buried at St. John's Union (Mickley's) Cemetery. The 1893 genealogy enters him as “Peter, born January 18th, 1772; died, 1861,” married to Salome Biery and living near Hokendauqua — a year off the 1773 and 1863 carried here from Find a Grave, on both dates. Neither has been checked against the Egypt Reformed register.",
      facts:{ Spouse:"Maria Salome Biery (1773–1868)", Children:"Mary Magdalena (1792, m. Daniel Snyder, Bloomsburg), Catherine (1795, m. Daniel Burkhalter, Indiana), John (1796, died in infancy), Salome (1798–1867, m. John Troxell), Hannah (1800–1881, m. Joseph Kern, then George Ludwig), Joseph (1802–1852, Trexlertown), Charles (1802–1878, Mechanicsville), Elizabeth (1805–1845, m. George Fahler), Christina (1808–1885, m. John Peter Byle), Susanna (1811/12, m. Thomas Moyer), Esther (1815, m. Stephen Troxell, Indiana)" },
      sources:[S.fgPeter, S.fsPeter, S.mick1893] },
    { id:"susanna", name:"Susanna Mickley Moyer", b:"1812", d:"1908", gen:5, line:"mick", direct:true, place:"Whitehall Twp. → Tamaqua, PA", role:"Lived to 96",
      lede:"Born March 28, 1812, in Whitehall Township; baptized May 17, 1812, at Egypt Reformed Church. Married Thomas Moyer on August 6, 1833, in South Whitehall Township and moved with him to Tamaqua, in the coal region of Schuylkill County. Nine children. The 1893 Mickley genealogy lists her as “Susanna, born March, 1811; living in 1892. Married Thomas Moyer; Tamaqua, Pa.” In 1900, widowed, she was living with her daughter Catharine and grandson Charles. Died December 13, 1908; buried at Odd Fellows Cemetery, Tamaqua. The 1893 genealogy, compiled while she was alive, enters her as “Susanna, born March, 1811; living in 1892,” married to Thomas Moyer of Tamaqua — which would make her ninety-seven at her death, not ninety-six.",
      facts:{ Spouse:"Thomas Moyer (1804–1869), m. Aug. 6, 1833", Children:"Nine, incl. Catharine (1833) and Emma (1850)" }, sources:[S.fgSusan, S.fsSusanna, S.mick1893, S.c1900tam] },
    { id:"thomas", name:"Thomas Moyer", b:"1804", d:"1869", gen:5, line:"moy", direct:true, place:"South Whitehall Twp. → Tamaqua, PA", role:"",
      lede:"Born November 19, 1804, in Whitehall Township, then Northampton County, and baptized at Egypt Reformed Church on January 26, 1805, as Thomas Mayer, son of Jacob Mayer and Christina, in the same congregation where the Mickleys were baptized. His father died when he was thirteen: at the February term of 1818 his mother petitioned the Lehigh County Orphans' Court as widow of Jacob Moyer, yeoman, of South Whitehall, and the court gave Thomas and his brother Stephen into the guardianship of Peter Moyer, presumably his grandfather or uncle of that name. Married Susanna Mickley on August 6, 1833, in South Whitehall Township, and moved to Tamaqua, in the coal region, where the family was living in the east ward in 1850, the enumerator recording him as a potter, and in 1860, when at 48 (his age understated in both censuses) he was high constable of the borough with two sons working as moulders. Nine children born between 1833 and 1857. Died June 2, 1869, in Tamaqua; his son Albert died the same year. Recorded as Moyer, Mayer, Meyer, and Meyers.",
      facts:{ Parents:"Jacob Meyer (1781–bef. 1818) and Christina Newan", Guardian:"Peter Moyer, appointed Feb. 1818", Children:"Catharine (1833), Allen Percival (1836), James (1837–1910), Elmina (1841–1910), Albert W. (1843–1869), Lewis (1846), Zachary Taylor (1846/48–1932), Emma E. (1850–1930), Elwood William (1857–1895)" },
      sources:[S.thomasBapt, S.lehighOC1818, S.c1850moyer, S.c1860moyer, S.fsThomasMoyer, S.fsCatharine, S.fsAllenP, S.mick1893] },
    { id:"zachary", name:"Cpl. Zachary Taylor Moyer", short:"Zachary Taylor Moyer", b:"1846", d:"1932", gen:4, line:"moy", direct:false, place:"Tamaqua, PA → Mason Co., Illinois", role:"Civil War corporal",
      lede:"Named for the general who had just been elected president; two years old in the Tamaqua census of 1850 and at school in 1860. Served as a corporal in the Civil War and drew a pension from 1896, by which time he had settled in Mason County, Illinois. Died 1932.",

    { id:"jacobmeyer", name:"Jacob Meyer", b:"1781", d:"bef. 1818", gen:6, line:"moy", direct:true, place:"Whitehall → South Whitehall Twp., Lehigh Co., PA", role:"Yeoman",
      lede:"Born June 23, 1781, in Whitehall Township and baptized at Egypt Reformed Church on September 2, sponsored by Jacob and Gertrude Kern, his mother's kin. Married Christina Newan about 1797. A yeoman of South Whitehall Township. Died before February 1818, leaving eight children, seven of them minors; his widow's petition to the Orphans' Court that term placed them under four guardians, Peter, George, and Daniel Moyer and Jacob Biery.",
      facts:{ Spouse:"Christina Newan, m. c. 1797", Children:"Peter James (1803–1860), Thomas (1804–1869), Stephen (1806), George (1808), Manasseh (1810–1870), Catharine (1812–1869), Paul (1814), Salome (1816), Joseph (1819, died in infancy)" },

      lede:"Born about 1781. Married Jacob Meyer about 1797 and bore nine children between 1803 and 1819. Widowed by early 1818, she petitioned the Lehigh County Orphans' Court at its February term for guardians for the seven minors, Thomas among them. Her maiden name is spelled Newan in the FamilySearch tree; no record of her parents has been found.",

    { id:"petermeyer", name:"Peter Meyer Sr.", b:"c. 1752", d:"1838", gen:7, line:"moy", direct:true, place:"Whitehall Twp. → Allentown, PA", role:"",
      lede:"Born about 1752 in what was then Northampton County. Married Catharina Kern; thirteen children born 1775–1793. A taxpayer in Whitehall Township in 1781 and head of a household there in 1800 and 1810. Probably the Peter Moyer whom the Orphans' Court appointed guardian of his grandsons Thomas and Stephen in 1818. Died October 31, 1838, at Allentown; Catharina died the same year.",

    { id:"catharine", name:"Catharine A. Moyer Millet", b:"1833", d:"1925", gen:4, line:"moy", direct:true, place:"South Whitehall Twp. → Tamaqua, PA", role:"Widowed at 30; never remarried",
      lede:"Born November 21, 1833, in South Whitehall Township, Lehigh County, eldest child of Thomas Moyer and Susanna Mickley. Married the widower Frederick Millet in Tamaqua about 1861–62; their only child, Charles, was born in 1863, and Frederick died the following year. On July 18, 1864, the Register of Wills at Pottsville granted her letters of administration as “widow of Frederick Millet, late of the borough of Tamaqua.” Head of her own household in 1870 and 1880; in 1900 her mother was living with her; from 1910 she lived with her son, and was still with him at 86 in 1920. Died June 3, 1925, in Tamaqua; buried at Odd Fellows Cemetery.",

    { id:"sgtfred", name:"Sgt. Frederick Millet (Mylot, Miloth)", short:"Sgt. Frederick Millet", b:"fl. 1780–82", d:"", gen:6, line:"mill", direct:true, probable:true, place:"Colebrookdale Twp., Berks Co., PA", role:"Tailor; militia sergeant, 1780 and 1782",
      lede:"First found in Berks County on July 27, 1767, when Thomas Groom applied to the Land Office for 150 acres “adjoining the Land of Nicholas Harm, Frederick Millet &amp; Jacob Weiss, in Long Swamp Township Berks County.” He is named there as a landowner, which makes him an adult by 1767 and so born by about 1746 — thirty-four or more when he marched in 1780. That date collides usefully with the only candidate for his father: Nicklauß Möloth did not land at Philadelphia until October 1749, three years after Frederick was already born. Either Möloth is his father and Frederick came over as a small child, too young at three or six to appear on a list that recorded only men of sixteen and over — which would mean he was baptised in Germany, not Pennsylvania, and would explain why no Pennsylvania register has ever yielded him — or his family reached the colony by some route that left no trace in the arrival papers at all. By 1781 the land was gone: the assessment taxes him as a tailor in Colebrookdale Township (“Mylot, Fred'k, taylor”) with no valuation against his name, the only person of the name in the county's surviving tax lists of 1767–1785. Served twice as a sergeant of the Berks County militia during the Revolution: in Captain Henry Strouch's company of Colonel Joseph Hiester's Sixth Battalion, on active duty from August 10 to September 9, 1780, and in Captain Abraham Keefer's company from September 10, 1782, where his fellow sergeants were Abraham Lesher of the Oley ironmaking family and Michael Kooser. Both are pay rolls, and the second gives his term: one month and fourteen days, the same as Kooser and the lieutenant, where the captain, the ensign, Lesher and both corporals served one month and twenty-three days. The two rolls also spell him differently — “Frederick Miloth” in 1782, but “Frederick Millet” in 1780, the modern spelling. That roll is a printed transcription of 1906 and might have been an editor's reading, except that the 1767 warrant application is a manuscript and the clerk wrote “Frederick Millet” there too. The family is supposed to have become Millet only in the 1840s; in fact the spelling is there in the very first record of them in Pennsylvania. Both companies were raised from the Colebrookdale and Oley district south-east of Reading: the Kussers, Eckerts, Mattes, and Yoxheimers on their rolls are his neighbors on the Colebrookdale list. Colebrookdale and Oley were settled in part by Huguenot families, and the Millot/Milot name is French. He is not found in the 1790 or 1800 census indexes under any spelling, and no Millot appears in the Brunswick Township (Orwigsburg) lists of 1779–1785, so the family's move north came later. Four people of this rare surname, born 1777 to about 1785 in the same county, fit as his children: Maria (1777) and George (1782), who stayed in Oley, and John (about 1781) and Martin, who were in Orwigsburg by 1815. None of these links is yet proved by a baptism or will. FamilySearch's full-text index of Berks and Schuylkill deeds and probate records contains no Frederick Millot, Milot, Mylot, or Miloth; the baptisms, if they survive, are in the Oley and Colebrookdale church registers of the 1770s and 1780s, which are not indexed online. One candidate stands above him. A Nicklauß Möloth signed the list of the ship Lydia at Philadelphia on October 9, 1749, in his own hand: Strassburger reproduces the autograph in the facsimile volume, and prints the name in the transcription as “Nicklaus Möloth” — with the umlaut, and with none of the mark-crosses that stand beside the neighbours on that page who could not write. Möloth is the German spelling that becomes the Miloth of Frederick's own 1782 muster roll, and in the whole of Strassburger — every German-speaking man of sixteen or over landed at Philadelphia between 1727 and 1775, some three hundred ships — his is the only name of the kind. The Lydia's people came from Württemberg, Durlach, Zweibrücken and the Palatinate, and Zweibrücken is where a French surname would most likely already have been Germanised. What cannot be had is his age: of the three lists kept for each ship only the oath list survives for the Lydia, and the captain's list that would have carried ages is lost. So whether Nicklauß was Frederick's father or his grandfather is not answerable from the passenger records, and no document yet joins them at all.",
      facts:{ "1780 company":"Capt. Henry Strouch; Lt. Jacob Kester; Ens. John Eckert; fellow sergeants Christopher Berninger, Andrew Haas", "1782 company":"Capt. Abraham Keefer; Lt. Charles Eckart; Ens. Christopher Wentz; fellow sergeants Abraham Lesher, Michael Kooser", "Probable children":"Maria (1777), John (c. 1781), George (1782), Martin" },
      sources:[S.berksTax, S.paArchIdx3, S.paArch, S.paArch1780p243, S.paArchIdx, S.paArch1782, S.paArch1782img, S.berks1777] },
    { id:"martin", name:"Martin Millot", b:"c. 1790", d:"", gen:5, line:"mill", direct:true, probable:true, place:"Orwigsburg, Schuylkill Co., PA", role:"Lot-holder on Perry Street; head of household 1820–1830",
      lede:"Married to Catharine. First seen in Orwigsburg on March 28, 1816, witnessing a deed of Jacob Orwig, of the family that founded the town. The Millots were Independent Republicans, the Hiester party: at the party's Fourth of July celebration at Christian Deibert's spring in 1819 a Mr. Millot, John or Martin, offered a toast that drew six cheers. On September 21, 1816, Frederick G. Fidler and John Millot, who had held it jointly since 1815, conveyed to him lot 201 on the general plan of the borough, on Perry Street between two alleys, 111 feet 9 inches by 45 feet 4½ inches; on November 18, 1817, Martin and Catharine sold it for thirty-five dollars to Frederick Brintzinghoffer, a coach-maker of Berks County, both signing (Martin by mark). Head of one of the two Millot households in Orwigsburg in the 1820 census, the other being John's, and of the only one left in 1830: a man and a woman in their forties, a young woman in her teens, and one boy aged 10 to 14, the bracket a son born in 1820 falls in. The FamilySearch tree names him as Frederick's father, but no baptism has been found; St. John's register begins only in 1833. After 1830 he does not appear in Schuylkill County under Millot or Millet, and may be indexed as Miller. An Irish-born Martin Millett who bought a lot in Mahanoy City in the 1860s is a different man. A confirmation at Pike Township, Berks County, on June 9, 1805 puts him in Berks for the first time — until now he appeared only at Orwigsburg from 1815, and his Berks origin was an inference from the rarity of the name. Pike adjoins the Oley and Colebrookdale district where Sgt. Frederick was taxed in 1781. John Millot and an Eva Millot were confirmed the same day, so Eva is a fourth sibling. Confirmation at fourteen to sixteen would put his birth about 1789–91, later than the 1777–85 range these children are usually given.",
      facts:{ Spouse:"Catharine", Households:"1820 (p. 31) and 1830 (p. 83), Orwigsburg", Property:"Lot 201, Perry Street, Orwigsburg, 1816–1817" },
      sources:[S.warrant1767, S.pa5v5, S.strassSig, S.strassList, S.ancPikeConf, S.deedMartin1817, S.deedRecital1873, S.deedWitness1816, S.c1820martin, S.c1830martin, S.fsMartinMillet, S.gbJuly1819] },
    { id:"johnmillot", name:"John Millot", b:"c. 1781", d:"bef. 1830", gen:5, line:"mill", direct:false, probable:true, place:"Orwigsburg, Schuylkill Co., PA", role:"Independent Republican committeeman, 1820",
      lede:"Married Elizabeth Noaker (Noecker) about 1810; their five children were baptized at Zion's “Old Red” Union Church near Orwigsburg between 1811 and 1817. Held lot 201 in Orwigsburg with Frederick G. Fidler from 1815, sold his share in June 1815, and joined Fidler in conveying the lot to Martin Millot in September 1816; bought lot 74 at a sheriff's sale for $2.25 as highest bidder about 1819. His own affairs went badly: a three-acre tract of his in Brunswick Township, adjoining Wendel Seib and John Featherman, was advertised for sheriff's sale in August and September 1818, and in May 1820 the sheriff advertised his half lot on the Centre turnpike in Orwigsburg, 52 feet 6 inches wide and 11 perches deep, with a two-story frame dwelling and stable, bounded by John Kelly and Jacob Reinheimer, to be sold at Michael Graeff's inn on June 19, 1820, “late the estate of John Millot”; the neighboring lot of John Dell had gone the same way that March. He was active in the Hiester party all the same: at the Independent Republicans' Fourth of July celebration at Christian Deibert's spring in 1819 a Mr. Millot, John or Martin, gave the toast “Independent Republicanism expects every man to do his duty in the moment of trial” to six cheers, and at the county meeting of August 19, 1820, held at the Orwigsburg court-house to back General Joseph Hiester for governor, John Millot and John Kolb were named the committee of vigilance for the borough. Head of a household in Orwigsburg in the 1820 census, gone by 1830. Elizabeth afterward married Joseph Snyder and died January 15, 1876, buried at St. John's, Orwigsburg. The lot transactions tie him to Martin, and the two are most likely brothers. He was confirmed at Pike Township, Berks County, on June 9, 1805, alongside Martin and an Eva Millot — the first record placing any of them in Berks.",
      facts:{ Spouse:"Elizabeth Noaker (1792–1876), b. Berks Co., dau. of Johannes Noecker and Catharina Elizabeth Grim", Children:"Carolina (1811), Johan Wilhelm (1812), Maria (1814), Sarah (1816), Joseph (1817)", Property:"Lot 201 (with Fidler, 1815–16); lot 74 (c. 1819); half lot on the Centre turnpike (sold by sheriff, 1820); 3 acres in Brunswick Twp. (sold by sheriff, 1818)" },
      sources:[S.ancPikeConf, S.fsJohnMillot, S.fsNoaker, S.c1820john, S.deedMartin1817, S.deedRecital1873, S.deedRecital1833, S.deedJohnLot74, S.gbSheriff1818, S.gbSheriff1818b, S.gbSheriff1820mar, S.gbSheriff1820may, S.gbJuly1819, S.gbMeeting1820] },
    { id:"joseph", name:"Joseph Millet", b:"1817", d:"1883", gen:4, line:"mill", direct:false, place:"Orwigsburg, Schuylkill Co., PA", role:"",
      lede:"Born November 11, 1817, in Orwigsburg. Married Mary Derrick about 1840. The 1880 census records him as blind since the age of 44. Died January 16, 1883; buried at St. John's United Church of Christ Cemetery, Orwigsburg, Middle Section, Row 20.",
      facts:{ Spouse:"Mary Derrick (1824–1875)", Children:"William A. (1841–1861), Joseph Dallas (1845–1921), John Robert (1851–1867), Albert (1864–1927)" }, sources:[S.fgJoseph, S.fsJoseph] },
    { id:"fred1820", name:"Frederick Millet", b:"1820", d:"1864", gen:4, line:"mill", direct:true, place:"Orwigsburg → Tamaqua, PA", role:"Deacon, St. John's Reformed, Orwigsburg",
      lede:"Born 1820 in Orwigsburg. Married Sophia Brock about 1845. Elected a deacon of St. John's Reformed Church in Orwigsburg “to serve 2 years,” under Pastor J. W. Hoffmeier, and a communicant there on July 7 and November 8, 1846; his daughter Mary Louisa was baptized there August 29, 1846. Moved to Tamaqua by 1850 (south ward, household 186). Sophia died in 1860, leaving him a widower with son William. He bought a lot in Tamaqua, married Catharine Moyer about 1861–62, and died intestate before July 18, 1864, when his widow took out letters of administration; two 1865 deeds settled his property. No Civil War service record has been found under Millet, Millett, or Miller. No baptismal record has been found; his descent from Martin Millot rests on the 1830 household and the FamilySearch tree. The Zion (Red Church) register for 1818–1822, where John Millot's children were entered, is not indexed on FamilySearch, and neither it nor the St. John's confirmation lists of the mid-1830s have yet been read for him. A search of Ancestry in September 2026 failed to break or confirm his descent from Martin: there is no baptism for a Frederick Millet or Millot about 1820 anywhere in the fourteen million Pennsylvania and New Jersey church records, and no estate for Martin Millot in Pennsylvania probate. The link still rests on a boy aged 10 to 14 in Martin's household in 1830, and nothing else.",
      facts:{ "1st spouse":"Sophia Brock (1826–1860), m. c. 1845", "2nd spouse":"Catharine A. Moyer (1833–1925)", Children:"Mary Louisa (1846), George F. (1850), William C. (1851); Charles A. (1863)" },
      sources:[S.stjohns, S.c1850, S.c1860, S.letters, S.deeds, S.ancProbate1864, S.fsFredrick] },

    { id:"charles", name:"Charles A. Millet", b:"1863", d:"1950", gen:3, line:"mill", direct:true, place:"Tamaqua, Schuylkill Co., PA", role:"Store clerk; known as “Squire” Millet",
      lede:"Born in Tamaqua in 1863 (January 1864 by the 1900 census), only child of Frederick Millet and Catharine Moyer. His father died in his first year; he was raised by his mother, who lived with him until her death in 1925. A store clerk at 17. Married Mary C. Martin on May 20, 1911, at 48; six children between 1913 and 1927. Died 1950; buried at Odd Fellows Cemetery, Tamaqua.",
      facts:{ Spouse:"Mary C. Martin (1891–1971), m. May 20, 1911", Children:"Charles Adolph (1913), William Clement (1915), Katherine Mary (1918), Frederick (1920), Susan E. (1924), George Albert (1927)" },
      sources:[S.c1870, S.c1880, S.charlesCensus, S.fsCharlesSr, S.fgCharlesA, S.fredObit] },
    { id:"maryc", name:"Mary C. Martin Millet", b:"1891", d:"1971", gen:3, line:"other", direct:true, place:"Tamaqua, PA", role:"",
      lede:"Mary Catherine Martin, born August 18, 1891, at Grier City in Rush Township, a mining patch a few miles west of Tamaqua, daughter of Adolph Martin, a German immigrant of 1881, and Catharine Herring, Pennsylvania-born. Nine in the 1900 census with six brothers and sisters; not at home in 1910, when she was 18. Her marriage licence of May 6, 1911, carries the consent of her father, Adolph Martin, then of Tamaqua, because she was under 21; she married Charles A. Millet, a store clerk of 48, at Tamaqua on May 20, 1911, before a minister of the gospel. Six children between 1913 and 1927, and a widow from 1950. Died 1971; buried at Odd Fellows Cemetery, Tamaqua. Her son Charles married Dorothy Herring, of her mother's family.",
      facts:{ Parents:"Adolph Martin (1851–1934) and Catharine Herring (c. 1860–1934)", Siblings:"Oscar V. B. (c. 1882), Emma A. (c. 1884), John Adolph (1887–1950), Gertrude M. (1894–1977), William Casper (1897)" }, sources:[S.delayedMary, S.marrMillet1911, S.marrMillet1911img, S.c1900rush, S.c1910rush, S.fgMaryC, S.charlesCensus, S.obitCharlesJr, S.fsMaryMartin2, S.fredObit] },
    { id:"adolphmartin", name:"Adolph Martin", b:"1851", d:"1934", gen:4, line:"other", lineLabel:"Martin line", direct:true, place:"Baden-Württemberg → Rush Twp., Schuylkill Co., PA", role:"Immigrant, 1881",
      lede:"Born April 1851 in Germany (the FamilySearch tree says April 12, in Baden-Württemberg, son of Casper and Magdalena Martin). Came to the United States in 1881 and married Catharine Herring in Schuylkill County on November 11, 1887, when two children of hers, Oscar and Emma, were already in the household. Farmed or kept house at Grier City in Rush Township, where the family appears in 1900 and 1910; of Tamaqua when he gave consent to his daughter Mary's marriage in 1911. Died June 11, 1934, at Grier City; buried at St. Peter's United Church cemetery, Barnesville. A German Protestant family.",
      facts:{ Spouse:"Catharine Ardella Herring, m. 11 Nov 1887", Children:"John Adolph (1887–1950), Mary Catherine (1891–1971), Gertrude M. (1894–1977), William Casper (1897)" }, sources:[S.c1900rush, S.c1910rush, S.marrMillet1911, S.delayedMary, S.fsAdolphMartin] },
    { id:"catharineherring", name:"Catharine Ardella Herring Martin", short:"Catharine Herring", b:"c. 1860", d:"1934", gen:4, line:"other", direct:true, place:"Schuylkill Co., PA", role:"",
      lede:"Born about 1860 in Pennsylvania. Mother of Oscar (c. 1882) and Emma (c. 1884) before her marriage to Adolph Martin in November 1887, and of four more children with him. Living at Grier City in 1900 and 1910. Died 1934. The Herrings were a Tamaqua-area family; her grandson Charles Millet Jr. married a Dorothy Herring in 1935.",
      facts:{}, sources:[S.c1900rush, S.c1910rush, S.delayedMary, S.fsAdolphMartin] },

    { id:"katherine", name:"Katherine Mary Millet Gerrity", b:"1918", d:"2005", gen:2, line:"mill", direct:false, place:"Tamaqua, PA", role:"",
      lede:"Eldest daughter of Charles and Mary; married Bill Gerrity. In her brother Fred's 2002 interview, her husband's playful headlock on Fred's return from the war in November 1945 ended with Bill on the floor of their mother's house, a reflex Fred credited to his Ranger training.", facts:{ Spouse:"Bill Gerrity" }, sources:[S.fsCharlesSr, S.loc, S.fredObit] },

    { id:"fred1920", name:"Frederick “Butch” Millet", b:"1920", d:"2016", gen:2, line:"mill", direct:true, place:"Tamaqua, PA → South Bound Brook, NJ", role:"310th Field Artillery Bn., 79th Infantry Division",
      lede:"Born April 26, 1920, in Tamaqua; graduated from Tamaqua High School. Attended Citizens' Military Training Camp for three summers at Fort Meade and Fort Hoyle, Maryland, in the last years of horse-drawn artillery. Worked at Abe Sherman's Army-Navy store in Tamaqua and then at American Cyanamid (Calco) in New Jersey; heard the news of Pearl Harbor at the Majestic Theater in Tamaqua, where his future wife was an usherette. Drafted October 1942, reported to Fort Meade November 9, 1942; Camp Blanding, where he was one of the few in his unit to finish the 79th Division's Ranger training; maneuvers in Tennessee, Arizona, and Kansas; overseas from Camp Myles Standish in 1944. Normandy (the 79th landed at Utah Beach June 12–14), Cherbourg, the Falaise pocket, a night crossing of the Seine on a catwalk with the 313th Infantry, Belgium and Holland, the Hatten-Rittershoffen battle in January 1945, the Rhine at Remagen, the Ruhr, Würzburg, Pilsen; treated at a general hospital in Verdun. Home November 1945. Married Marie Violet Williams; 62 years together in South Bound Brook. Chemical shop steward at American Cyanamid; VFW Posts 12 and 2290; Reformed Church of South Bound Brook. Recorded his war for the Library of Congress on December 3, 2002. Died January 7, 2016, at 95; buried at Lake Nelson Memorial Park, Piscataway.",
      facts:{ Spouse:"Marie Violet Williams (1922–2004)", Children:"Frederick W., Diane, Marcia, Sharon Kay, Marianne" },
      sources:[S.loc, S.fredObit, S.fgFred, S.wwii, S.div79, S.charlesCensus] },
    { id:"marie", name:"Marie Violet Williams Millet", b:"1922", d:"2004", gen:2, line:"other", direct:true, place:"Tamaqua, PA → South Bound Brook, NJ", role:"",
      lede:"Born January 17, 1922, in Tamaqua, daughter of William Earl Williams, a Reading Railroad man from Gilberton. Her mother is not yet identified: in April 1930 Marie, 8, and her brother William, 7, were living with their grandparents William H. and Cora Williams at Gilberton, and that September her father married Evelyn Beck of Allentown, who raised the children in Tamaqua's East Ward and whom Marie's Social Security record names as her mother. Worked briefly on the assembly line at the Atlas Corporation in Tamaqua and as an usherette at the Majestic Theater, managed by her aunt; she was on shift with Fred Millet on December 7, 1941. Homemaker in South Bound Brook for 60 years; elder, deacon, and Women's Guild president at the Reformed Church of South Bound Brook; Girl Scouts and Cub Scout den mother; VFW Post 2290 auxiliary. Died December 5, 2004, at Somerset Medical Center, Somerville.",
      facts:{ Father:"William Earl Williams (1899–1969)", Stepmother:"Evelyn D. Beck (1890–1965), m. 1930", Brother:"William P. Williams (c. 1923)", Children:"Frederick W., Diane, Marcia, Sharon Kay, Marianne" }, sources:[S.numidentMarie, S.c1930gilberton, S.c1940tamWilliams, S.marrBeck1930, S.marieObit, S.fredObit, S.loc] },
    { id:"williamearl", name:"William Earl Williams", b:"1899", d:"1969", gen:3, line:"other", lineLabel:"Williams line", direct:true, place:"Gilberton → Tamaqua, PA", role:"Reading Railroad brake inspector",
      lede:"Born November 7, 1899, at Gilberton, a colliery town in the Mahanoy valley, son of William H. Williams, Pennsylvania-born of Welsh parents, and Cora Dornsife. Father of Marie (1922) and William (c. 1923) by a first wife whose name has not been found; by 1930 the two children were with his parents at Gilberton. Married Evelyn D. Beck, 36, at Allentown on September 20, 1930, and settled in Tamaqua's East Ward, where the family was in the same house from 1935 to 1940. Registered for the draft at Tamaqua in February 1942, employed by the Reading Railroad, five feet six, brown-eyed; a railroad brake inspector in 1950. Died April 23, 1969; buried with Evelyn in her family's plot at Highland Memorial Park, Allentown.",
      facts:{ Parents:"William H. Williams (c. 1870) and Cora Dornsife (c. 1878)", Spouses:"first wife unknown; Evelyn D. Beck (1890–1965), m. 20 Sep 1930, Allentown", Children:"Marie Violet (1922), William P. (c. 1923)" },
      sources:[S.wwiiWilliamEarl, S.marrBeck1930, S.c1930gilberton, S.c1940tamWilliams, S.c1950tamWilliams, S.fgWilliamEarl, S.fsWilliamEarl, S.numidentMarie] },
    { id:"evelynbeck", name:"Evelyn D. Beck Williams", short:"Evelyn Beck", b:"1890", d:"1965", gen:3, line:"other", direct:false, place:"Missouri → Allentown → Tamaqua, PA", role:"Stepmother of Marie",
      lede:"Born January 7, 1890, in Missouri, to Pennsylvania-born parents, George A. Beck (1849–1923) and Eleanor (1855–1930), who were back in Allentown by 1900. Single at 40 in April 1930, living with her sister Florence Steinhauser in Allentown; married William E. Williams there on September 20, 1930, and raised his two children in Tamaqua. Census-takers put her birthplace in Kansas in 1940 and Missouri in 1950. Died March 29, 1965; buried at Highland Memorial Park, Allentown, beside her parents.",
      facts:{ Parents:"George A. Beck and Eleanor Dutes" }, sources:[S.marrBeck1930, S.c1930beck, S.c1940tamWilliams, S.c1950tamWilliams, S.fgEvelynBeck] },
    { id:"williamh", name:"William H. Williams", b:"c. 1870", d:"", gen:4, line:"other", lineLabel:"Williams line", direct:true, place:"Gilberton, Schuylkill Co., PA", role:"",
      lede:"Born about 1870 in Pennsylvania to parents from Wales, in the Welsh mining stream that settled the Mahanoy valley. Married Cora Dornsife; their son William Earl was born at Gilberton in 1899. Head of a household at Gilberton in 1930, aged 60, with Cora and the younger children Alice, Cora, and Elmer, and with his grandchildren Marie and William, whose father had not yet remarried.",

    { id:"coradornsife", name:"Cora Dornsife Williams", short:"Cora Dornsife", b:"c. 1878", d:"", gen:4, line:"other", direct:true, place:"Gilberton, Schuylkill Co., PA", role:"",
      lede:"Born about 1878 in Pennsylvania. Named as Cora Dornsife, mother of the groom, in her son's 1930 marriage record; 52 in the Gilberton household that year, with her granddaughter Marie. Dornsife is a Northumberland and Schuylkill County name of Pennsylvania German origin.",

    { id:"willard", name:"Willard Stephen Nickerson", b:"1927", d:"2011", gen:2, line:"nick", direct:true, place:"Coeymans Hollow, NY → Bayonne, Dunellen & Highland Park, NJ", role:"Master carpenter; U.S. Navy, WWII",
      lede:"Born at Coeymans Hollow, New York, in the Albany County hamlet where four generations of his family had lived (July 1927 by a residence record, 1928 by the censuses). Grew up in Bayonne, New Jersey, with his sister Luella, and attended Bayonne High School. Served in the Navy in World War II and was honorably discharged. His engagement to Evelyn Christoffersen of 52 Bergen Avenue, Jersey City, was announced in the Jersey Journal on July 31, 1948, when his parents were at 830 Avenue C, Bayonne; in April 1950 he was a carpenter for a house builder, living in Dunellen with Evelyn. In January 1954 his engagement to Ethel E. Paul of Kearny was announced, and they were married at Old Bergen Church, Jersey City, at 4 p.m. on Saturday, June 19, 1954, with a reception at the Fairmount Hotel; Walter Garman was best man, Thomas Kerr and Alfred and Russell Paul ushered, and after a wedding trip to California the couple settled in Dunellen. He was then a contractor in Plainfield. With Ethel he had Connie and Carol, and raised the family in Highland Park. A master carpenter, builder, and painter; photographer, painter, and wood carver. Worshipful Master of Union Lodge No. 19, F&AM, and Patron of Allah Chapter 211, Order of the Eastern Star, New Brunswick. Died November 16, 2011, at Old Bridge; arrangements by Bronson & Guthlein, Milltown.",
      facts:{ "1st spouse":"Evelyn Ruth Christoffersen (1930–2003), engaged Jul 1948", "2nd spouse":"Ethel E. Paul, m. 19 Jun 1954, Old Bergen Church, Jersey City", Children:"Christine, Connie, Carol", Siblings:"Luella Garman; half-brother Thomas Kerr", Grandchildren:"Brooke, Casey, Samantha, Luke, Fred, Christopher, Heather, Kyle" },
      sources:[S.willardObit, S.c1950dun, S.c1930bay, S.c1940bay, S.gbEngage1948, S.gbEngage1954, S.gbWedding1954] },
    { id:"evelyn", name:"Evelyn Ruth Christoffersen Nickerson", b:"1930", d:"2003", gen:2, line:"chr", direct:true, place:"Jersey City → Dunellen, NJ → Palm Beach Gardens, FL", role:"",
      lede:"Born August 28, 1930, in Jersey City, third of the six children of Walter Christoffersen and Louise Mihm; age 9 in the family's Ward 7 apartment in 1940. Her engagement to Willard S. Nickerson of Bayonne was announced in the Jersey Journal's Greenville social column on July 31, 1948, when she was 17 and living with her mother at 52 Bergen Avenue, Jersey City. Married Willard and was living with him in Dunellen in April 1950, at 19. Mother of Christine. The marriage had ended by January 1954, when Willard's engagement to Ethel Paul was announced. Later known as Evelyn Ruth Hazel; lived in Palm Beach Gardens, Florida. Died March 12, 2003.",
      facts:{ Siblings:"Inga, Raymond, Doris, Lucille, Barbara Jane" }, sources:[S.evelynNumident, S.c1940jc, S.gbEngage1948, S.c1950dun, S.fsEvelyn, S.gbEngage1954] },
    { id:"ethel", name:"Ethel E. Paul Nickerson", b:"", d:"", gen:2, line:"other", direct:false, place:"Jersey City → Kearny → Dunellen & Highland Park, NJ", role:"Singer",
      lede:"Daughter of Mr. and Mrs. Alfred Paul, formerly of Jersey City and by 1954 of 74 Davis Avenue, Kearny. A graduate of Dickinson High School, Jersey City, employed in 1954 by the M. W. Kellogg Company there; a singer who had appeared on television. Her engagement to Willard Nickerson was announced in January 1954 and they were married at Old Bergen Church, Jersey City, on June 19, 1954, her father giving her away, Mrs. Richard Haberlin as matron of honor and Sandra Paul and Louella Garman as bridesmaids. Mother of Connie and Carol; stepmother of Christine.",
      facts:{ Parents:"Alfred Paul and wife, 74 Davis Ave., Kearny", Siblings:"Sandra, Alfred, Russell Paul" }, sources:[S.gbEngage1954, S.gbWedding1954, S.willardObit] },

    { id:"luella", name:"Luella Mae Nickerson Garman", b:"c. 1926", d:"", gen:2, line:"nick", direct:false, place:"Bayonne, NJ", role:"", lede:"Born in New York; older sister of Willard. Her Social Security record gives her mother's maiden name as Baran. Married Walter Garman, who was best man at Willard's 1954 wedding, at which a Louella Garman was a bridesmaid.", facts:{ Spouse:"Walter Garman" }, sources:[S.c1930bay, S.stephenRecs, S.willardObit, S.gbWedding1954] },
    { id:"stephenj", name:"Stephen John Nickerson", b:"1900", d:"", gen:3, line:"nick", direct:true, place:"Coeymans, NY → Bayonne, NJ", role:"",
      lede:"Born April 15, 1900, in Coeymans, Albany County, New York, youngest of the three children of Levi and Orpha Nickerson; in Coeymans in the 1905 and 1910 censuses. Registered for the World War I draft at Albany in 1917–18 and appears in the Veterans Administration index. Married Julia Baran; by 1930 the family was in Bayonne, New Jersey, and in 1940 his mother Orpha was living with them. In 1942 he and Julia were registered voters at 100 West 33rd Street, Bayonne, and in 1948 the family was at 830 Avenue C. By January 1954 they had moved to Dunellen, and that June the wedding notice placed them at Warrenville, in Warren Township.",
      facts:{ Spouse:"Julia T. Baran (b. c. 1907)", Children:"Luella Mae (c. 1926), Willard Stephen (1927/28)", Siblings:"Ethel M. (1893), Earl L. (1897)" },
      sources:[S.c1930bay, S.stephenRecs, S.fsStephenJ, S.fsLevi1865, S.willardObit, S.gbVoters1942, S.gbEngage1948, S.gbEngage1954, S.gbWedding1954] },
    { id:"julia", name:"Julia T. Baran Nickerson", b:"c. 1907", d:"", gen:3, line:"other", direct:true, place:"New Jersey", role:"",
      lede:"Born February 1907 in Bayonne, the eighth of ten children of George and Mary Baran, Slovak immigrants from what the censuses call Hungary in 1910, Austria in 1920, and Czechoslovakia in 1950; the family lived in Bayonne's fifth ward, where her three eldest siblings had been born in the old country before their father's arrival in 1889. Married Stephen Nickerson about 1924, and their first child Luella was born in Albany, New York, in June 1925, near his family's country; by 1930 they were back in Bayonne. In 1940 the household at Bayonne's third ward included her mother-in-law Orpha, by then Mrs. Kerr, and Orpha's son Thomas. A registered voter with Stephen at 100 West 33rd Street in 1942; at 830 Avenue C in 1948; in 1950 the census found them, with Thomas Kerr and an Elvira Castle, 75, at Hudson in Albany County, New York; in Dunellen and then Warrenville, New Jersey, by 1954. Still living in August 1956. Her death has not been found; the family understood her to be buried in the Dunellen–Plainfield area.",
      facts:{ Parents:"George Baran (c. 1865–67, arrived 1889) and Mary", Siblings:"Joseph (c. 1891), Anthony (c. 1893), Elizabeth (c. 1897, m. Arthur Binty), Stephen (c. 1899), Frank (c. 1901), George Jr. (c. 1904), Mary (c. 1909), John (c. 1912)" }, sources:[S.c1910bayonne, S.nj1915baran, S.c1920bayonne, S.c1930bay, S.c1940bayonneNick, S.c1950albany, S.numidentLuella, S.resJulia1956, S.stephenRecs, S.willardObit, S.gbVoters1942, S.gbEngage1948, S.gbWedding1954] },
    { id:"georgebaran", name:"George Baran", b:"c. 1866", d:"", gen:4, line:"other", lineLabel:"Baran line", direct:true, place:"Hungary (Slovakia) → Bayonne, NJ", role:"Immigrant, 1889",
      lede:"Born about 1865–67 in the Kingdom of Hungary, in the Slovak north that became Czechoslovakia after 1918. Came to the United States in 1889, leaving his wife Mary and their first children to follow; by 1900 the family was reunited in Bayonne, where seven more children were born. Head of a household in Bayonne's fifth ward in 1910, 1915, and 1920, when his surname was written Baron and Barren. His parish and village have not been identified; Bayonne's Slovak Catholic parish records would be the place to look.",
      facts:{ Spouse:"Mary (c. 1868)", Children:"Ten: Joseph, Anthony, Elizabeth, Stephen, Frank, George Jr., Julia (1907), Mary, John" }, sources:[S.c1910bayonne, S.nj1915baran, S.c1920bayonne, S.c1950albany] },
    { id:"marybaran", name:"Mary Baran", b:"c. 1868", d:"", gen:4, line:"other", direct:true, place:"Hungary (Slovakia) → Bayonne, NJ", role:"",
      lede:"Born about 1868 in Hungary; mother of ten, three born before emigration. Her maiden name is not yet known. Recorded in Bayonne in 1910, 1915, and 1920.",
