<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millet Genealogy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #ECEEF0;
    --surface: #FAFBFB;
    --surface-2: #E1E5E9;
    --line: #C9CFD5;
    --ink: #1B232D;
    --ink-2: #4E5A67;
    --ink-3: #7C8793;
    --mickley: #9C6C2E;
    --mickley-soft: #E8D9C3;
    --millet: #3E6D8B;
    --millet-soft: #CFDEE8;
    --moyer: #6E6A3C;
    --nick: #8A4A60;
    --chr: #2E7A78;
    --direct: #1B232D;
    --probable: #A0A8B0;
    --focus: #D18A2B;
    --band-a: rgba(27,35,45,0.035);
    --shadow: 0 1px 2px rgba(27,35,45,0.08), 0 8px 24px rgba(27,35,45,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12171D;
      --surface: #1A2129;
      --surface-2: #232C36;
      --line: #313B46;
      --ink: #E7EAED;
      --ink-2: #AEB7C0;
      --ink-3: #7E8994;
      --mickley: #D4A45A;
      --mickley-soft: #3A2E1C;
      --millet: #7FB2D0;
      --millet-soft: #1F3442;
      --moyer: #B8B26A;
      --nick: #D48CA6;
      --chr: #7CC8C4;
      --direct: #E7EAED;
      --probable: #56616C;
      --focus: #E9A94C;
      --band-a: rgba(231,234,237,0.035);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #12171D;
    --surface: #1A2129;
    --surface-2: #232C36;
    --line: #313B46;
    --ink: #E7EAED;
    --ink-2: #AEB7C0;
    --ink-3: #7E8994;
    --mickley: #D4A45A;
    --mickley-soft: #3A2E1C;
    --millet: #7FB2D0;
    --millet-soft: #1F3442;
    --moyer: #B8B26A;
    --nick: #D48CA6;
    --chr: #7CC8C4;
    --direct: #E7EAED;
    --probable: #56616C;
    --focus: #E9A94C;
    --band-a: rgba(231,234,237,0.035);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 360px 1fr;
    grid-template-areas: "head head" "side stage";
    height: 100vh;
  }
  header {
    grid-area: head;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header h1 {
    font-family: "Libre Caslon Text", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 21px;
    margin: 0;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  header h1 em { font-style: italic; color: var(--mickley); }
  .controls { display: flex; align-items: center; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid currentColor; }
  .sw.fill { background: currentColor; }
  .sw.mick { color: var(--mickley); }
  .sw.mill { color: var(--millet); }
  .sw.moy { color: var(--moyer); }
  .sw.nick { color: var(--nick); }
  .sw.chr { color: var(--chr); }
  .ln { width: 22px; height: 0; border-top: 2px solid var(--direct); display: inline-block; }
  .ln.dash { border-top-style: dashed; border-color: var(--ink-3); }
  .ln.dot { border-top: 2px dotted var(--probable); }
  label.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  label.toggle input { accent-color: var(--mickley); width: 15px; height: 15px; margin: 0; }
  .search { position: relative; }
  .search input {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--ground); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 10px; width: 200px;
  }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .search ul {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px 0;
    list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: var(--shadow); z-index: 20; max-height: 260px; overflow: auto;
  }
  .search ul[hidden] { display: none; }
  .search li { padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .search li:hover, .search li.active { background: var(--surface-2); }
  .search li small { color: var(--ink-3); margin-left: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  button.reset {
    font: inherit; font-size: 12px; color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer;
  }
  button.reset:hover { background: var(--surface-2); }
  button.reset:focus-visible, .search li:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  aside {
    grid-area: side;
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 22px 22px 32px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
    font-weight: 500; margin: 0 0 6px;
  }
  .eyebrow.mick { color: var(--mickley); }
  .eyebrow.mill { color: var(--millet); }
  .eyebrow.moy { color: var(--moyer); }
  .eyebrow.nick { color: var(--nick); }
  .eyebrow.chr { color: var(--chr); }
  aside h2 {
    font-family: "Libre Caslon Text", Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.15;
    margin: 0 0 6px; text-wrap: balance;
  }
  .dates { font-family: "IBM Plex Mono", "Menlo", monospace; font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; }
  .role {
    display: inline-block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); margin: 0 6px 14px 0;
  }
  .role.direct { background: var(--ink); color: var(--surface); }
  .role.probable { background: transparent; border: 1px dotted var(--ink-3); }
  aside p { margin: 0 0 12px; max-width: 46ch; color: var(--ink); }
  aside p.lede { font-family: "Libre Caslon Text", Georgia, serif; font-size: 15.5px; line-height: 1.5; }
  dl { margin: 0 0 16px; display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; font-size: 13px; }
  dt { color: var(--ink-3); }
  dd { margin: 0; }
  dd a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; }
  dd a:hover { text-decoration-color: var(--ink); }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--ground); color: var(--ink); cursor: pointer;
  }
  .chip:hover { border-color: var(--ink-2); }
  .chip:focus-visible { outline: 2px solid var(--focus); }
  h3.src { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; font-weight: 500; }
  ul.sources { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  ul.sources li { padding: 6px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
  ul.sources li a { color: var(--ink); }
  .empty p { color: var(--ink-2); max-width: 44ch; }
  .empty .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 16px; }
  .empty .stat div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--ground); }
  .empty .stat b { display: block; font-family: "Libre Caslon Text", Georgia, serif; font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .empty .stat small { color: var(--ink-3); font-size: 11.5px; }

  .stage { grid-area: stage; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .band-label {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--ink-3); letter-spacing: 0.06em;
  }
  .band-title { font-family: "Libre Caslon Text", Georgia, serif; font-size: 12.5px; fill: var(--ink-2); }
  .band { fill: var(--band-a); }
  .band-line { stroke: var(--line); stroke-width: 1; }
  .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.2; stroke-opacity: 0.55; }
  .edge.direct { stroke: var(--direct); stroke-width: 2.4; stroke-opacity: 0.95; }
  .edge.spouse { stroke-dasharray: 4 4; }
  .edge.probable { stroke-dasharray: 2 5; stroke: var(--probable); stroke-width: 2; stroke-linecap: round; }
  .edge.grand { stroke-dasharray: 8 5; }
  .node { cursor: pointer; }
  .node circle { stroke-width: 2; }
  .node.line-mick circle { stroke: var(--mickley); fill: var(--surface); }
  .node.line-mill circle { stroke: var(--millet); fill: var(--surface); }
  .node.line-moy circle { stroke: var(--moyer); fill: var(--surface); }
  .node.line-nick circle { stroke: var(--nick); fill: var(--surface); }
  .node.line-chr circle { stroke: var(--chr); fill: var(--surface); }
  .node.line-other circle { stroke: var(--ink-3); fill: var(--surface); }
  .node.direct.line-mick circle { fill: var(--mickley); }
  .node.direct.line-mill circle { fill: var(--millet); }
  .node.direct.line-moy circle { fill: var(--moyer); }
  .node.direct.line-nick circle { fill: var(--nick); }
  .node.direct.line-chr circle { fill: var(--chr); }
  .node.direct.line-other circle { fill: var(--ink-2); }
  .node.probable circle { stroke-dasharray: 3 3; }
  .node text { font-family: "IBM Plex Sans", sans-serif; font-size: 11.5px; fill: var(--ink); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
  .node text.years { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-2); }
  .node.direct text { font-weight: 600; }
  .node.selected circle { stroke: var(--focus); stroke-width: 4; }
  .node.dim, .edge.dim { opacity: 0.18; }
  .node.hidden, .edge.hidden { display: none; }
  .node.hit circle { stroke: var(--focus); stroke-width: 3.5; }
  .hint {
    position: absolute; left: 16px; bottom: 12px; font-size: 11.5px; color: var(--ink-3);
    background: color-mix(in srgb, var(--ground) 80%, transparent); padding: 4px 8px; border-radius: 3px;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 42vh; grid-template-areas: "head" "stage" "side"; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .search input { width: 140px; }
    body { overflow: hidden; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="app">
  <header>
    <h1>Millet <em>Genealogy</em></h1>
    <div class="controls">
      <div class="legend">
        <span><i class="sw fill mick"></i>Michelet / Mickley</span>
        <span><i class="sw fill moy"></i>Moyer</span>
        <span><i class="sw fill mill"></i>Millet</span>
        <span><i class="sw fill nick"></i>Nickerson</span>
        <span><i class="sw fill chr"></i>Christoffersen / Olsen</span>
        <span><i class="ln"></i>direct line</span>
        <span><i class="ln dash"></i>marriage</span>
        <span><i class="ln dot"></i>probable</span>
      </div>
      <label class="toggle"><input type="checkbox" id="directOnly"> Direct line only</label>
      <div class="search">
        <input id="q" type="search" placeholder="Find a person" aria-label="Find a person" autocomplete="off">
        <ul id="qlist" hidden></ul>
      </div>
      <button class="reset" id="reset" type="button">Reset view</button>
    </div>
  </header>

  <aside id="panel"></aside>

  <div class="stage">
    <svg id="svg" role="img" aria-label="Family network diagram"></svg>
    <div class="hint">Click a person for records. Drag to pan, scroll to zoom, drag a circle to move it.</div>
  </div>
</div>

    { id:"jacques", name:"Jacques Michelet", b:"1623", d:"1685", gen:10, line:"mick", direct:true, place:"Metz, Lorraine", role:"Dyer and deacon of the Reformed church of Metz",
      lede:"Born in Metz and baptized in its Reformed church on December 28, 1623, son of Daniel Michelet and Marie Colin. A dyer (teinturier) by trade and a deacon of the Protestant congregation. Married Anne Philpin at Metz on October 30, 1646; the family table compiled in Berlin carries an entry for an Anne, died 1681, “veuve Dubois,” which is probably how the name Du Bois came to be attached to her in some later trees. Metz had been a free city of the Holy Roman Empire until France seized it in 1552, and its large Reformed community kept its own registers from 1561 until the Revocation. Anne died in 1681. Jacques was buried on October 8, 1685, days before the Edict of Fontainebleau outlawed Protestant worship in France that same month. Of his children, Pierre became a mercer and deacon; the youngest, Louis, born when his father was fifty-two, carried the line to Zweibrücken and America.",

    { id:"louis", name:"Louis Michelet", b:"1675", d:"1750", gen:9, line:"mick", direct:true, place:"Metz → Zweibrücken", role:"Merchant, later Protestant pastor",
      lede:"Born in Metz on December 17, 1675, and baptized in the Reformed church there, the youngest child of Jacques Michelet and Anne Philpin; he was nine when the Revocation of the Edict of Nantes closed the Metz temple. A merchant. Because no Protestant marriage could be solemnized in French Metz, he married Suzanne Mangeot (born June 26, 1674) in 1697 at Zweibrücken (Deux-Ponts), the Palatine duchy just over the border, and the couple stayed there until their first son was born and baptized; Suzanne's own diary, still kept by the Berlin branch of the family in 1883, records this. The Metz archives list Louis and Suzanne in 1699 as “new converts” openly declaring for the Reformed faith, and in 1715 Louis, by then a widower, declaring his five surviving children Protestant. He later served as a Protestant pastor at Zweibrücken and died there on February 27, 1750. His children scattered with the Huguenot diaspora: Jean Jacques to Pennsylvania, Marie and Louis to Berlin, Jeanne out of Metz in 1708 in the household of the Countess of Nassau.",
      facts:{ Spouse:"Suzanne Mangeot (1674–bef. 1715), m. 1697 at Zweibrücken", Children:"Jean Jacques (1697), Jeanne (1699), Barbe (1702), Marie (1703, to Berlin, m. Pierre Perrin), Louis (1705–1766, to Berlin), Pierre (1710)" },
      sources:[S.metzLouisBapt, S.fsLouisM, S.mick1893, S.werelate, S.archion, S.metzColl] },
    { id:"jj1", name:"Jean Jacques Michelet (John Jacob Mickley)", short:"John Jacob Mickley Sr.", b:"1697", d:"1769", gen:8, line:"mick", direct:true,
      place:"Zweibrücken → Oley, Berks Co. → Egypt, Whitehall Twp., PA", role:"Immigrant, 1733",
      lede:"Eldest son of Louis Michelet and Suzanne Mangeot, born at Zweibrücken in 1697 while his parents were there to marry; his baptism has never been found, and his Berlin cousin wrote in 1883 that the Palatinate's Protestant records were probably destroyed in the French devastations under Louis XIV. Sailed from Rotterdam on the ship Hope of London, Daniel Reid master, by way of Cowes, and landed at Philadelphia on August 28, 1733, one of 389 Palatine passengers; the list spells him Johan Jacob Mückli, and he took the oath of allegiance the same week. A single man on arrival, he lived several years with Jacob Levan, a Huguenot relative, in the Oley valley of Berks County, then settled at Egypt in Whitehall Township, now Lehigh County, buying land from Adam Deshler by deed of December 14, 1761, on a tract William Penn had first granted in 1681. The name passed through Michelet, Miquelet, Mückli, and Michley before settling as Mickley; the village of Mickleys stands on his original tract, 450 acres of which were still in the family in 1893. Two of his children, Henry and Barbara, were killed in a raid on October 8, 1763. Died August 18, 1769; his wife died the same month. Their slate stones having worn away, descendants reinterred them at St. John's Union (Mickleys) Cemetery under a monument raised by subscription in 1864.",
      facts:{ Spouse:"Elizabeth Barbara Burkhalter (1719–1769)", Children:"John Jacob (1737), Mary Magdalena (1744), John Martin (1745), John Peter (1752), Henry (1754), Barbara (1756), Susanne" },

    { id:"jj2", name:"Pvt. John Jacob Mickley Jr.", b:"1737", d:"1808", gen:7, line:"mick", direct:true,
      place:"Egypt, Whitehall Twp., Lehigh Co., PA", role:"Hauled the Liberty Bell, 1777",
      lede:"Born December 17, 1737. Married Susanne Margarethe Miller in 1760. Elected to the Northampton County Committee of the Revolution in November 1776, and gave the use of his horses and wagons to the Continental Army throughout the war. In September 1777, after the Battle of Brandywine, the Executive Council ordered Philadelphia's bells out of the city so the British could not melt them into cannon; the State House bell, the Christ Church chimes, and St. Peter's bell, eleven in all, were carried off at night under the appearance of farm wagons. The Liberty Bell rode on his wagon, drawn by his own horses, with his eleven-year-old son beside him. The Moravian diary at Bethlehem records on September 23, 1777, that “the wagon with the State House Bell broke down here, so it had to be unloaded,” and neighbor Frederick Leaser's wagon finished the haul to Zion Reformed Church in Allentown, where the bell lay under the floor until June 1778. Pastor Abraham Blumer, who helped hide it, later became father-in-law to his daughter Sarah. He was killed by a tree falling on him near his home at Mickleys, December 12, 1808. A plaque at Zion Reformed (1908) and a family memorial at St. John's Union Cemetery (1917) commemorate him.",

    { id:"jj3", name:"Pvt. John Jacob Mickley III", b:"1766", d:"1857", gen:6, line:"mick", direct:false, place:"Mickleys, Lehigh Co., PA", role:"Rode on the bell wagon, age 11",
      lede:"Born April 13 (or 14), 1766, eldest son of John Jacob Jr. At eleven he rode on the wagon bearing the Liberty Bell from Philadelphia to Allentown in 1777 and was occasionally allowed to drive; the story of that first trip to the city, told to his grandchildren, was still repeated in the family in 1893. Marched with the state militia to western Pennsylvania in the Whiskey Rebellion of 1794. Married Eva Catherine Schreiber. Died in the homestead at Mickleys on April 1, 1857, at ninety. His sons included Jacob, who kept the homestead, and Joseph, the Philadelphia numismatist.",
      facts:{ Spouse:"Eva Catherine Schreiber (1761–1846)", Children:"Mary Magdalena (1789, m. Daniel Moyer), Sarah (1790–1817), Jacob (1794–1888), Anna (1797–1890), Joseph J. (1799–1878)" },
      sources:[S.mick1893, S.fsJJ3, S.fgPeter] },
    { id:"peter", name:"Johann Peter Mickley", b:"1773", d:"1863", gen:6, line:"mick", direct:true, place:"Egypt, Whitehall Twp., Lehigh Co., PA", role:"Farmer near Hokendauqua",
      lede:"Born January 17 or 18, 1773, at Egypt (the 1893 genealogy says 1772), baptized April 11, 1773, at Egypt Reformed Church, fourth son of the man who hauled the Liberty Bell. Married Maria Salome Biery (the 1893 genealogy says 1791; Find a Grave, October 14, 1794, at Catasauqua). Farmed at “Peter Mickley's place, near Hokendauqua.” Eleven children, whose marriages spread the family from Bloomsburg and Trexlertown to Clinton County, Indiana. Died May 19, 1863, at ninety; buried at St. John's Union (Mickley's) Cemetery.",
      facts:{ Spouse:"Maria Salome Biery (1773–1868)", Children:"Mary Magdalena (1792, m. Daniel Snyder, Bloomsburg), Catherine (1795, m. Daniel Burkhalter, Indiana), John (1796, died in infancy), Salome (1798–1867, m. John Troxell), Hannah (1800–1881, m. Joseph Kern, then George Ludwig), Joseph (1802–1852, Trexlertown), Charles (1802–1878, Mechanicsville), Elizabeth (1805–1845, m. George Fahler), Christina (1808–1885, m. John Peter Byle), Susanna (1811/12, m. Thomas Moyer), Esther (1815, m. Stephen Troxell, Indiana)" },
      sources:[S.fgPeter, S.fsPeter, S.mick1893] },
    { id:"susanna", name:"Susanna Mickley Moyer", b:"1812", d:"1908", gen:5, line:"mick", direct:true, place:"Whitehall Twp. → Tamaqua, PA", role:"Lived to 96",
      lede:"Born March 28, 1812, in Whitehall Township; baptized May 17, 1812, at Egypt Reformed Church. Married Thomas Moyer on August 6, 1833, in South Whitehall Township and moved with him to Tamaqua, in the coal region of Schuylkill County. Nine children. The 1893 Mickley genealogy lists her as “Susanna, born March, 1811; living in 1892. Married Thomas Moyer; Tamaqua, Pa.” In 1900, widowed, she was living with her daughter Catharine and grandson Charles. Died December 13, 1908; buried at Odd Fellows Cemetery, Tamaqua.",
      facts:{ Spouse:"Thomas Moyer (1804–1869), m. Aug. 6, 1833", Children:"Nine, incl. Catharine (1833) and Emma (1850)" }, sources:[S.fgSusan, S.fsSusanna, S.mick1893, S.c1900tam] },
    { id:"thomas", name:"Thomas Moyer", b:"1804", d:"1869", gen:5, line:"moy", direct:true, place:"South Whitehall Twp. → Tamaqua, PA", role:"",
      lede:"Married Susanna Mickley on August 6, 1833, in South Whitehall Township, Lehigh County. The family was living in Tamaqua by 1850 and in its East Ward in 1860. Died 1869.",

    { id:"catharine", name:"Catharine A. Moyer Millet", b:"1833", d:"1925", gen:4, line:"moy", direct:true, place:"South Whitehall Twp. → Tamaqua, PA", role:"Widowed at 30; never remarried",
      lede:"Born November 21, 1833, in South Whitehall Township, Lehigh County, eldest child of Thomas Moyer and Susanna Mickley. Married the widower Frederick Millet in Tamaqua about 1861–62; their only child, Charles, was born in 1863, and Frederick died the following year. On July 18, 1864, the Register of Wills at Pottsville granted her letters of administration as “widow of Frederick Millet, late of the borough of Tamaqua.” Head of her own household in 1870 and 1880; in 1900 her mother was living with her; from 1910 she lived with her son, and was still with him at 86 in 1920. Died June 3, 1925, in Tamaqua; buried at Odd Fellows Cemetery.",
      facts:{ Spouse:"Frederick Millet (1820–1864)", Child:"Charles A. Millet (1863–1950)" }, sources:[S.letters, S.c1870, S.c1880, S.c1900tam, S.fgCatharine, S.fsCatharine, S.deeds] },

    // ---- Millet: Berks & Orwigsburg ----
    { id:"sgtfred", name:"Sgt. Frederick Millet (Mylot, Miloth)", short:"Sgt. Frederick Millet", b:"fl. 1780–82", d:"", gen:6, line:"mill", direct:true, probable:true, place:"Colebrookdale Twp., Berks Co., PA", role:"Tailor; militia sergeant, 1780 and 1782",
      lede:"A tailor taxed in Colebrookdale Township, Berks County, in 1781 (“Mylot, Fred'k, taylor”), the only person of the name in the county's surviving tax lists of 1767–1785. Served twice as a sergeant of the Berks County militia during the Revolution: in Captain Henry Strouch's company of Colonel Joseph Hiester's Sixth Battalion, on active duty from August 10 to September 9, 1780, and in Captain Abraham Keefer's company mustered September 10, 1782, where his fellow sergeants were Abraham Lesher of the Oley ironmaking family and Michael Kooser. Both companies were raised from the Colebrookdale and Oley district south-east of Reading: the Kussers, Eckerts, Mattes, and Yoxheimers on their rolls are his neighbors on the Colebrookdale list. Colebrookdale and Oley were settled in part by Huguenot families, and the Millot/Milot name is French. He is not found in the 1790 or 1800 census indexes under any spelling, and no Millot appears in the Brunswick Township (Orwigsburg) lists of 1779–1785, so the family's move north came later. Four people of this rare surname, born 1777 to about 1785 in the same county, fit as his children: Maria (1777) and George (1782), who stayed in Oley, and John (about 1781) and Martin, who were in Orwigsburg by 1815. None of these links is yet proved by a baptism or will.",
      facts:{ "1780 company":"Capt. Henry Strouch; Lt. Jacob Kester; Ens. John Eckert; fellow sergeants Christopher Berninger, Andrew Haas", "1782 company":"Capt. Abraham Keefer; Lt. Charles Eckart; Ens. Christopher Wentz; fellow sergeants Abraham Lesher, Michael Kooser", "Probable children":"Maria (1777), John (c. 1781), George (1782), Martin" },
      sources:[S.berksTax, S.paArchIdx3, S.paArch, S.paArch1780p243, S.paArchIdx, S.paArch1782, S.paArch1782img, S.berks1777] },
    { id:"martin", name:"Martin Millot", b:"c. 1780s", d:"", gen:5, line:"mill", direct:true, probable:true, place:"Orwigsburg, Schuylkill Co., PA", role:"Lot-holder on Perry Street; head of household 1820–1830",
      lede:"Married to Catharine. First seen in Orwigsburg on March 28, 1816, witnessing a deed of Jacob Orwig, of the family that founded the town. The Millots were Independent Republicans, the Hiester party: at the party's Fourth of July celebration at Christian Deibert's spring in 1819 a Mr. Millot, John or Martin, offered a toast that drew six cheers. On September 21, 1816, Frederick G. Fidler and John Millot, who had held it jointly since 1815, conveyed to him lot 201 on the general plan of the borough, on Perry Street between two alleys, 111 feet 9 inches by 45 feet 4½ inches; on November 18, 1817, Martin and Catharine sold it for thirty-five dollars to Frederick Brintzinghoffer, a coach-maker of Berks County, both signing (Martin by mark). Head of one of the two Millot households in Orwigsburg in the 1820 census, the other being John's, and of the only one left in 1830: a man and a woman in their forties, a young woman in her teens, and one boy aged 10 to 14, the bracket a son born in 1820 falls in. The FamilySearch tree names him as Frederick's father, but no baptism has been found; St. John's register begins only in 1833. After 1830 he does not appear in Schuylkill County under Millot or Millet, and may be indexed as Miller. An Irish-born Martin Millett who bought a lot in Mahanoy City in the 1860s is a different man.",
      facts:{ Spouse:"Catharine", Households:"1820 (p. 31) and 1830 (p. 83), Orwigsburg", Property:"Lot 201, Perry Street, Orwigsburg, 1816–1817" },
      sources:[S.deedMartin1817, S.deedRecital1873, S.deedWitness1816, S.c1820martin, S.c1830martin, S.fsMartinMillet, S.gbJuly1819] },
    { id:"johnmillot", name:"John Millot", b:"c. 1781", d:"bef. 1830", gen:5, line:"mill", direct:false, probable:true, place:"Orwigsburg, Schuylkill Co., PA", role:"Independent Republican committeeman, 1820",
      lede:"Married Elizabeth Noaker (Noecker) about 1810; their five children were baptized at Zion's “Old Red” Union Church near Orwigsburg between 1811 and 1817. Held lot 201 in Orwigsburg with Frederick G. Fidler from 1815, sold his share in June 1815, and joined Fidler in conveying the lot to Martin Millot in September 1816; bought lot 74 at a sheriff's sale for $2.25 as highest bidder about 1819. His own affairs went badly: a three-acre tract of his in Brunswick Township, adjoining Wendel Seib and John Featherman, was advertised for sheriff's sale in August and September 1818, and in May 1820 the sheriff advertised his half lot on the Centre turnpike in Orwigsburg, 52 feet 6 inches wide and 11 perches deep, with a two-story frame dwelling and stable, bounded by John Kelly and Jacob Reinheimer, to be sold at Michael Graeff's inn on June 19, 1820, “late the estate of John Millot”; the neighboring lot of John Dell had gone the same way that March. He was active in the Hiester party all the same: at the Independent Republicans' Fourth of July celebration at Christian Deibert's spring in 1819 a Mr. Millot, John or Martin, gave the toast “Independent Republicanism expects every man to do his duty in the moment of trial” to six cheers, and at the county meeting of August 19, 1820, held at the Orwigsburg court-house to back General Joseph Hiester for governor, John Millot and John Kolb were named the committee of vigilance for the borough. Head of a household in Orwigsburg in the 1820 census, gone by 1830. Elizabeth afterward married Joseph Snyder and died January 15, 1876, buried at St. John's, Orwigsburg. The lot transactions tie him to Martin, and the two are most likely brothers.",
      facts:{ Spouse:"Elizabeth Noaker (1792–1876), b. Berks Co., dau. of Johannes Noecker and Catharina Elizabeth Grim", Children:"Carolina (1811), Johan Wilhelm (1812), Maria (1814), Sarah (1816), Joseph (1817)", Property:"Lot 201 (with Fidler, 1815–16); lot 74 (c. 1819); half lot on the Centre turnpike (sold by sheriff, 1820); 3 acres in Brunswick Twp. (sold by sheriff, 1818)" },
      sources:[S.fsJohnMillot, S.fsNoaker, S.c1820john, S.deedMartin1817, S.deedRecital1873, S.deedRecital1833, S.deedJohnLot74, S.gbSheriff1818, S.gbSheriff1818b, S.gbSheriff1820mar, S.gbSheriff1820may, S.gbJuly1819, S.gbMeeting1820] },
    { id:"joseph", name:"Joseph Millet", b:"1817", d:"1883", gen:4, line:"mill", direct:false, place:"Orwigsburg, Schuylkill Co., PA", role:"",
      lede:"Born November 11, 1817, in Orwigsburg. Married Mary Derrick about 1840. The 1880 census records him as blind since the age of 44. Died January 16, 1883; buried at St. John's United Church of Christ Cemetery, Orwigsburg, Middle Section, Row 20.",
      facts:{ Spouse:"Mary Derrick (1824–1875)", Children:"William A. (1841–1861), Joseph Dallas (1845–1921), John Robert (1851–1867), Albert (1864–1927)" }, sources:[S.fgJoseph, S.fsJoseph] },
    { id:"fred1820", name:"Frederick Millet", b:"1820", d:"1864", gen:4, line:"mill", direct:true, place:"Orwigsburg → Tamaqua, PA", role:"Deacon, St. John's Reformed, Orwigsburg",
      lede:"Born 1820 in Orwigsburg. Married Sophia Brock about 1845. Elected a deacon of St. John's Reformed Church in Orwigsburg “to serve 2 years,” under Pastor J. W. Hoffmeier, and a communicant there on July 7 and November 8, 1846; his daughter Mary Louisa was baptized there August 29, 1846. Moved to Tamaqua by 1850 (south ward, household 186). Sophia died in 1860, leaving him a widower with son William. He bought a lot in Tamaqua, married Catharine Moyer about 1861–62, and died intestate before July 18, 1864, when his widow took out letters of administration; two 1865 deeds settled his property. No Civil War service record has been found under Millet, Millett, or Miller. No baptismal record has been found; his descent from Martin Millot rests on the 1830 household and the FamilySearch tree.",
      facts:{ "1st spouse":"Sophia Brock (1826–1860), m. c. 1845", "2nd spouse":"Catharine A. Moyer (1833–1925)", Children:"Mary Louisa (1846), George F. (1850), William C. (1851); Charles A. (1863)" },
      sources:[S.stjohns, S.c1850, S.c1860, S.letters, S.deeds, S.fsFredrick] },

    { id:"charles", name:"Charles A. Millet", b:"1863", d:"1950", gen:3, line:"mill", direct:true, place:"Tamaqua, Schuylkill Co., PA", role:"Store clerk; known as “Squire” Millet",
      lede:"Born in Tamaqua in 1863 (January 1864 by the 1900 census), only child of Frederick Millet and Catharine Moyer. His father died in his first year; he was raised by his mother, who lived with him until her death in 1925. A store clerk at 17. Married Mary C. Martin on May 20, 1911, at 48; six children between 1913 and 1927. Died 1950; buried at Odd Fellows Cemetery, Tamaqua.",

    { id:"fred1920", name:"Frederick “Butch” Millet", b:"1920", d:"2016", gen:2, line:"mill", direct:true, place:"Tamaqua, PA → South Bound Brook, NJ", role:"310th Field Artillery Bn., 79th Infantry Division",
      lede:"Born April 26, 1920, in Tamaqua; graduated from Tamaqua High School. Attended Citizens' Military Training Camp for three summers at Fort Meade and Fort Hoyle, Maryland, in the last years of horse-drawn artillery. Worked at Abe Sherman's Army-Navy store in Tamaqua and then at American Cyanamid (Calco) in New Jersey; heard the news of Pearl Harbor at the Majestic Theater in Tamaqua, where his future wife was an usherette. Drafted October 1942, reported to Fort Meade November 9, 1942; Camp Blanding, where he was one of the few in his unit to finish the 79th Division's Ranger training; maneuvers in Tennessee, Arizona, and Kansas; overseas from Camp Myles Standish in 1944. Normandy (the 79th landed at Utah Beach June 12–14), Cherbourg, the Falaise pocket, a night crossing of the Seine on a catwalk with the 313th Infantry, Belgium and Holland, the Hatten-Rittershoffen battle in January 1945, the Rhine at Remagen, the Ruhr, Würzburg, Pilsen; treated at a general hospital in Verdun. Home November 1945. Married Marie Violet Williams; 62 years together in South Bound Brook. Chemical shop steward at American Cyanamid; VFW Posts 12 and 2290; Reformed Church of South Bound Brook. Recorded his war for the Library of Congress on December 3, 2002. Died January 7, 2016, at 95; buried at Lake Nelson Memorial Park, Piscataway.",
      facts:{ Spouse:"Marie Violet Williams (1922–2004)", Children:"Frederick W., Diane, Marcia, Sharon Kay, Marianne" },
      sources:[S.loc, S.fredObit, S.fgFred, S.wwii, S.div79, S.charlesCensus] },
    { id:"marie", name:"Marie Violet Williams Millet", b:"1922", d:"2004", gen:2, line:"other", direct:true, place:"Tamaqua, PA → South Bound Brook, NJ", role:"",
      lede:"Born January 17, 1922, in Tamaqua. Worked briefly on the assembly line at the Atlas Corporation in Tamaqua and as an usherette at the Majestic Theater, managed by her aunt; she was on shift with Fred Millet on December 7, 1941. Homemaker in South Bound Brook for 60 years; elder, deacon, and Women's Guild president at the Reformed Church of South Bound Brook; Girl Scouts and Cub Scout den mother; VFW Post 2290 auxiliary. Died December 5, 2004, at Somerset Medical Center, Somerville.",
      facts:{ Children:"Frederick W., Diane, Marcia, Sharon Kay, Marianne" }, sources:[S.marieObit, S.fredObit, S.loc] },

    { id:"fredw", name:"Frederick W. Millet", b:"", d:"2016", gen:1, line:"mill", direct:true, place:"South Bound Brook, NJ → Mountain Top, Luzerne Co., PA", role:"",
      lede:"Eldest child and only son of Frederick and Marie Millet, and the third Frederick in a row on this line. Kept the two German bayonets his father brought home from the Seine crossing. Married Christine Ruth Nickerson; four children. Later married Lynette Van Fleet. Died March 3, 2016, in Mountain Top, of injuries from a motor vehicle accident the day before, eight weeks after his father. At his request there was no viewing or funeral; family and friends gathered at III Guys in Mountain Top to remember him.",

    { id:"willard", name:"Willard Stephen Nickerson", b:"1927", d:"2011", gen:2, line:"nick", direct:true, place:"Coeymans Hollow, NY → Bayonne, Dunellen & Highland Park, NJ", role:"Master carpenter; U.S. Navy, WWII",
      lede:"Born at Coeymans Hollow, New York, in the Albany County hamlet where four generations of his family had lived (July 1927 by a residence record, 1928 by the censuses). Grew up in Bayonne, New Jersey, with his sister Luella, and attended Bayonne High School. Served in the Navy in World War II and was honorably discharged. His engagement to Evelyn Christoffersen of 52 Bergen Avenue, Jersey City, was announced in the Jersey Journal on July 31, 1948, when his parents were at 830 Avenue C, Bayonne; in April 1950 he was a carpenter for a house builder, living in Dunellen with Evelyn. In January 1954 his engagement to Ethel E. Paul of Kearny was announced, and they were married at Old Bergen Church, Jersey City, at 4 p.m. on Saturday, June 19, 1954, with a reception at the Fairmount Hotel; Walter Garman was best man, Thomas Kerr and Alfred and Russell Paul ushered, and after a wedding trip to California the couple settled in Dunellen. He was then a contractor in Plainfield. With Ethel he had Connie and Carol, and raised the family in Highland Park. A master carpenter, builder, and painter; photographer, painter, and wood carver. Worshipful Master of Union Lodge No. 19, F&AM, and Patron of Allah Chapter 211, Order of the Eastern Star, New Brunswick. Died November 16, 2011, at Old Bridge; arrangements by Bronson & Guthlein, Milltown.",
      facts:{ "1st spouse":"Evelyn Ruth Christoffersen (1930–2003), engaged Jul 1948", "2nd spouse":"Ethel E. Paul, m. 19 Jun 1954, Old Bergen Church, Jersey City", Children:"Christine, Connie, Carol", Siblings:"Luella Garman; half-brother Thomas Kerr", Grandchildren:"Brooke, Casey, Samantha, Luke, Fred, Christopher, Heather, Kyle" },
      sources:[S.willardObit, S.c1950dun, S.c1930bay, S.c1940bay, S.gbEngage1948, S.gbEngage1954, S.gbWedding1954] },
    { id:"evelyn", name:"Evelyn Ruth Christoffersen Nickerson", b:"1930", d:"2003", gen:2, line:"chr", direct:true, place:"Jersey City → Dunellen, NJ → Palm Beach Gardens, FL", role:"",
      lede:"Born August 28, 1930, in Jersey City, third of the six children of Walter Christoffersen and Louise Mihm; age 9 in the family's Ward 7 apartment in 1940. Her engagement to Willard S. Nickerson of Bayonne was announced in the Jersey Journal's Greenville social column on July 31, 1948, when she was 17 and living with her mother at 52 Bergen Avenue, Jersey City. Married Willard and was living with him in Dunellen in April 1950, at 19. Mother of Christine. The marriage had ended by January 1954, when Willard's engagement to Ethel Paul was announced. Later known as Evelyn Ruth Hazel; lived in Palm Beach Gardens, Florida. Died March 12, 2003.",
      facts:{ Siblings:"Inga, Raymond, Doris, Lucille, Barbara Jane" }, sources:[S.evelynNumident, S.c1940jc, S.gbEngage1948, S.c1950dun, S.fsEvelyn, S.gbEngage1954] },
    { id:"ethel", name:"Ethel E. Paul Nickerson", b:"", d:"", gen:2, line:"other", direct:false, place:"Jersey City → Kearny → Dunellen & Highland Park, NJ", role:"Singer",
      lede:"Daughter of Mr. and Mrs. Alfred Paul, formerly of Jersey City and by 1954 of 74 Davis Avenue, Kearny. A graduate of Dickinson High School, Jersey City, employed in 1954 by the M. W. Kellogg Company there; a singer who had appeared on television. Her engagement to Willard Nickerson was announced in January 1954 and they were married at Old Bergen Church, Jersey City, on June 19, 1954, her father giving her away, Mrs. Richard Haberlin as matron of honor and Sandra Paul and Louella Garman as bridesmaids. Mother of Connie and Carol; stepmother of Christine.",
      facts:{ Parents:"Alfred Paul and wife, 74 Davis Ave., Kearny", Siblings:"Sandra, Alfred, Russell Paul" }, sources:[S.gbEngage1954, S.gbWedding1954, S.willardObit] },
    { id:"connie", name:"Connie Nickerson Wright", b:"", d:"", gen:1, line:"nick", direct:false, place:"Highland Park, NJ → Westminster, MD", role:"", lede:"Daughter of Willard and Ethel Nickerson; of Westminster, Maryland, in 2011.", facts:{}, sources:[S.willardObit] },
    { id:"carol", name:"Carol Nickerson", b:"", d:"", gen:1, line:"nick", direct:false, place:"Highland Park → Dayton, NJ", role:"", lede:"Daughter of Willard and Ethel Nickerson; of Dayton, New Jersey, in 2011.", facts:{}, sources:[S.willardObit] },
    { id:"inga", name:"Inga Christoffersen", b:"c. 1924", d:"", gen:2, line:"chr", direct:false, place:"Jersey City, NJ", role:"", lede:"Eldest of the Christoffersen children, 16 in 1940; named for her Norwegian grandmother Inger.", facts:{}, sources:[S.c1940jc, S.walterRecs] },
    { id:"luella", name:"Luella Mae Nickerson Garman", b:"c. 1926", d:"", gen:2, line:"nick", direct:false, place:"Bayonne, NJ", role:"", lede:"Born in New York; older sister of Willard. Her Social Security record gives her mother's maiden name as Baran. Married Walter Garman, who was best man at Willard's 1954 wedding, at which a Louella Garman was a bridesmaid.", facts:{ Spouse:"Walter Garman" }, sources:[S.c1930bay, S.stephenRecs, S.willardObit, S.gbWedding1954] },
    { id:"stephenj", name:"Stephen John Nickerson", b:"1900", d:"", gen:3, line:"nick", direct:true, place:"Coeymans, NY → Bayonne, NJ", role:"",
      lede:"Born April 15, 1900, in Coeymans, Albany County, New York, youngest of the three children of Levi and Orpha Nickerson; in Coeymans in the 1905 and 1910 censuses. Registered for the World War I draft at Albany in 1917–18 and appears in the Veterans Administration index. Married Julia Baran; by 1930 the family was in Bayonne, New Jersey, and in 1940 his mother Orpha was living with them. In 1942 he and Julia were registered voters at 100 West 33rd Street, Bayonne, and in 1948 the family was at 830 Avenue C. By January 1954 they had moved to Dunellen, and that June the wedding notice placed them at Warrenville, in Warren Township.",
      facts:{ Spouse:"Julia T. Baran (b. c. 1907)", Children:"Luella Mae (c. 1926), Willard Stephen (1927/28)", Siblings:"Ethel M. (1893), Earl L. (1897)" },
      sources:[S.c1930bay, S.stephenRecs, S.fsStephenJ, S.fsLevi1865, S.willardObit, S.gbVoters1942, S.gbEngage1948, S.gbEngage1954, S.gbWedding1954] },
    { id:"julia", name:"Julia T. Baran Nickerson", b:"c. 1907", d:"", gen:3, line:"other", direct:true, place:"New Jersey", role:"",
      lede:"Born about 1907 in New Jersey; 23 in the 1930 census. Her maiden name, Baran, is given in her daughter Luella's Social Security record. A registered voter with Stephen at 100 West 33rd Street, Bayonne, in 1942; at 830 Avenue C in 1948; in Dunellen and then Warrenville by 1954. Buried in the Dunellen–Plainfield area.", facts:{}, sources:[S.c1930bay, S.stephenRecs, S.willardObit, S.gbVoters1942, S.gbEngage1948, S.gbWedding1954] },
    { id:"walter", name:"Walter Alvin Christoffersen", b:"1900", d:"", gen:3, line:"chr", direct:true, place:"Chicago → Jersey City, NJ", role:"",
      lede:"Born April 20, 1900, at Jefferson Park on Chicago's northwest side, to a Danish father and a Norwegian mother, and enumerated in the 1900 census at zero days old. The family had moved to Jersey City by 1920, where he registered for the draft. Married Louise Mihm; by 1930 they had Inga, Raymond, and Doris, and by 1940 Evelyn, Lucille, and Barbara Jane as well.",
      facts:{ Spouse:"Louise S. Mihm (b. c. 1890)", Children:"Inga (c. 1924), Raymond (c. 1929), Evelyn Ruth (1930), Doris, Lucille (c. 1933), Barbara Jane (c. 1937)" },
      sources:[S.c1900chi, S.walterRecs, S.c1940jc, S.fsWalter] },
    { id:"louise", name:"Louise S. Mihm Christoffersen", b:"c. 1890", d:"", gen:3, line:"other", direct:true, place:"Jersey City, NJ", role:"", lede:"Born about 1890 in New Jersey; 50 in the 1940 census, ten years older than her husband. Recorded as Lulu in 1930. In July 1948 the announcement of her daughter Evelyn's engagement named only “Mrs. Louise Christoffersen, 52 Bergen Av.,” Jersey City, as parent.", facts:{}, sources:[S.fsLouise, S.c1940jc, S.walterRecs, S.gbEngage1948] },
    { id:"levi1865", name:"Levi Nickerson", b:"1865", d:"1926", gen:4, line:"nick", direct:true, place:"Coeymans, Albany Co., NY", role:"",
      lede:"Born January 1865 in Albany County, son of Stephen Smith Nickerson and Melvina Baumes. Married Orpha (Castle or Caswell), born 1876. Farmed at Coeymans, where the family appears in the 1905, 1910, and 1920 censuses. Died 1926.",
      facts:{ Spouse:"Orpha Castle/Caswell (b. 1876)", Children:"Ethel M. (1893), Earl L. (1897), Stephen J. (1900)" }, sources:[S.fsLevi1865, S.stephenRecs] },
    { id:"orpha", name:"Orpha Castle Nickerson", b:"1876", d:"", gen:4, line:"other", direct:true, place:"Coeymans, NY → Bayonne, NJ", role:"", lede:"Born 1876; surname recorded as Castle or Caswell. Widowed in 1926; living with her son Stephen's family in Bayonne in 1940, where the census indexer recorded her as Orpha Kerr.", facts:{}, sources:[S.fsLevi1865, S.stephenRecs] },
    { id:"stephensmith", name:"Stephen Smith Nickerson", b:"1833", d:"1908", gen:5, line:"nick", direct:true, place:"Coeymans & Ravena, Albany Co., NY", role:"",
      lede:"Born September 23, 1833, in Coeymans, son of Levi Nickerson, then 70, and Levi's second wife Huldah Meech. Lived his whole life in Coeymans, appearing in every state and federal census from 1850 to 1905. Married Melvina Baumes. Died October 19, 1908, at Ravena.",
      facts:{ Spouse:"Melvina Baumes (1843–1898)", Children:"Three, incl. Levi (1865)" }, sources:[S.fsStephenSmith, S.fsLevi1865] },
    { id:"melvina", name:"Melvina Baumes Nickerson", b:"1843", d:"1898", gen:5, line:"other", direct:true, place:"Albany Co., NY", role:"", lede:"Born 1843; died 1898 in Albany County.", facts:{}, sources:[S.fsMelvina, S.fsStephenSmith] },
    { id:"levi1763", name:"Levi Nickerson", b:"1763", d:"1847", gen:6, line:"nick", direct:true, place:"Ridgefield, CT → Coeymans, NY", role:"Settled Coeymans by 1800",
      lede:"Born 1763 in Ridgefield, Connecticut, one of nine sons of Eliphaz Nickerson. Moved to Coeymans on the Hudson below Albany, where he appears in every census from 1800 to 1840. Married first Amy (1766–1816), then about 1819 Huldah Meech, 35 years younger; Stephen Smith was born of the second marriage when Levi was 70. Died May 9, 1847; buried at Onesquethaw Cemetery, Feura Bush.",
      facts:{ Spouses:"Amy (1766–1816); Huldah Meech (1798–1860), m. c. 1819", Children:"Seven" }, sources:[S.fsLevi1763, S.fsEliphaz] },
    { id:"huldah", name:"Huldah Meech Nickerson", b:"1798", d:"1860", gen:6, line:"other", direct:true, place:"Coeymans, NY", role:"", lede:"Second wife of Levi Nickerson, married about 1819; mother of Stephen Smith Nickerson. Died 1860.", facts:{}, sources:[S.fsHuldah, S.fsLevi1763] },
    { id:"eliphaz", name:"Eliphaz Nickerson", b:"1739", d:"1794", gen:7, line:"nick", direct:true, place:"Chatham, MA → Ridgefield, CT", role:"",
      lede:"Born 1739 in Chatham on Cape Cod. Moved with his father to Ridgefield, Connecticut, where he married Sybil Norris in April 1757 and raised nine sons, several with Old Testament names of the period: Joseph Norris, Eliphaz, Jonathan, Levi, Asahel, Abijah, Omri, Ezra, and James Allen. In Ridgefield in the 1790 census. Died 1794; buried at Titicus Cemetery, Ridgefield.",
      facts:{ Spouse:"Sybil Norris (b. 1740), m. April 1757, Ridgefield" }, sources:[S.fsEliphaz, S.fsJames] },
    { id:"sybil", name:"Sybil Norris Nickerson", b:"1740", d:"", gen:7, line:"other", direct:true, place:"Ridgefield, CT", role:"", lede:"Married Eliphaz Nickerson in April 1757 in Ridgefield (Connecticut vital records); mother of nine sons.", facts:{}, sources:[S.fsSybil, S.fsEliphaz] },
    { id:"jamesn", name:"James Nickerson", b:"1704", d:"1757", gen:8, line:"nick", direct:true, place:"Chatham, MA → Ridgefield, CT", role:"Left Cape Cod for Connecticut",
      lede:"Born July 28, 1704, in Chatham, son of Ensign William Nickerson. Married Dorcas Covel there in 1729; five sons and two daughters. Moved the family to Fairfield County, Connecticut, and died there in 1757, at Ridgefield or Danbury.",
      facts:{ Spouse:"Dorcas Hannah Covel (1714–1803), m. 1729, Chatham", Children:"Marcy, Joseph, William, Eliphaz, Samuel, Ezra, Dorcas" }, sources:[S.fsJames, S.fsDorcas] },
    { id:"dorcas", name:"Dorcas Covel Nickerson", b:"1714", d:"1803", gen:8, line:"other", direct:true, place:"Chatham, MA → Connecticut", role:"", lede:"Married James Nickerson in Chatham in 1729; lived to 89.", facts:{}, sources:[S.fsDorcas, S.fsJames] },
    { id:"ensign", name:"Ensign William Nickerson", b:"1668", d:"1742", gen:9, line:"nick", direct:true, place:"Chatham, MA", role:"Tanner; militia ensign",
      lede:"Born about 1668 in Chatham, grandson of the founder. Styled Ensign from about 1706 as leader of the town's militia company. A tanner at Cotchpinicut (Old Harbor), supplying the boots, shoes, and leather breeches nearly every man wore at work; he also held land at Monomessett (Nickerson's) Neck from his father, and left the tannery to his sons Caleb, Nathaniel, and Eldad. Married Deliverance Lombard before 1701 and, after her death, Hannah Atwood on October 24, 1717. Died November 15, 1742; buried at People's Cemetery, Chatham.",
      facts:{ Spouses:"Deliverance Lombard (1680–1716); Anna Hannah Atwood (1688–1764), m. 1717", Children:"Twelve, incl. William, James, Nathaniel, Joshua, Elizabeth" }, sources:[S.fsEnsign, S.fsWmJr] },
    { id:"deliverance", name:"Deliverance Lombard Nickerson", b:"1680", d:"1716", gen:9, line:"other", direct:true, place:"Chatham, MA", role:"", lede:"First wife of Ensign William Nickerson; mother of his first nine children. Died 1716.", facts:{}, sources:[S.fsDeliverance, S.fsEnsign] },
    { id:"williamjr", name:"William Nickerson Jr.", b:"1646", d:"1719", gen:10, line:"nick", direct:true, place:"Yarmouth → Chatham, MA", role:"",
      lede:"Born June 1, 1646, in Yarmouth on Cape Cod, son of the founder of Chatham. Married Mercy Williams on November 30, 1668, in Chatham; fourteen children. Died April 7, 1719, in Chatham.",
      facts:{ Spouse:"Mercy Williams (1643–1739), m. Nov. 30, 1668" }, sources:[S.fsWmJr, S.fsMercy] },
    { id:"mercy", name:"Mercy Williams Nickerson", b:"1643", d:"1739", gen:10, line:"other", direct:true, place:"Chatham, MA", role:"", lede:"Married William Nickerson Jr. in 1668; lived to 96.", facts:{}, sources:[S.fsMercy, S.fsWmJr] },
    { id:"williamsr", name:"William Nickerson", b:"1604", d:"1690", gen:11, line:"nick", direct:true, place:"Norwich, England → Chatham, MA", role:"Founder of Chatham",
      lede:"A weaver of Norwich, Norfolk. Married Anne Busby there on June 24, 1627. Sailed for New England with his family in 1637, landed at Salem, and moved to Yarmouth on Cape Cod. In the 1650s he bought land at Monomoyick from the sachem Mattaquason without the colony's permission, a dispute with Plymouth that ran for years before he was confirmed in his title; the settlement became Chatham. Died 1690. Most Nickersons in America descend from him.",
      facts:{ Spouse:"Anne Busby (1607–1686), m. June 24, 1627, Norwich", Children:"Ten, incl. Nicholas, Elizabeth, Robert, Anne, William" }, sources:[S.fsWmSr, S.fsWmJr, S.nfa, S.nfaHist] },
    { id:"anne", name:"Anne Busby Nickerson", b:"1607", d:"1686", gen:11, line:"other", direct:true, place:"Norwich, England → Chatham, MA", role:"", lede:"Married William Nickerson in Norwich in 1627 and crossed with him in 1637; mother of ten. Died 1686.", facts:{}, sources:[S.fsAnne, S.fsWmSr, S.nfaHist] },

    // ---- Christoffersen / Olsen ----
    { id:"martinc", name:"Martin Christoffersen", b:"1864", d:"", gen:4, line:"chr", direct:true, place:"Denmark → Chicago → Kearny & Jersey City, NJ", role:"Immigrant, 1885",
      lede:"Born January 1864 in Denmark, son of Hans Jacob Christoffersen and Karen. Came to the United States in 1885. Married Inger Mathilde Olsen in a Lutheran church in Chicago on November 7, 1891. Living at Jefferson Park on Chicago's northwest side in 1900 with five children; in Kearny, New Jersey, by 1915 and Jersey City by 1920, where he and Inger, recorded as Christina, were still living in 1930. His son Charles died in New York City. His home parish in Denmark has not been identified; the Copenhagen police emigration registers for 1885 record last residence for every departing emigrant.",
      facts:{ Spouse:"Inger Mathilde Olsen (1868–), m. Nov. 7, 1891, Chicago", Children:"Charles (1892), Olaf (1894), Inga (1897), Martin (1899), Walter (1900)" },
      sources:[S.marriage1891, S.c1900chi, S.martinNJ, S.udvandrer] },
    { id:"ingasr", name:"Inger Mathilde Olsen Christoffersen", b:"1868", d:"", gen:4, line:"chr", direct:true, place:"Egersund, Rogaland, Norway → Chicago → Jersey City", role:"",
      lede:"Born December 25, 1868, in Egersund, a fishing and pottery town on the southwest coast of Norway, and baptized there January 3, 1869, daughter of Otto Johan Olsen and Olava Olsdatter. Emigrated to Chicago and married Martin Christoffersen there on November 7, 1891. Recorded as Enga, Inga, Cristena, and Christina in American censuses. Her granddaughter Inga carries her name.",
      facts:{ Parents:"Otto Johan Olsen and Olava Olsdatter, Egersund", Children:"Charles, Olaf, Inga, Martin, Walter" }, sources:[S.ingerBapt, S.marriage1891, S.c1900chi, S.martinNJ] },
    { id:"hansjacob", name:"Hans Jacob Christoffersen", b:"", d:"", gen:5, line:"chr", direct:true, place:"Denmark", role:"", lede:"Named, with his wife Karen, as Martin's parents in the 1891 Chicago marriage record. Under Danish naming custom of the 1860s a son of his would ordinarily have been baptized Martin Hansen, taking Christoffersen as a fixed surname later; his parish has not yet been identified.", facts:{ Spouse:"Karen" }, sources:[S.marriage1891] },
    { id:"karen", name:"Karen Christoffersen", b:"", d:"", gen:5, line:"other", direct:true, place:"Denmark", role:"", lede:"Mother of Martin Christoffersen, per the 1891 marriage record; maiden name not recorded there.", facts:{}, sources:[S.marriage1891] },
    { id:"otto", name:"Otto Johan Olsen", b:"1845", d:"", gen:5, line:"chr", direct:true, place:"Egersund, Rogaland, Norway", role:"",
      lede:"Born July 8, 1845, in Egersund and baptized there August 31, son of Ole Andreas Olsen and Inger Marie Thorsdatter. Married Olava Olsdatter, 18, at Egersund church on October 18, 1866 (Eigersund parish book 1866–1878, p. 381, entry 28). Children include Inger Mathilde (1868), Marthe, and Ingeborg Andrea.",
      facts:{ Spouse:"Olava Olsdatter (c. 1848–), m. Oct. 18, 1866" }, sources:[S.ottoMarr, S.ottoBapt, S.fsOtto] },
    { id:"olava", name:"Olava Olsdatter Olsen", b:"c. 1848", d:"", gen:5, line:"other", direct:true, place:"Egersund, Rogaland, Norway", role:"", lede:"Eighteen at her marriage in October 1866, daughter of an Ole Olsen of Egersund. Probably the Olave born January 25, 1849, to Ole Olsen and Marthe Olsdatter and baptized at Egersund February 25, 1849.", facts:{ Children:"Inger Mathilde, Marthe, Ingeborg Andrea" }, sources:[S.ottoMarr, S.olavaBapt, S.fsOlava] },
    { id:"oleandreas", name:"Ole Andreas Olsen", b:"", d:"", gen:6, line:"chr", direct:true, place:"Egersund, Rogaland, Norway", role:"", lede:"Father of Otto Johan Olsen, per the Egersund baptism register of 1845 and the marriage register of 1866.", facts:{ Spouse:"Inger Marie Thorsdatter" }, sources:[S.ottoBapt, S.ottoMarr] },
    { id:"ingermarie", name:"Inger Marie Thorsdatter", b:"", d:"", gen:6, line:"other", direct:true, place:"Egersund, Rogaland, Norway", role:"", lede:"Mother of Otto Johan Olsen. Her name passed to her granddaughter Inger Mathilde and, two generations further on, to Inga Christoffersen of Jersey City.", facts:{}, sources:[S.ottoBapt] },
    { id:"oleolsen", name:"Ole Olsen", b:"", d:"", gen:6, line:"chr", direct:true, probable:true, place:"Egersund, Rogaland, Norway", role:"", lede:"Father of Olava, per her 1866 marriage record; probably the Ole Olsen married to Marthe Olsdatter whose daughter Olave was born in January 1849.", facts:{ Spouse:"Marthe Olsdatter (probable)" }, sources:[S.ottoMarr, S.olavaBapt] },
    { id:"jehan", name:"Jehan Michelet, “le Masson”", short:"Jehan Michelet", b:"fl. 1444", d:"", gen:13, line:"mick", direct:true, probable:true, place:"Metz", role:"Earliest recorded Michelet of Metz",
      lede:"A mason (“le Masson”) of Metz recorded in 1444, the head of the genealogical table of the Michelet family of Metz that Prof. Karl Ludwig Michelet of Berlin compiled from city baptismal certificates, the researches of the Metz Protestant pastor, and family papers, and sent to Pennsylvania in 1883. Later generations of the table are borne out by the surviving Reformed registers; the earlier ones, in the words of the 1893 genealogy, are “more or less conjectural.” The same table names a Jean Michelet, butcher, invested with the Order of Saint Michael by Louis XI in 1471 and Seigneur de Beauval, and an Antoine Jacques Michelet, president of the Parlement of Rouen in 1596, bearing the same arms. The family's arms, as carried from Metz to Berlin, show a fortress tower topped by a cap of liberty with a stag leaping the moat, and the motto “War, the Chase and Liberty.”",
      facts:{}, sources:[S.mick1893] },
    { id:"jacquemin", name:"Jacques “Jacquemin” Michelet", short:"Jacquemin Michelet", b:"c. 1550", d:"1610", gen:12, line:"mick", direct:true, place:"Metz", role:"Clerk to the King's treasurer at Metz",
      lede:"A scrivener (escripvain) of Metz in 1576, clerk in 1579, receiver (receveur) in 1587, and from 1593 clerk to the King's treasurer; died in 1610. Twice married in the Reformed church: first to Suzanne Joly, who died in 1584, and on July 28, 1591, to Suzanne Wiriot. By his first wife he had Jacques (1576–1651, an elder of the church), Susanne, Pierre (1582–1632, a pastor), Paul (1584, deacon and farmer of the city mills, whose sons went to Norway), and Daniel; by the second, Samuel and Esther, who married David de la Cloche.",
      facts:{ Spouses:"Suzanne Joly (d. 1584); Suzanne Wiriot, m. 28 Jul 1591", Children:"Jacques (1576), Susanne (1579), Pierre (1582), Paul (1584), Daniel (1592), Samuel (1598), Esther (1603)" },
      sources:[S.metzJacqueminMarr, S.metzJacques1576, S.metzDanielBapt, S.mick1893, S.metzColl] },
    { id:"daniel1592", name:"Daniel Michelet", b:"1592", d:"", gen:11, line:"mick", direct:true, place:"Metz", role:"",
      lede:"Baptized in the Reformed church of Metz on September 20, 1592, son of Jacquemin Michelet. Married Marie Colin, daughter of Daniel Collin, a practitioner at the law courts (praticien du palais), on February 8, 1615. His eldest son Daniel (1615–1659) married Judith de la Cloche; his daughter Esther died unmarried in 1684; his son Jacques, the dyer, was grandfather of the emigrant to Pennsylvania.",
      facts:{ Spouse:"Marie Colin, m. 8 Feb 1615", Children:"Daniel (1615–1659), Esther (1619–1684), Jacques (1623–1685), Suzanne (1627–1668)" },
      sources:[S.metzDanielBapt, S.metzDanielMarr, S.metzJacquesMarr, S.metzDaniel1615, S.mick1893, S.metzColl] },
    { id:"paul1584", name:"Paul Michelet", b:"1584", d:"", gen:11, line:"mick", direct:false, place:"Metz → (sons to Norway, 1644)", role:"Ancestor of the Norwegian Michelets",
      lede:"Baptized December 16, 1584, son of Jacquemin Michelet and Suzanne Joly; a deacon of the Reformed church and farmer of the city mills of Metz. Married Anne Pillon, daughter of Josué Pillon, receiver of the bullette tax. Two of his sons, Paul (baptized September 5, 1617) and Jacques (baptized April 7, 1619), emigrated to Norway in 1644 as officers in the Danish-Norwegian army; Paul was a lieutenant in 1644 and major by 1658, present at the siege of Trondheim, and died in 1659. Their descendants became the Norwegian Michelet family of soldiers, clergy, and jurists, among them Major General Jørgen Michelet (1742–1818) and Major General Christian Frederik Michelet (1792–1874), commandant of Fredriksten fortress; a Captain Michelet of Trondheim was corresponding with the Berlin branch in the 1880s.",
      facts:{ Spouse:"Anne Pillon", Children:"Paul (1617–1659), Jacques (1619)" },
      sources:[S.metzJacques1619, S.mick1893, S.wikiCFM, S.wikiMichelet, S.metzColl] },
    { id:"louis1705", name:"Louis Michelet", short:"Louis Michelet (Berlin)", b:"1705", d:"1766", gen:8, line:"mick", direct:false, place:"Metz → Berlin", role:"Silk manufacturer in Berlin",
      lede:"Born at Metz December 8, 1705, younger brother of the emigrant to Pennsylvania. Left Metz for Berlin in 1720, arriving with David Girard, a kinsman by marriage, to apprentice in the silk manufactory of Girard, Michelet & Compagnie, in which he later became a partner; the firm stayed in the family for three generations. Berlin's French colony, founded by Huguenot refugees after 1685, was where the Michelets of Prussia married only within the faith. Died 1766. His son Pierre (1741–1787) was an officer of hussars under Frederick the Great; his grandson Edouard a captain in the war of 1813–15; his great-grandson the philosopher Karl Ludwig Michelet.",
      facts:{ Children:"Louis (1736–1800), Marie Françoise (1738–1796), Pierre (1741–1787), Robert David (1744–1802)" },
      sources:[S.mick1893, S.fsLouisG] },
    { id:"karl", name:"Prof. Karl Ludwig Michelet", b:"1801", d:"1893", gen:5, line:"mick", direct:false, place:"Berlin", role:"Hegelian philosopher; compiled the Metz family table",
      lede:"Born in Berlin December 4, 1801, son of Louis Guillaume Michelet (1775–1841) and Wilhelmine Victoire Girard, of the Huguenot French colony. Doctor of philosophy at Berlin in 1824, professor from 1829 until his death; a pupil of Hegel who edited Hegel's collected works (1832–42), founded the Berlin Philosophical Society in 1845, and wrote on ethics, Aristotle, and the personality of God. In 1883, answering a letter from Minnie F. Mickley of Pennsylvania, he sent the genealogical table of the Michelets of Metz from 1444, reasoned out that her ancestor Jean Jacques must be the missing eldest son of Louis Michelet and Suzanne Mangeot born at Zweibrücken, and concluded that the American and Berlin families descended from two brothers. Her father visited him in Berlin in 1889. Died December 15, 1893, the year the Mickley genealogy was printed.",

  function labelSeparation() {

          if (Math.abs(a.y - b.y) > 44) continue;
          const left = a.x <= b.x ? a : b, right = left === a ? b : a;
          const need = labelWidth(left) + 14;
          const dx = right.x - left.x;
          if (dx < need) {
            const push = (need - dx) * 0.5 * alpha * 6;
            left.vx -= push; right.vx += push;

    links.forEach(l => {

      if (l.type === "grand") { if (s === p.id) out.Grandchild.push(t); if (t === p.id) out.Grandparents.push(s); }
    });
    return out;
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function renderPanel(p) {
    if (!p) {
      const direct = nodes.filter(n => n.direct).length;
      panel.innerHTML = `
        <div class="empty">
          <p class="eyebrow">Four lines, one family</p>
          <h2>From Metz, Norwich, and Denmark to Tamaqua and Highland Park</h2>
          <p class="lede">The Michelet family left Metz as Huguenots, became the Mickleys of Lehigh County, and hid the Liberty Bell in 1777. Their line reaches the Millets through Susanna Mickley’s daughter Catharine, who married Frederick Millet of Orwigsburg in Tamaqua about 1862. On Christine Nickerson’s side, the Nickersons run back through Bayonne, the Hudson Valley, and Ridgefield to William Nickerson, who founded Chatham on Cape Cod in the 1660s; the Christoffersens came from Denmark, and the Olsens from Egersund in Norway, to Chicago in the 1880s.</p>
          <div class="stat">
            <div><b>${nodes.length}</b><small>people on record</small></div>
            <div><b>${direct}</b><small>direct ancestors of Chris Millet</small></div>
            <div><b>${GEN_COUNT}</b><small>generations</small></div>
            <div><b>1733</b><small>Michelets land at Philadelphia</small></div>
          </div>
          <p>Filled circles are direct ancestors of Chris Millet; outlined circles are their siblings, cousins, and children. Solid edges are parent to child, dashed edges are marriages, and dotted edges are links the records make likely but do not yet prove.</p>
          <p>Click any circle to see what the records say and where each fact came from.</p>
        </div>`;
      return;
    }
    const rel = relations(p);
    const chips = (ids) => ids.map(id => `<button class="chip" data-id="${id}" type="button">${esc(labelOf(byId[id]))}</button>`).join("");
    const relRows = Object.entries(rel).filter(([,v]) => v.length).map(([k,v]) => `<dt>${k}</dt><dd><div class="rel">${chips(v)}</div></dd>`).join("");
    const factRows = Object.entries(p.facts || {}).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
    const roles = [
      p.direct ? `<span class="role direct">Direct ancestor</span>` : "",
      p.probable ? `<span class="role probable">Probable link</span>` : "",
      p.role ? `<span class="role">${esc(p.role)}</span>` : ""
    ].join("");
    const dates = [yearsOf(p), p.place].filter(Boolean).join(" · ");
    const sources = (p.sources || []).map(([t,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("");
    panel.innerHTML = `
      <p class="eyebrow ${lineClass[p.line]}">${lineName[p.line]}</p>
      <h2>${esc(p.name)}</h2>
      <p class="dates">${esc(dates)}</p>
      <div>${roles}</div>
      ${p.lede ? `<p class="lede">${esc(p.lede)}</p>` : ""}
      <dl>${relRows}${factRows}</dl>
      ${sources ? `<h3 class="src">Records</h3><ul class="sources">${sources}</ul>` : ""}`;
    panel.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => focusOn(b.dataset.id)));
    panel.scrollTop = 0;
  }

  function focusOn(id) {
    select(id);
    const n = byId[id];
    const t = d3.zoomTransform(svg.node());
    const target = d3.zoomIdentity.translate(W/2 - n.x * t.k, H/2 - n.y * t.k).scale(t.k);
    svg.transition().duration(500).call(zoom.transform, target);
  }

  // direct-only filter
  const directOnly = document.getElementById("directOnly");
  directOnly.addEventListener("change", () => {
    const on = directOnly.checked;
    node.classed("hidden", n => on && !n.direct);
    link.classed("hidden", l => on && !(l.source.direct && l.target.direct && l.type !== "sibling"));
    sim.force("collide", d3.forceCollide(n => on ? 44 : (n.direct ? 52 : 60)).strength(0.95));
    sim.alpha(0.3).restart();
  });

  // search
  const q = document.getElementById("q"), ql = document.getElementById("qlist");
  let active = -1, matches = [];
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase();
    matches = v ? nodes.filter(n => n.name.toLowerCase().includes(v) || (n.place||"").toLowerCase().includes(v)).slice(0,8) : [];
    active = -1;
    ql.innerHTML = matches.map(n => `<li data-id="${n.id}" tabindex="-1">${esc(n.name)}<small>${esc(yearsOf(n))}</small></li>`).join("");
    ql.hidden = matches.length === 0;
    ql.querySelectorAll("li").forEach(li => li.addEventListener("mousedown", ev => { ev.preventDefault(); pick(li.dataset.id); }));
  });
  q.addEventListener("keydown", ev => {
    if (ql.hidden) return;
    if (ev.key === "ArrowDown") { active = Math.min(active+1, matches.length-1); mark(); ev.preventDefault(); }
    else if (ev.key === "ArrowUp") { active = Math.max(active-1, 0); mark(); ev.preventDefault(); }
    else if (ev.key === "Enter") { if (matches[Math.max(active,0)]) pick(matches[Math.max(active,0)].id); }
    else if (ev.key === "Escape") { ql.hidden = true; }
  });
  q.addEventListener("blur", () => setTimeout(() => ql.hidden = true, 120));
  function mark() { ql.querySelectorAll("li").forEach((li,i) => li.classList.toggle("active", i === active)); }
  function pick(id) { ql.hidden = true; q.value = byId[id].name; focusOn(id); }

  document.getElementById("reset").addEventListener("click", fit);

  function fit() {
    W = stage.clientWidth; H = stage.clientHeight;
    // fit to the people actually drawn (plus their labels), not the whole canvas
    const shown = nodes.filter(n => !(directOnly.checked && !n.direct));
    const x0 = d3.min(shown, n => n.x) - 24, x1 = d3.max(shown, n => n.x + labelWidth(n)) + 12;
    const y0 = d3.min(shown, n => n.y) - bandH * 0.6, y1 = d3.max(shown, n => n.y) + bandH * 0.6;
    const bw = Math.max(600, x1 - x0), bh = Math.max(400, y1 - y0);
    const k = Math.min(W / bw, H / bh) * 0.985;
    const tx = (W - bw * k) / 2 - x0 * k, ty = (H - bh * k) / 2 - y0 * k;
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
  }
  window.addEventListener("resize", () => { W = stage.clientWidth; H = stage.clientHeight; });

  renderPanel(null);
  // settle the layout off-screen, then let it breathe just slightly so it reads as live
  sim.stop();
  for (let i = 0; i < 400; i++) sim.tick();
  link.attr("d", pathFor);
  node.attr("transform", n => `translate(${n.x},${n.y})`);
  sim.alpha(0.06).restart();
  setTimeout(fit, 30);
})();
</script>

</body>
</html>
