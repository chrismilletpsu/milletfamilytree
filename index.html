<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millet Genealogy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #ECEEF0;
    --surface: #FAFBFB;
    --surface-2: #E1E5E9;
    --line: #C9CFD5;
    --ink: #1B232D;
    --ink-2: #4E5A67;
    --ink-3: #7C8793;
    --mickley: #9C6C2E;
    --mickley-soft: #E8D9C3;
    --millet: #3E6D8B;
    --millet-soft: #CFDEE8;
    --moyer: #6E6A3C;
    --nick: #8A4A60;
    --chr: #2E7A78;
    --direct: #1B232D;
    --probable: #A0A8B0;
    --focus: #D18A2B;
    --event: #6D28D9;
    --band-a: rgba(27,35,45,0.035);
    --shadow: 0 1px 2px rgba(27,35,45,0.08), 0 8px 24px rgba(27,35,45,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12171D;
      --surface: #1A2129;
      --surface-2: #232C36;
      --line: #313B46;
      --ink: #E7EAED;
      --ink-2: #AEB7C0;
      --ink-3: #7E8994;
      --mickley: #D4A45A;
      --mickley-soft: #3A2E1C;
      --millet: #7FB2D0;
      --millet-soft: #1F3442;
      --moyer: #B8B26A;
      --nick: #D48CA6;
      --chr: #7CC8C4;
      --direct: #E7EAED;
      --probable: #56616C;
      --focus: #E9A94C;
      --event: #A855F7;
      --band-a: rgba(231,234,237,0.035);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #12171D;
    --surface: #1A2129;
    --surface-2: #232C36;
    --line: #313B46;
    --ink: #E7EAED;
    --ink-2: #AEB7C0;
    --ink-3: #7E8994;
    --mickley: #D4A45A;
    --mickley-soft: #3A2E1C;
    --millet: #7FB2D0;
    --millet-soft: #1F3442;
    --moyer: #B8B26A;
    --nick: #D48CA6;
    --chr: #7CC8C4;
    --direct: #E7EAED;
    --probable: #56616C;
    --focus: #E9A94C;
    --event: #A855F7;
    --band-a: rgba(231,234,237,0.035);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 360px 1fr;
    grid-template-areas: "head head" "side stage";
    height: 100vh;
  }
  header {
    grid-area: head;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header h1 {
    font-family: "Libre Caslon Text", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 21px;
    margin: 0;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  header h1 em { font-style: italic; color: var(--mickley); }
  .controls { display: flex; align-items: center; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid currentColor; }
  .sw.fill { background: currentColor; }
  .sw.mick { color: var(--mickley); }
  .sw.mill { color: var(--millet); }
  .sw.moy { color: var(--moyer); }
  .sw.nick { color: var(--nick); }
  .sw.chr { color: var(--chr); }
  .ln { width: 22px; height: 0; border-top: 2px solid var(--direct); display: inline-block; }
  .ln.dash { border-top-style: dashed; border-color: var(--ink-3); }
  .ln.dot { border-top: 2px dotted var(--probable); }
  .sw-mark { flex: none; width: 15px; height: 15px; display: block; }
  .sw-mark circle { fill: none; stroke: var(--event); stroke-width: 2.25; }
  .sw-mark path { fill: var(--event); }
  label.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  label.toggle input { accent-color: var(--mickley); width: 15px; height: 15px; margin: 0; }
  .search { position: relative; }
  .search input {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--ground); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 10px; width: 200px;
  }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .search ul {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px 0;
    list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: var(--shadow); z-index: 20; max-height: 260px; overflow: auto;
  }
  .search ul[hidden] { display: none; }
  .search li { padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .search li:hover, .search li.active { background: var(--surface-2); }
  .search li small { color: var(--ink-3); margin-left: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  button.reset {
    font: inherit; font-size: 12px; color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer;
  }
  button.reset:hover { background: var(--surface-2); }
  button.reset:focus-visible, .search li:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  aside {
    grid-area: side;
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 22px 22px 32px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
    font-weight: 500; margin: 0 0 6px;
  }
  .eyebrow.mick { color: var(--mickley); }
  .eyebrow.mill { color: var(--millet); }
  .eyebrow.moy { color: var(--moyer); }
  .eyebrow.nick { color: var(--nick); }
  .eyebrow.chr { color: var(--chr); }
  aside h2 {
    font-family: "Libre Caslon Text", Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.15;
    margin: 0 0 6px; text-wrap: balance;
  }
  .dates { font-family: "IBM Plex Mono", "Menlo", monospace; font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; }
  .role {
    display: inline-block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); margin: 0 6px 14px 0;
  }
  .role.direct { background: var(--ink); color: var(--surface); }
  .role.probable { background: transparent; border: 1px dotted var(--ink-3); }
  .role.event { background: transparent; border: 1px solid var(--event); color: var(--event); }
  .event-note {
    border: 1px solid var(--line); border-left: 3px solid var(--event); border-radius: 4px;
    background: var(--ground); padding: 12px 14px; margin: 0 0 14px; max-width: 46ch;
  }
  .event-note .eyebrow { color: var(--event); }
  .event-note h3 {
    font-family: "Libre Caslon Text", Georgia, serif; font-weight: 400; font-size: 16px;
    line-height: 1.25; margin: 0 0 6px; text-wrap: balance;
  }
  .event-note p { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); margin: 0; }
  aside p { margin: 0 0 12px; max-width: 46ch; color: var(--ink); }
  aside p.lede { font-family: "Libre Caslon Text", Georgia, serif; font-size: 15.5px; line-height: 1.5; }
  dl { margin: 0 0 16px; display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; font-size: 13px; }
  dt { color: var(--ink-3); }
  dd { margin: 0; }
  dd a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; }
  dd a:hover { text-decoration-color: var(--ink); }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--ground); color: var(--ink); cursor: pointer;
  }
  .chip:hover { border-color: var(--ink-2); }
  .chip:focus-visible { outline: 2px solid var(--focus); }
  h3.src { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; font-weight: 500; }
  ul.sources { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  ul.sources li { padding: 6px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
  ul.sources li a { color: var(--ink); }
  .empty p { color: var(--ink-2); max-width: 44ch; }
  .empty .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 16px; }
  .empty .stat div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--ground); }
  .empty .stat b { display: block; font-family: "Libre Caslon Text", Georgia, serif; font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .empty .stat small { color: var(--ink-3); font-size: 11.5px; }

  .stage { grid-area: stage; position: relative; overflow: hidden; }
  .viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .viewtoggle button {
    font: inherit; font-size: 12px; padding: 4px 12px; border: 0; cursor: pointer;
    background: var(--surface); color: var(--ink-2);
  }
  .viewtoggle button + button { border-left: 1px solid var(--line); }
  .viewtoggle button.on { background: var(--ink); color: var(--surface); }
  #map { width: 100%; height: 100%; display: block; }
  .land { fill: var(--surface-2); stroke: var(--line); stroke-width: 0.6; }
  .graticule { fill: none; stroke: var(--line); stroke-width: 0.4; opacity: 0.5; }
  .geolabel { font-family: "IBM Plex Sans", sans-serif; text-anchor: middle; pointer-events: none; }
  .geolabel.country { fill: var(--ink-3); opacity: 0.55; font-weight: 500; }
  .geolabel.town { fill: var(--ink-3); opacity: 0.45; }
  .placedot { cursor: pointer; }
  .placedot circle.halo { fill: var(--ink); opacity: 0.06; }
  .placedot circle.core { stroke: var(--surface); stroke-width: 1.2; }
  .placedot text, .labelmeasure text { font-family: "IBM Plex Sans", sans-serif; font-size: 10px; fill: var(--ink-2);
    paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
  .placedot.sel circle.core { stroke: var(--focus); stroke-width: 2.5; }
  .flight { fill: none; stroke: var(--focus); stroke-width: 1.6; }
  .flight.est { stroke-dasharray: 3 4; }
  .flightdot { fill: var(--focus); }
  .eventcard {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: min(430px, calc(100% - 40px));
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--event);
    border-radius: 5px; padding: 13px 16px 14px; box-shadow: var(--shadow);
    opacity: 0; transition: opacity .45s ease; pointer-events: none; z-index: 3;
  }
  .eventcard.show { opacity: 1; }
  .eventcard .eyebrow { color: var(--event); margin-bottom: 4px; }
  .eventcard h3 {
    font-family: "Libre Caslon Text", Georgia, serif; font-weight: 400; font-size: 17px;
    line-height: 1.25; margin: 0 0 7px; text-wrap: balance; color: var(--ink);
  }
  .eventcard p { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin: 0; }
  .eventcard .who {
    margin: 0 0 6px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    color: var(--ink); line-height: 1.45;
  }
  .eventcard button {
    margin-top: 12px; font: inherit; font-size: 12px; padding: 5px 14px; cursor: pointer;
    border: 1px solid var(--event); background: var(--event); color: var(--surface); border-radius: 3px;
  }
  .eventcard.show { pointer-events: auto; }
  .timeline {
    position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 12px; backdrop-filter: blur(4px);
  }
  .timeline button {
    font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--ground);
    color: var(--ink); border-radius: 3px; padding: 3px 9px; cursor: pointer; flex: none;
  }
  .timeline button.ghost { color: var(--ink-2); }
  .timeline input[type=range] { flex: 1; accent-color: var(--focus); }
  .timeline .yearout {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink);
    min-width: 8ch; text-align: right; font-variant-numeric: tabular-nums; flex: none;
  }

  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  [hidden] { display: none !important; }
  svg:active { cursor: grabbing; }
  .band-label {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--ink-3); letter-spacing: 0.06em;
  }
  .band-title { font-family: "Libre Caslon Text", Georgia, serif; font-size: 12.5px; fill: var(--ink-2); }
  .band { fill: var(--band-a); }
  .band-line { stroke: var(--line); stroke-width: 1; }
  .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.2; stroke-opacity: 0.55; }
  .edge.direct { stroke: var(--direct); stroke-width: 2.4; stroke-opacity: 0.95; }
  .edge.spouse { stroke-dasharray: 4 4; }
  .edge.probable { stroke-dasharray: 2 5; stroke: var(--probable); stroke-width: 2; stroke-linecap: round; }
  .edge.grand { stroke-dasharray: 8 5; }
  .node { cursor: pointer; }
  .node circle.dot { stroke-width: 2; }
  .node.line-mick circle.dot { stroke: var(--mickley); fill: var(--surface); }
  .node.line-mill circle.dot { stroke: var(--millet); fill: var(--surface); }
  .node.line-moy circle.dot { stroke: var(--moyer); fill: var(--surface); }
  .node.line-nick circle.dot { stroke: var(--nick); fill: var(--surface); }
  .node.line-chr circle.dot { stroke: var(--chr); fill: var(--surface); }
  .node.line-other circle.dot { stroke: var(--ink-3); fill: var(--surface); }
  .node.direct.line-mick circle.dot { fill: var(--mickley); }
  .node.direct.line-mill circle.dot { fill: var(--millet); }
  .node.direct.line-moy circle.dot { fill: var(--moyer); }
  .node.direct.line-nick circle.dot { fill: var(--nick); }
  .node.direct.line-chr circle.dot { fill: var(--chr); }
  .node.direct.line-other circle.dot { fill: var(--ink-2); }
  .node.probable circle.dot { stroke-dasharray: 3 3; }
  .node text { font-family: "IBM Plex Sans", sans-serif; font-size: 11.5px; fill: var(--ink); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
  .node text.years { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-2); }
  .node.direct text { font-weight: 600; }
  .node.selected circle.dot { stroke: var(--focus); stroke-width: 4; }
  /* Dim by fading each shape's paint, not the whole group: group opacity makes Safari draw
     every dimmed person into a layer of its own, on every frame of a pan or zoom. Set on the
     group, the two properties are inherited by its shapes; a rule like ".node.dim > *" would
     do the same but makes every move of a person restyle all its children. */
  .node.dim { fill-opacity: 0.18; stroke-opacity: 0.18; }
  .edge.dim { stroke-opacity: 0.099; }          /* 0.55 x 0.18, as the group opacity gave */
  .edge.direct.dim { stroke-opacity: 0.171; }   /* 0.95 x 0.18 */
  .node.hidden, .edge.hidden { display: none; }
  .node.hit circle.dot { stroke: var(--focus); stroke-width: 3.5; }
  .node circle.ring { fill: none; stroke: var(--event); stroke-width: 2.25; }
  .node.direct circle.ring { stroke-width: 2.75; }
  .node path.star { fill: var(--event); }
  .node.direct path.star { fill: var(--surface); }
  .hint {
    position: absolute; left: 16px; bottom: 12px; font-size: 11.5px; color: var(--ink-3);
    background: color-mix(in srgb, var(--ground) 80%, transparent); padding: 4px 8px; border-radius: 3px;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 42vh; grid-template-areas: "head" "stage" "side"; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .search input { width: 140px; }
    body { overflow: hidden; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="app">
  <header>
    <h1>Millet <em>Genealogy</em></h1>
    <div class="controls">
      <div class="legend">
        <span><i class="sw fill mick"></i>Michelet / Mickley</span>
        <span><i class="sw fill moy"></i>Moyer</span>
        <span><i class="sw fill mill"></i>Millet</span>
        <span><i class="sw fill nick"></i>Nickerson</span>
        <span><i class="sw fill chr"></i>Christoffersen / Olsen</span>
        <span><i class="ln"></i>direct line</span>
        <span><i class="ln dash"></i>marriage</span>
        <span><i class="ln dot"></i>probable</span>
        <span><svg class="sw-mark" viewBox="-10 -10 20 20" width="15" height="15" aria-hidden="true"><circle r="8.4"/><path d="M0,-5L1.12,-1.55L4.76,-1.55L1.82,0.59L2.94,4.05L0,1.91L-2.94,4.05L-1.82,0.59L-4.76,-1.55L-1.12,-1.55Z"/></svg>notable event</span>
      </div>
      <div class="viewtoggle" role="group" aria-label="View">
        <button id="viewTree" class="on" type="button">Tree</button><button id="viewMap" type="button">Map</button>
      </div>
      <label class="toggle"><input type="checkbox" id="directOnly"> Direct line only</label>
      <div class="search">
        <input id="q" type="search" placeholder="Find a person" aria-label="Find a person" autocomplete="off">
        <ul id="qlist" hidden></ul>
      </div>
      <button class="reset" id="reset" type="button">Reset view</button>
    </div>
  </header>

  <aside id="panel"></aside>

  <div class="stage">
    <svg id="svg" role="img" aria-label="Family network diagram"></svg>
    <svg id="map" role="img" aria-label="Migration map" hidden></svg>
    <div class="hint" id="hintTree">Click a person for records. Drag to pan, scroll to zoom, drag a circle to move it.</div>
    <div class="eventcard" id="eventCard" hidden>
      <p class="eyebrow" id="ecYear"></p>
      <p class="who" id="ecWho"></p>
      <h3 id="ecTag"></h3>
      <p id="ecText"></p>
      <button id="ecNext" type="button">Continue</button>
    </div>
    <div class="timeline" id="timeline" hidden>
      <button id="playBtn" type="button" aria-label="Play">▶</button>
      <input id="scrub" type="range" min="1550" max="2030" step="1" value="2030" aria-label="Year">
      <span class="yearout" id="yearOut">everyone</span>
      <button id="allBtn" type="button" class="ghost">Show everyone</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data.js"></script>
<script src="land.js"></script>
<script>
(function () {
  // The tree itself (S, P, E, EVENTS, EVENT_YEAR, EVENT_PLACE, GEN_LABELS,
  // LAYOUT_LINE, LAYOUT_X, PLACES, GEO) comes from data.js, and the basemap (LAND,
  // GEOLABELS) from land.js, both loaded above.
  P.forEach(p => { if (EVENTS[p.id]) p.event = EVENTS[p.id]; });

  const byId = Object.fromEntries(P.map(p => [p.id, p]));
  const nodes = P.map(p => Object.assign({}, p));
  const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));   // the laid-out copies, with x and y
  const links = E.map(([s,t,type,prob]) => {
    const direct = byId[s].direct && byId[t].direct && type !== "sibling";
    return { source:s, target:t, type, probable:!!prob, direct };
  });

  // ---------- Layout ----------
  const bandH = 118, top = 40, margin = 40;
  const GEN_MIN = -1, GEN_MAX = 13, GEN_COUNT = GEN_MAX - GEN_MIN + 1;
  const genY = g => top + (g - GEN_MIN) * bandH + bandH/2;
  // x anchors: Mickley/Moyer side left, Millet side right, direct line near centre
  const anchorX = (n, W) => {
    const line = LAYOUT_LINE[n.id] || n.line, x = LAYOUT_X[n.id];
    if (line === "mick") return n.direct ? W * 0.10 : W * (x || 0.16);
    if (line === "moy") return W * 0.26;
    if (line === "chr") return n.direct ? W * 0.91 : W * 0.97;
    if (line === "nick") return n.direct ? W * 0.80 : W * 0.87;
    if (x) return W * x;
    if (n.direct) return W * 0.44;
    return W * 0.50;
  };

  const svg = d3.select("#svg");
  const stage = document.querySelector(".stage");
  let W = stage.clientWidth, H = stage.clientHeight;
  const g = svg.append("g");
  const gBands = g.append("g"), gLinks = g.append("g"), gNodes = g.append("g");

  const zoom = d3.zoom().scaleExtent([0.35, 2.5]).on("zoom", ev => g.attr("transform", ev.transform));
  svg.call(zoom);

  const contentH = top + GEN_COUNT * bandH + margin;
  // wide enough that fitting to the stage height also fills its width
  // give the layout more horizontal room than the stage aspect ratio alone would allow, so
  // siblings and cousins can spread instead of stacking on their line's anchor
  const contentW = Math.max(2200, Math.round(1.25 * W * contentH / Math.max(H, 400)));

  // bands
  for (let gi = GEN_MIN; gi <= GEN_MAX; gi++) {
    const y0 = top + (gi - GEN_MIN) * bandH;
    if ((gi - GEN_MIN) % 2 === 0) gBands.append("rect").attr("class","band").attr("x",-2000).attr("y",y0).attr("width",6000).attr("height",bandH);
    gBands.append("line").attr("class","band-line").attr("x1",-2000).attr("x2",6000).attr("y1",y0).attr("y2",y0);
    const [t, sub] = GEN_LABELS[gi];
    gBands.append("text").attr("class","band-title").attr("x",14).attr("y",y0+18).text(t);
    gBands.append("text").attr("class","band-label").attr("x",14).attr("y",y0+34).text(sub);
  }

  nodes.forEach(n => { n.x = anchorX(n, contentW) + (Math.random()-0.5)*40; n.y = genY(n.gen); });

  const LABEL_W = new Map();
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(l => l.type==="spouse" ? Math.max(120, labelWidth(l.source.x <= l.target.x ? l.source : l.target) + 34) : 90).strength(l => l.type==="spouse" ? 1 : (l.direct ? 0.35 : 0.18)))
    .force("x", d3.forceX(n => anchorX(n, contentW)).strength(n => n.direct ? 0.30 : 0.11))
    .force("y", d3.forceY(n => genY(n.gen)).strength(1.2))
    .force("collide", d3.forceCollide(n => n.direct ? 46 : 50).strength(0.9))
    .force("labels", labelSeparation())
    .alphaDecay(0.03);

  // Labels hang to the right of each circle, so two nodes in the same generation band need
  // horizontal clearance equal to the left node's label width; circles alone under-estimate it.
  // A label never changes, so each width is worked out once (cached in LABEL_W, declared
  // above the simulation because the link force asks for widths as soon as it is created).
  function labelWidth(n) {
    let w = LABEL_W.get(n.id);
    if (w === undefined) {
      w = 18 + (n.direct ? 7.2 : 6.6) * Math.max((n.short || labelOf(n)).length, yearsOf(n).length * 0.9);
      LABEL_W.set(n.id, w);
    }
    return w;
  }
  // Only nodes within 44px of each other vertically can collide. Sorting by height and
  // comparing each node with those just below it finds exactly those pairs, without
  // comparing everyone with everyone (which grows with the square of the tree).
  function labelSeparation() {
    let byY = [];
    function force(alpha) {
      byY.sort((a, b) => a.y - b.y);
      for (let i = 0; i < byY.length; i++) {
        const a = byY[i];
        for (let j = i + 1; j < byY.length && byY[j].y - a.y <= 44; j++) {
          const b = byY[j];
          const left = a.x <= b.x ? a : b, right = left === a ? b : a;
          const need = labelWidth(left) + 14;
          const dx = right.x - left.x;
          if (dx < need) {
            const push = (need - dx) * 0.5 * alpha * 6;
            left.vx -= push; right.vx += push;
          }
        }
      }
    }
    force.initialize = (nodes) => { byY = nodes.slice(); };
    return force;
  }

  const link = gLinks.selectAll("path").data(links).join("path")
    .attr("class", l => "edge " + l.type + (l.direct ? " direct" : "") + (l.probable ? " probable" : ""));

  const node = gNodes.selectAll("g.node").data(nodes).join("g")
    .attr("class", n => "node line-" + n.line + (n.direct ? " direct" : "") + (n.probable ? " probable" : "") + (n.event ? " has-event" : ""))
    .attr("tabindex", 0)
    .attr("role","button")
    .attr("aria-label", n => n.name)
    .call(d3.drag()
      .on("start", (ev,d) => { if (!ev.active) sim.alphaTarget(0.12).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag", (ev,d) => { d.fx=ev.x; d.fy=ev.y; })
      .on("end", (ev,d) => { if (!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  // five-pointed star, point up, inner radius at the golden section of the outer
  function starPath(R) {
    const r = R * 0.382;
    let d = "";
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r : R, a = -Math.PI / 2 + i * Math.PI / 5;
      d += (i ? "L" : "M") + (Math.cos(a) * rad).toFixed(2) + "," + (Math.sin(a) * rad).toFixed(2);
    }
    return d + "Z";
  }

  node.filter(n => n.event).append("circle").attr("class","ring").attr("r", n => (n.direct ? 11 : 8) + 5);
  node.append("circle").attr("class","dot").attr("r", n => n.direct ? 11 : 8);
  node.filter(n => n.event).append("path").attr("class","star").attr("d", n => starPath(n.direct ? 6.6 : 5));
  node.append("text").attr("x", 15).attr("y", -1).text(n => n.short || labelOf(n));
  node.append("text").attr("class","years").attr("x", 15).attr("y", 13).text(n => yearsOf(n));

  function labelOf(n) {
    const parts = n.name.replace(/^(Pvt\.|Sgt\.)\s/, "").split(" ");
    return parts.length > 3 ? parts.slice(0,3).join(" ") : n.name.replace(/^(Pvt\.|Sgt\.)\s/, "");
  }
  function yearsOf(n) { if (!n.b && !n.d) return ""; if (n.b && !n.d) return n.b; return n.b + "–" + n.d; }

  function pathFor(l) {
    const sx = l.source.x, sy = l.source.y, tx = l.target.x, ty = l.target.y;
    if (l.type === "spouse" || l.type === "sibling") return `M${sx},${sy} L${tx},${ty}`;
    const my = (sy + ty) / 2;
    return `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
  }
  sim.on("tick", () => {
    link.attr("d", pathFor);
    node.attr("transform", n => `translate(${n.x},${n.y})`);
  });

  // ---------- Interaction ----------
  const panel = document.getElementById("panel");
  let selected = null;

  function neighborsOf(id) {
    const s = new Set([id]);
    links.forEach(l => { if (l.source.id === id) s.add(l.target.id); if (l.target.id === id) s.add(l.source.id); });
    return s;
  }
  function select(id) {
    selected = id;
    const nb = id ? neighborsOf(id) : null;
    node.classed("selected", n => n.id === id).classed("dim", n => nb ? !nb.has(n.id) : false);
    link.classed("dim", l => nb ? !(l.source.id === id || l.target.id === id) : false);
    renderPanel(id ? byId[id] : null);
  }
  node.on("click", (ev, n) => { ev.stopPropagation(); select(n.id === selected ? null : n.id); });
  node.on("keydown", (ev, n) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); } });
  svg.on("click", () => select(null));

  const lineName = { mick:"Michelet / Mickley line", moy:"Moyer line", mill:"Millet line", nick:"Nickerson line", chr:"Christoffersen / Olsen line", other:"By marriage" };
  const lineClass = { mick:"mick", moy:"moy", mill:"mill", nick:"nick", chr:"chr", other:"" };

  function relations(p) {
    const out = { Parents:[], Spouse:[], Children:[], Sibling:[], Grandchild:[], Grandparents:[] };
    links.forEach(l => {
      const s = l.source.id, t = l.target.id;
      if (l.type === "parent") { if (t === p.id) out.Parents.push(s); if (s === p.id) out.Children.push(t); }
      if (l.type === "spouse") { if (s === p.id) out.Spouse.push(t); if (t === p.id) out.Spouse.push(s); }
      if (l.type === "sibling") { if (s === p.id) out.Sibling.push(t); if (t === p.id) out.Sibling.push(s); }
      if (l.type === "grand") { if (s === p.id) out.Grandchild.push(t); if (t === p.id) out.Grandparents.push(s); }
    });
    return out;
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  // Card prose may use <b> and <i> for emphasis and titles; everything else stays text.
  // tools/check.js makes sure those tags are balanced, so none can run on past its paragraph.
  function rich(s) { return esc(s).replace(/&lt;(\/?)(b|i)&gt;/g, "<$1$2>"); }

  function renderPanel(p) {
    if (!p) {
      const direct = nodes.filter(n => n.direct).length;
      panel.innerHTML = `
        <div class="empty">
          <p class="eyebrow">Four lines, one family</p>
          <h2>From Metz, Norwich, and Denmark to Tamaqua and Highland Park</h2>
          <p class="lede">The Michelet family left Metz as Huguenots, became the Mickleys of Lehigh County, and hid the Liberty Bell in 1777. Their line reaches the Millets through Susanna Mickley’s daughter Catharine, who married Frederick Millet of Orwigsburg in Tamaqua about 1862. On Christine Nickerson’s side, the Nickersons run back through Bayonne, the Hudson Valley, and Ridgefield to William Nickerson, who founded Chatham on Cape Cod in the 1660s; the Christoffersens came from Denmark, and the Olsens from Egersund in Norway, to Chicago in the 1880s.</p>
          <div class="stat">
            <div><b>${nodes.length}</b><small>people on record</small></div>
            <div><b>${direct}</b><small>direct ancestors of Chris Millet</small></div>
            <div><b>${GEN_COUNT}</b><small>generations</small></div>
            <div><b>${nodes.filter(n => n.event).length}</b><small>tied to a notable event</small></div>
          </div>
          <p>Filled circles are direct ancestors of Chris Millet; outlined circles are their siblings, cousins, and children. Solid edges are parent to child, dashed edges are marriages, and dotted edges are links the records make likely but do not yet prove.</p>
          <p>A violet ring marks someone whose life touches a moment outside the family's own story — the 1637 crossing to Salem and the founding of Chatham, the Palatine landing of 1733, the raid of 1763, the Liberty Bell and Germantown, the Civil War, the immigrant wave of the 1880s, and Normandy to the Rhine.</p>
          <p>Click any circle to see what the records say and where each fact came from.</p>
        </div>`;
      return;
    }
    const rel = relations(p);
    const chips = (ids) => ids.map(id => `<button class="chip" data-id="${id}" type="button">${esc(labelOf(byId[id]))}</button>`).join("");
    const relRows = Object.entries(rel).filter(([,v]) => v.length).map(([k,v]) => `<dt>${k}</dt><dd><div class="rel">${chips(v)}</div></dd>`).join("");
    const factRows = Object.entries(p.facts || {}).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${rich(v)}</dd>`).join("");
    const roles = [
      p.direct ? `<span class="role direct">Direct ancestor</span>` : "",
      p.probable ? `<span class="role probable">Probable link</span>` : "",
      p.role ? `<span class="role">${esc(p.role)}</span>` : ""
    ].join("");
    const dates = [yearsOf(p), p.place].filter(Boolean).join(" · ");
    const sources = (p.sources || []).map(([t,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("");
    panel.innerHTML = `
      <p class="eyebrow ${lineClass[p.line]}">${p.lineLabel || lineName[p.line]}</p>
      <h2>${esc(p.name)}</h2>
      <p class="dates">${esc(dates)}</p>
      <div>${roles}</div>
      ${p.event ? `<div class="event-note"><p class="eyebrow">Notable event</p><h3>${esc(p.event.tag)}</h3><p>${rich(p.event.text)}</p></div>` : ""}
      ${p.lede ? `<p class="lede">${rich(p.lede)}</p>` : ""}
      <dl>${relRows}${factRows}</dl>
      ${sources ? `<h3 class="src">Records</h3><ul class="sources">${sources}</ul>` : ""}`;
    panel.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => focusOn(b.dataset.id)));
    panel.scrollTop = 0;
  }

  function focusOn(id) {
    select(id);
    const n = nodeById[id];   // not byId: the raw records have no position, which made this NaN
    const t = d3.zoomTransform(svg.node());
    const target = d3.zoomIdentity.translate(W/2 - n.x * t.k, H/2 - n.y * t.k).scale(t.k);
    svg.transition().duration(500).call(zoom.transform, target);
  }

  // direct-only filter
  const directOnly = document.getElementById("directOnly");
  directOnly.addEventListener("change", () => {
    const on = directOnly.checked;
    node.classed("hidden", n => on && !n.direct);
    link.classed("hidden", l => on && !(l.source.direct && l.target.direct && l.type !== "sibling"));
    sim.force("collide", d3.forceCollide(n => on ? 44 : (n.direct ? 52 : 60)).strength(0.95));
    sim.alpha(0.3).restart();
  });

  // search
  const q = document.getElementById("q"), ql = document.getElementById("qlist");
  let active = -1, matches = [];
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase();
    matches = v ? nodes.filter(n => n.name.toLowerCase().includes(v) || (n.place||"").toLowerCase().includes(v)).slice(0,8) : [];
    active = -1;
    ql.innerHTML = matches.map(n => `<li data-id="${n.id}" tabindex="-1">${esc(n.name)}<small>${esc(yearsOf(n))}</small></li>`).join("");
    ql.hidden = matches.length === 0;
    ql.querySelectorAll("li").forEach(li => li.addEventListener("mousedown", ev => { ev.preventDefault(); pick(li.dataset.id); }));
  });
  q.addEventListener("keydown", ev => {
    if (ql.hidden) return;
    if (ev.key === "ArrowDown") { active = Math.min(active+1, matches.length-1); mark(); ev.preventDefault(); }
    else if (ev.key === "ArrowUp") { active = Math.max(active-1, 0); mark(); ev.preventDefault(); }
    else if (ev.key === "Enter") { if (matches[Math.max(active,0)]) pick(matches[Math.max(active,0)].id); }
    else if (ev.key === "Escape") { ql.hidden = true; }
  });
  q.addEventListener("blur", () => setTimeout(() => ql.hidden = true, 120));
  function mark() { ql.querySelectorAll("li").forEach((li,i) => li.classList.toggle("active", i === active)); }
  function pick(id) { ql.hidden = true; q.value = byId[id].name; focusOn(id); }

  document.getElementById("reset").addEventListener("click", () => fit(true));

  // A stage with no width or height yields scale(0), and empty bounds yield NaN; either
  // one sticks and leaves the tree invisible. Measure first and defer the fit if the
  // numbers are not usable yet.
  let pendingFit = false;
  function measure() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (w > 0 && h > 0) { W = w; H = h; return true; }
    return false;
  }

  function fit(animate) {
    if (!measure()) { pendingFit = true; return; }
    // fit to the people actually drawn (plus their labels), not the whole canvas
    const shown = nodes.filter(n => !(directOnly.checked && !n.direct));
    const x0 = d3.min(shown, n => n.x) - 24, x1 = d3.max(shown, n => n.x + labelWidth(n)) + 12;
    const y0 = d3.min(shown, n => n.y) - bandH * 0.6, y1 = d3.max(shown, n => n.y) + bandH * 0.6;
    if (![x0, x1, y0, y1].every(Number.isFinite)) { pendingFit = true; return; }
    pendingFit = false;
    const bw = Math.max(600, x1 - x0), bh = Math.max(400, y1 - y0);
    const k = Math.min(W / bw, H / bh) * 0.985;
    const tx = (W - bw * k) / 2 - x0 * k, ty = (H - bh * k) / 2 - y0 * k;
    const t = d3.zoomIdentity.translate(tx, ty).scale(k);
    // Only the reader's own "Reset view" animates. An automatic fit applies at once: a
    // transition needs animation frames, and a stage that is collapsed or a tab that is
    // not being drawn may not be getting any, which would leave the fit silently unapplied.
    if (animate) svg.transition().duration(500).call(zoom.transform, t);
    else svg.call(zoom.transform, t);
  }

  // Run only a deferred fit, never a fresh one: an ordinary resize must not throw away
  // the pan and zoom the reader has set.
  const refitIfPending = () => { measure(); if (pendingFit) fit(false); };
  window.addEventListener("resize", refitIfPending);
  if (window.ResizeObserver) new ResizeObserver(refitIfPending).observe(stage);

  renderPanel(null);
  // settle the layout off-screen and draw it once. The simulation runs again only when
  // someone drags a person or switches to the direct line: animating every frame costs
  // a full redraw of the tree, which is what makes Safari lag.
  sim.stop();
  for (let i = 0; i < 400; i++) sim.tick();
  link.attr("d", pathFor);
  node.attr("transform", n => `translate(${n.x},${n.y})`);
  setTimeout(() => fit(false), 30);

  // ---------- Map view: rendering, time, and movement ----------
  (function mapView() {
    const mapSvg = d3.select("#map"), stageEl = document.querySelector(".stage");
    const tl = document.getElementById("timeline"), scrub = document.getElementById("scrub");
    const yearOut = document.getElementById("yearOut"), playBtn = document.getElementById("playBtn");
    const allBtn = document.getElementById("allBtn"), hintTree = document.getElementById("hintTree");
    const btnTree = document.getElementById("viewTree"), btnMap = document.getElementById("viewMap");

    const gMap = mapSvg.append("g");
    const gLand = gMap.append("g"), gGeo = gMap.append("g"), gArcs = gMap.append("g"), gDots = gMap.append("g");
    // the family packs into a few square miles of Pennsylvania, so panning and zooming is
    // not a nicety here — at continental scale a dozen places sit on one pixel
    let k = 1;
    let userDrove = false, camK = 1, camC = [0, 0], camSide = null;
    const mapZoom = d3.zoom().scaleExtent([1, 60]).on("zoom", ev => {
      k = ev.transform.k; gMap.attr("transform", ev.transform); scaleMarks();
      if (ev.sourceEvent) userDrove = true;   // a real gesture takes the camera off auto
    });
    mapSvg.call(mapZoom);
    const proj = d3.geoMercator(), path = d3.geoPath(proj);
    // the frame the family actually occupies: Missouri and Chicago in the west, Slovakia in the east,
    // Norway in the north — anything outside it is scenery
    // a MultiPoint, not a Polygon: d3 reads polygon winding spherically, and the wrong
    // direction makes it fit the whole globe instead of this corner of it
    const FRAME = { type:"MultiPoint", coordinates:[[-93,36],[22,36],[22,61],[-93,61]] };

    let mode = "all", year = 2030, timer = null, selected = null;
    const HAS_MAP = Object.keys(GEO);

    function sizeMap() {
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      if (!w || !h) return false;
      mapSvg.attr("viewBox", `0 0 ${w} ${h}`);
      proj.fitExtent([[18, 18], [w - 18, h - 74]], FRAME);
      gLand.selectAll("path").attr("d", path);
      return true;
    }

    gLand.selectAll("path").data(LAND.features).join("path").attr("class", "land");
    gGeo.selectAll("text").data(GEOLABELS).join("text")
        .attr("class", d => "geolabel " + (d.t === "c" ? "country" : "town")).text(d => d.n);

    // where a person is in a given year, and whether they are alive to be anywhere
    function locate(id, y) {
      const g = GEO[id]; if (!g) return null;
      if (mode === "all") return { place: g.stops[g.stops.length - 1].p, est: g.stops[g.stops.length - 1].e };
      if (y < g.b || (g.d && y > g.d)) return null;
      let cur = g.stops[0];
      for (const s of g.stops) { if (s.y <= y) cur = s; }
      return { place: cur.p, est: cur.e || g.bEst };
    }

    function census(y) {
      const at = new Map();
      for (const id of HAS_MAP) {
        const l = locate(id, y); if (!l) continue;
        if (!at.has(l.place)) at.set(l.place, []);
        at.get(l.place).push({ id, est: l.est });
      }
      return at;
    }

    const rOf = n => 4 + Math.sqrt(n) * 4.2;
    const lineOf = id => (byId[id] && byId[id].line) || "other";
    const LINE_VAR = { mick:"--mickley", mill:"--millet", moy:"--moyer", nick:"--nick", chr:"--chr", other:"--ink-3" };
    function dominantColour(list) {
      const c = {}; list.forEach(p => { const l = lineOf(p.id); c[l] = (c[l] || 0) + 1; });
      const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0][0];
      return `var(${LINE_VAR[top] || "--ink-3"})`;
    }

    function draw(animateFrom) {
      if (!sizeMap()) return;
      const at = census(year);
      const data = [...at.entries()].map(([k, list]) => {
        const pl = PLACES[k], xy = proj([pl.lon, pl.lat]);
        return { key: k, name: pl.n, x: xy[0], y: xy[1], list, n: list.length };
      }).sort((a, b) => b.n - a.n);

      const sel = gDots.selectAll("g.placedot").data(data, d => d.key);
      sel.exit().remove();
      const ent = sel.enter().append("g").attr("class", "placedot");
      ent.append("circle").attr("class", "halo");
      ent.append("circle").attr("class", "core");
      ent.append("text");
      const all = ent.merge(sel);
      all.attr("transform", d => `translate(${d.x},${d.y})`)
         .classed("sel", d => d.key === selected)
         .attr("tabindex", 0).attr("role", "button")
         .attr("aria-label", d => `${d.name}, ${d.n} ${d.n === 1 ? "person" : "people"}`);
      all.select("circle.core").attr("fill", d => dominantColour(d.list));
      all.select("text").text(labelText);
      all.on("click", (ev, d) => { selected = d.key; showPlace(d); draw(); });

      scaleMarks();
      if (animateFrom != null) flights(animateFrom, year);
    }

    const labelText = d => d.n > 1 ? `${d.name} · ${d.n}` : d.name;
    // Each label's on-screen width, measured once per distinct text at its on-screen size.
    // Measuring inside the zoom loop forced a full page layout for every label on every
    // frame of a zoom. New texts (the counts change with the year) are measured together,
    // in one layout; the cache is dropped when a web font arrives and changes the widths.
    const measurer = mapSvg.append("g").attr("class", "labelmeasure").attr("aria-hidden", "true")
      .style("visibility", "hidden");
    const textWidth = new Map();
    if (document.fonts) document.fonts.addEventListener("loadingdone", () => textWidth.clear());
    function measureLabels(texts) {
      const todo = [...new Set(texts)].filter(t => !textWidth.has(t));
      if (!todo.length) return;
      measurer.selectAll("text").data(todo).join("text").style("font-size", "10.5px").text(t => t)
        .each(function (t) { const w = this.getComputedTextLength(); if (w > 0) textWidth.set(t, w); });   // 0 = not laid out yet
    }

    // keep marks a constant size on screen, and only label what there is room for:
    // at continental zoom that means the bigger places, and everything once you zoom in
    function scaleMarks() {
      const s = 1 / k;
      // the coastline is generalised, so it turns blocky as you go in and stops being
      // information — let it recede rather than compete with the family
      const landOp = Math.max(0.3, Math.min(1, 1 - (k - 5) / 22));
      gLand.selectAll("path").style("stroke-width", (0.7 * s) + "px").style("opacity", landOp);
      const boxes = [];
      const marks = [];
      gDots.selectAll("g.placedot").each(function (d) {
        const g = d3.select(this), r = rOf(d.n) * s;
        g.select("circle.core").attr("r", r).style("stroke-width", (1.3 * s) + "px");
        g.select("circle.halo").attr("r", r + 5 * s);
        if (d.key === selected) g.select("circle.core").style("stroke-width", (2.6 * s) + "px");
        marks.push({ d, g, r });
      });
      measureLabels(marks.map(m => labelText(m.d)));
      // biggest places get first claim on the label space; the rest give way rather than overlap
      marks.sort((a, b) => (b.d.key === selected) - (a.d.key === selected) || b.d.n - a.d.n);
      marks.forEach(({ d, g, r }) => {
        const txt = g.select("text")
          .attr("x", r + 5 * s).attr("y", 3.6 * s)
          .style("font-size", (10.5 * s) + "px")
          .style("stroke-width", (2.6 * s) + "px");
        const wanted = d.n >= 3 || k > 2.2 || d.key === selected;
        if (!wanted) { txt.attr("display", "none"); return; }
        // in screen pixels, where the crowding actually happens
        const len = textWidth.get(labelText(d)) || 40;
        const bx = (d.x + r + 5 * s) * k, by = d.y * k;
        const box = [bx, by - 7, bx + len, by + 7];
        const hit = boxes.some(o => !(box[2] < o[0] || box[0] > o[2] || box[3] < o[1] || box[1] > o[3]));
        if (hit && d.key !== selected) { txt.attr("display", "none"); return; }
        boxes.push(box); txt.attr("display", null);
      });
      gArcs.selectAll("path.flight").style("stroke-width", (1.6 * s) + "px");

      // where a bubble is, the basemap gets out of the way
      const taken = marks.map(({ d, r }) => {
        const xy = proj([PLACES[d.key].lon, PLACES[d.key].lat]);
        return [xy[0], xy[1], r];
      });
      gGeo.selectAll("text").each(function (d) {
        const xy = proj([d.lo, d.la]), el = d3.select(this);
        const pad = (d.t === "c" ? 16 : 42) * s;
        const clash = taken.some(([x, y, r]) => Math.hypot(xy[0] - x, xy[1] - y) < r + pad);
        const wanted = d.t === "c" ? k < 5 : k > 2.4;
        el.attr("x", xy[0]).attr("y", xy[1])
          .style("font-size", ((d.t === "c" ? 11 : 9.5) * s) + "px")
          .style("letter-spacing", (d.t === "c" ? 0.14 * 11 * s : 0) + "px")
          .attr("display", (wanted && !clash) ? null : "none");
      });
    }

    // an arc for every crossing that happens in the span just scrubbed past
    function flights(from, to) {
      const moves = [];
      for (const id of HAS_MAP) {
        const g = GEO[id];
        for (const s of g.stops) {
          if (s.y > from && s.y <= to) {
            const i = g.stops.indexOf(s); if (i === 0) continue;
            const a = PLACES[g.stops[i - 1].p], b = PLACES[s.p];
            if (a && b && a !== b) moves.push({ a, b, est: s.e });
          }
        }
      }
      moves.slice(0, 40).forEach(m => {
        const p0 = proj([m.a.lon, m.a.lat]), p1 = proj([m.b.lon, m.b.lat]);
        const dx = p1[0] - p0[0], dy = p1[1] - p0[1], dr = Math.hypot(dx, dy) * 1.6;
        if (dr < 6) return;
        const d = `M${p0[0]},${p0[1]}A${dr},${dr} 0 0,1 ${p1[0]},${p1[1]}`;
        const arc = gArcs.append("path").attr("class", "flight" + (m.est ? " est" : "")).attr("d", d);
        const len = arc.node().getTotalLength();
        arc.attr("stroke-dasharray", m.est ? "3 4" : `${len} ${len}`)
           .attr("stroke-dashoffset", m.est ? 0 : len).attr("opacity", 0.95)
           .transition().duration(1500).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0)
           .transition().delay(2600).duration(1400).attr("opacity", 0).remove();
        const dot = gArcs.append("circle").attr("class", "flightdot").attr("r", 3);
        dot.transition().duration(1500).ease(d3.easeCubicOut)
           .attrTween("transform", () => t2 => {
             const q = arc.node().getPointAtLength(t2 * len); return `translate(${q.x},${q.y})`;
           })
           .transition().duration(500).attr("r", 0).remove();
      });
    }


    // ---- Camera ----
    // A fixed wide shot wastes the whole nineteenth century, when the family is packed into a
    // few square miles of Schuylkill County. The camera frames where the living actually are,
    // weighted by headcount so a lone emigrant in Illinois does not drag the whole view west,
    // and opens out to the Atlantic on its own whenever a crossing puts people on both sides.
    function cameraFor(y, mustSee) {
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      if (!w || !h) return null;
      const side = lon => lon > -30 ? "eu" : "am";
      const grp = { eu: [], am: [] };
      for (const [key, list] of census(y)) {
        const pl = PLACES[key], xy = proj([pl.lon, pl.lat]);
        grp[side(pl.lon)].push([xy[0], xy[1], list.length]);
      }
      const wEu = d3.sum(grp.eu, q => q[2]), wAm = d3.sum(grp.am, q => q[2]);
      if (!wEu && !wAm) return null;

      // a crossing in flight has to be framed whole; otherwise follow whichever side of the
      // Atlantic the family actually is, so the nineteenth century plays out over Pennsylvania
      // rather than over an ocean nobody is crossing
      const seeSides = new Set((mustSee || []).map(q => q[0] < proj([-30, 50])[0] ? "am" : "eu"));
      const straddles = seeSides.size > 1;

      // when the family is split with nobody crossing, do not sit on the ocean between them:
      // follow the side where something is actually happening, and stay there until the other
      // side clearly outweighs it, so the camera cuts rather than dithers
      let pts;
      if (straddles) { pts = grp.eu.concat(grp.am); camSide = null; }
      else {
        // The migration only runs one way. Before it, the camera is in Europe; once half the
        // family is across it settles in America and stays, rather than cutting back every time
        // a Michelet generation swells in Metz. Only America emptying brings it home again.
        let want;
        if (!wAm) want = "eu";
        else if (!wEu) want = "am";
        else if (camSide === "am") want = wAm / (wAm + wEu) >= 0.3 ? "am" : "eu";
        else want = wAm > wEu ? "am" : "eu";   // stay in Europe until America genuinely leads
        if (!grp[want].length) want = grp.eu.length ? "eu" : "am";
        camSide = want; pts = grp[want];
      }
      if (!pts.length) pts = grp.eu.concat(grp.am);

      const tot = d3.sum(pts, q => q[2]);
      const cx = d3.sum(pts, q => q[0] * q[2]) / tot, cy = d3.sum(pts, q => q[1] * q[2]) / tot;
      // a weighted spread, not a bounding box: one emigrant in Illinois is visible at the edge
      // but does not get to drag the whole shot west
      const sx = Math.sqrt(d3.sum(pts, q => q[2] * (q[0] - cx) ** 2) / tot);
      const sy = Math.sqrt(d3.sum(pts, q => q[2] * (q[1] - cy) ** 2) / tot);
      const spread = straddles ? 2.4 : (camSide === "am" ? 1.5 : 1.85);
      let x0 = cx - sx * spread, x1 = cx + sx * spread;
      let y0 = cy - sy * spread, y1 = cy + sy * spread;
      (mustSee || []).forEach(q => {
        x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]);
        y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
      });
      const bw = Math.max(x1 - x0, 45), bh = Math.max(y1 - y0, 45);
      const kk = Math.max(1, Math.min(40, Math.min((w - 90) / bw, (h - 150) / bh)));
      return { k: kk, c: [(x0 + x1) / 2, (y0 + y1) / 2] };
    }

    // frame exactly these points and nothing else — used for an event, where the shot is
    // the scene rather than the family's centre of gravity
    function cameraOnPoints(pts, dur) {
      if (userDrove || !pts.length) return;
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      if (!w || !h) return;
      const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const bw = Math.max(x1 - x0, 55), bh = Math.max(y1 - y0, 55);
      const kk = Math.max(1, Math.min(40, Math.min((w - 240) / bw, (h - 240) / bh)));
      const c = [(x0 + x1) / 2, (y0 + y1) / 2];
      camK = kk; camC = c;
      camSide = c[0] > proj([-30, 50])[0] ? "eu" : "am";
      const tr = d3.zoomIdentity.translate(w / 2, h / 2).scale(kk).translate(-c[0], -c[1]);
      if (document.hidden) mapSvg.call(mapZoom.transform, tr);
      else mapSvg.transition().duration(dur == null ? 2000 : dur).ease(d3.easeCubicInOut)
                 .call(mapZoom.transform, tr);
    }

    // the places an event is actually about
    function eventPoints(evs, y) {
      const ids = new Set();
      evs.forEach(e => {
        const named = EVENT_PLACE[e.tag];
        if (named) named.forEach(k => ids.add(k));
        else e.ids.forEach(id => { const l = locate(id, y); if (l) ids.add(l.place); });
      });
      return [...ids].filter(k => PLACES[k]).map(k => proj([PLACES[k].lon, PLACES[k].lat]));
    }

    function moveCamera(y, mustSee, dur) {
      if (userDrove || mode === "all") return;
      const t2 = cameraFor(y, mustSee); if (!t2) return;
      const moved = Math.hypot(t2.c[0] - camC[0], t2.c[1] - camC[1]) * camK;
      const zoomed = Math.abs(Math.log(t2.k / camK));
      if (moved < 95 && zoomed < 0.22) return;      // hold the shot unless it has really changed
      camK = t2.k; camC = t2.c;
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      const tr = d3.zoomIdentity.translate(w / 2, h / 2).scale(t2.k).translate(-t2.c[0], -t2.c[1]);
      // a transition needs animation frames, and a hidden tab gets none — apply the shot
      // outright in that case so the camera is never left behind the clock
      if (document.hidden) mapSvg.call(mapZoom.transform, tr);
      else mapSvg.transition().duration(dur == null ? 2400 : dur).ease(d3.easeCubicInOut)
                 .call(mapZoom.transform, tr);
    }

    // the places a year's moves and events touch, which the camera must keep in frame
    function focusPoints(from, to) {
      const out = [];
      for (const id of HAS_MAP) {
        for (const s of GEO[id].stops) {
          if (s.y > from && s.y <= to) {
            const i = GEO[id].stops.indexOf(s);
            const a = i > 0 ? PLACES[GEO[id].stops[i - 1].p] : null, b = PLACES[s.p];
            if (a) out.push(proj([a.lon, a.lat]));
            if (b) out.push(proj([b.lon, b.lat]));
          }
        }
      }
      return out;   // migrations only; an event frames itself through cameraOnPoints
    }

    function showPlace(d) {
      const chips = d.list.map(p =>
        `<button class="chip" data-id="${p.id}" type="button">${esc(labelOf(byId[p.id]))}</button>`).join("");
      const when = mode === "all" ? "at their last recorded home" : `living here in ${year}`;
      panel.innerHTML = `
        <p class="eyebrow">Place</p>
        <h2>${esc(d.name)}</h2>
        <p class="dates">${d.n} ${d.n === 1 ? "person" : "people"} ${esc(when)}</p>
        <div class="rel">${chips}</div>`;
      panel.querySelectorAll(".chip").forEach(b =>
        b.addEventListener("click", () => { setView("tree"); focusOn(b.dataset.id); }));
      panel.scrollTop = 0;
    }

    function setYear(y, animate) {
      const from = year; mode = "year"; year = y;
      scrub.value = y; yearOut.textContent = y;
      draw(animate ? from : null);
      if (animate) moveCamera(y, focusPoints(from, y));
    }
    function setAll() {
      stop(); mode = "all"; year = 2030; scrub.value = 2030;
      yearOut.textContent = "everyone"; selected = null; hideEventCard();
      mapSvg.call(mapZoom.transform, d3.zoomIdentity);   // back to the whole Atlantic
      gArcs.selectAll("*").remove(); draw();
    }
    function stop() { if (timer) { timer.stop(); timer = null; } playBtn.textContent = "▶"; hideEventCard(); awaitingCard = false; }
    function play() {
      if (timer) return stop();
      userDrove = false;
      if (mode === "all" || year >= 2030) setYear(1550, false);
      moveCamera(year, [], 900);
      playBtn.textContent = "❚❚";
      let last = 0;
      timer = d3.timer(el => {
        if (awaitingCard) return;                // held on an event until the reader continues
        if (el - last < 110) return; last = el;
        const next = year + 1;
        if (next >= 2030) { setYear(2030, true); stop(); return; }
        setYear(next, true);
        const evs = EVENT_AT.get(next);
        if (evs) {
          showEventCard(evs, next); awaitingCard = true;
          cameraOnPoints(eventPoints(evs, next), 1800);   // settle on the scene itself
        }
      });
    }

    const EVENT_AT = new Map();
    (function buildEvents() {
      const byTag = new Map();
      for (const [id, e] of Object.entries(EVENTS)) {
        if (!byTag.has(e.tag)) byTag.set(e.tag, { tag: e.tag, text: e.text, ids: [] });
        byTag.get(e.tag).ids.push(id);
      }
      for (const e of byTag.values()) {
        const y = EVENT_YEAR[e.tag] || (e.tag.match(/\b(1[5-9]\d\d)\b/) || [])[1];
        if (!y) continue;
        const yr = +y;
        if (!EVENT_AT.has(yr)) EVENT_AT.set(yr, []);
        EVENT_AT.get(yr).push(e);
      }
    })();

    const card = document.getElementById("eventCard");
    const ecNext = document.getElementById("ecNext");
    let awaitingCard = false, cardQueue = null, cardIdx = 0, cardYear = 0;
    // 1777 carries three events and 1863 two, so a year can hold more than one card;
    // show them in turn rather than dropping all but the first
    // the clock waits on the reader, not on a stopwatch
    function showEventCard(list, y) { cardQueue = list; cardYear = y; cardIdx = 0; renderCard(); }
    function renderCard() {
      const e = cardQueue[cardIdx], y = cardYear;
      document.getElementById("ecYear").textContent =
        cardQueue.length > 1 ? `${y} · Notable event ${cardIdx + 1} of ${cardQueue.length}` : `${y} · Notable event`;
      const names = e.ids.map(id => byId[id] ? byId[id].name : id);
      document.getElementById("ecWho").textContent =
        names.length > 4 ? names.slice(0, 4).join(" · ") + ` · and ${names.length - 4} more` : names.join(" · ");
      document.getElementById("ecTag").textContent = e.tag;
      document.getElementById("ecText").textContent = e.text;
      ecNext.textContent = cardIdx + 1 < cardQueue.length ? "Next" : "Continue";
      // set opacity outright as well as adding the class: the transition smooths it when
      // frames are running, but the card must never be left invisible while the clock waits
      card.removeAttribute("hidden"); card.style.opacity = "";
      requestAnimationFrame(() => { card.classList.add("show"); card.style.opacity = "1"; });
      setTimeout(() => { if (cardQueue) card.style.opacity = "1"; }, 60);
    }
    ecNext.addEventListener("click", () => {
      if (cardQueue && cardIdx + 1 < cardQueue.length) { cardIdx++; renderCard(); return; }
      hideEventCard(); awaitingCard = false;
    });

    function hideEventCard() {
      cardQueue = null; card.classList.remove("show");
      card.style.opacity = ""; card.setAttribute("hidden", "");
    }

    playBtn.addEventListener("click", play);
    allBtn.addEventListener("click", setAll);
    scrub.addEventListener("input", () => {
      stop(); userDrove = false; setYear(+scrub.value, false);
      moveCamera(+scrub.value, [], 600);
    });

    function setView(v) {
      const isMap = v === "map";
      // SVG elements do not implement the HTML `hidden` property, so set the attribute directly
      const show = (el, on) => on ? el.removeAttribute("hidden") : el.setAttribute("hidden", "");
      show(document.getElementById("svg"), !isMap);
      show(document.getElementById("map"), isMap);
      show(tl, isMap); show(hintTree, !isMap);
      btnMap.classList.toggle("on", isMap); btnTree.classList.toggle("on", !isMap);
      if (isMap) { setAll(); } else { stop(); }
    }
    setView("tree");
    btnTree.addEventListener("click", () => setView("tree"));
    btnMap.addEventListener("click", () => setView("map"));
    window.addEventListener("resize", () => { if (!document.getElementById("map").hasAttribute("hidden")) draw(); });
    if (window.ResizeObserver) new ResizeObserver(() => {
      if (!document.getElementById("map").hasAttribute("hidden")) draw();
    }).observe(stageEl);
  })();

})();
</script>

</body>
</html>
